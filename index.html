/* =================================================================
   VUE COMBINÉE D'UNE AUDIENCE (les deux collèges réunis)
   ------------------------------------------------------------------
   Demande de l'utilisateur : sur une audience, tout le monde doit voir
   TOUS les conseillers concernés (salariés ET employeurs — 2 pour un BCO,
   4 pour un BJ), alors que chaque ligne de state.planning/adminBuffer.
   planning ne porte jamais que les conseillers d'UN SEUL collège (voir
   openPlanningForm/openAdminAudienceForm : chaque président de collège ne
   saisit que ses propres conseillers). Le président et le vice-président
   voient donc désormais tout, mais ne peuvent modifier que leur propre
   collège — un clic ouvre une vue de détail en lecture seule
   (openAudienceDetail) avec un seul bouton d'édition, vers leur propre
   ligne. Côté espace administrateur, qui n'est jamais restreint à un
   collège, pas de détour par cette vue de détail : un clic ouvre
   directement le formulaire de modification, avec les champs des DEUX
   collèges déjà affichés côte à côte (openAdminAudienceForm — gain de
   temps demandé par l'utilisateur), et les audiences incomplètes sont
   signalées en rouge dans la liste comme pour président/vice-président.
   ================================================================= */

/* Regroupe des lignes de planning (state.planning ou adminBuffer.planning)
   par audience réelle (même date + même type), en conservant la ligne de
   CHAQUE collège séparément (byCollege) plutôt que de les fusionner en une
   seule liste de rôles comme mergePlanningEntriesForDisplay ci-dessous —
   nécessaire ici pour pouvoir rouvrir précisément la ligne d'un collège
   donné en modification. */
function groupPlanningByAudience(records){
  var groups = {}, order = [];
  records.forEach(function(pl){
    var key = pl.date+"|"+pl.type;
    if(!groups[key]){ groups[key] = { date: pl.date, type: pl.type, presidence: pl.presidence, byCollege: {} }; order.push(key); }
    groups[key].byCollege[pl.college] = pl;
    /* La présidence est dupliquée sur les deux lignes (chaque collège
       enregistre sa propre copie) ; en cas de désaccord entre les deux
       (rare — normalement saisi de façon cohérente des deux côtés), on
       fait confiance à la copie du collège qui préside réellement,
       comme mergePlanningEntriesForDisplay. */
    if(pl.college===pl.presidence) groups[key].presidence = pl.presidence;
  });
  return order.map(function(k){ return groups[k]; }).sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date ? -1 : 1;
    return (PLANNING_TYPE_ORDER[a.type]||0) - (PLANNING_TYPE_ORDER[b.type]||0);
  });
}

/* Forme « fusionnée » minimale d'un groupe (voir groupPlanningByAudience),
   pour pouvoir réutiliser mergedEntryCompleteness ci-dessous sans dupliquer
   son calcul de complétude côté vue combinée. */
function mergedRecordFromGroup(group){
  var presidingEntry = group.byCollege[group.presidence] || null;
  var assesseurs = [];
  COLLEGES.forEach(function(c){ var e = group.byCollege[c]; if(e) assesseurs = assesseurs.concat(e.assesseurs||[]); });
  return { type: group.type, president: presidingEntry ? presidingEntry.president : null, assesseurs: assesseurs };
}

/* Liste ordonnée { role, name } de tous les conseillers d'une audience
   groupée, collège par collège — le nom porte déjà la mention (S)/(E) via
   resolveMemberNameIn, donc pas besoin de la répéter dans le rôle. */
function audienceRosterLines(group, members){
  var lines = [];
  COLLEGES.forEach(function(col){
    var entry = group.byCollege[col];
    if(!entry) return;
    if(entry.president) lines.push({ role:"Président", name: resolveMemberNameIn(members, entry.president) });
    (entry.assesseurs||[]).forEach(function(a, i){
      lines.push({ role: (entry.assesseurs.length>1 ? "Assesseur "+(i+1) : "Assesseur"), name: resolveMemberNameIn(members, a) });
    });
  });
  return lines;
}

/* Sheet de détail d'une audience groupée : affiche TOUJOURS les deux
   collèges réunis, et propose un bouton de modification par collège
   présent dans opts.editableColleges — un seul (le sien) pour un
   président/vice-président de section (voir renderers["planification"]).
   L'espace administrateur, qui n'est jamais restreint à un collège, ne
   passe plus par cette vue de détail depuis renderers["admin-section"] —
   voir openAdminAudienceForm, qui ouvre directement le formulaire de
   modification des deux collèges. opts : { members, editableColleges:[...], onEdit(college) }. */
function openAudienceDetail(group, opts){
  opts = opts || {};
  var members = opts.members || state.sectionMembers;
  var editableColleges = opts.editableColleges || [];
  var body = h("div", null);
  var sub = planningTypeLabel(group.type)+" · Présidence "+(group.presidence==="Salarié"?"salariée":group.presidence==="Employeur"?"employeur":"—");
  body.appendChild(h("p", {class:"lede"}, sub));

  var panel = h("div", {class:"panel"});
  var lines = audienceRosterLines(group, members);
  if(!lines.length){
    panel.appendChild(h("p", {class:"lede", style:"margin:0"}, "Aucun conseiller renseigné pour l’instant."));
  } else {
    lines.forEach(function(l){
      panel.appendChild(h("div", {style:"margin-bottom:10px"},
        h("div", {class:"field-label"}, l.role),
        h("div", null, l.name)
      ));
    });
  }
  COLLEGES.forEach(function(col){
    if(!group.byCollege[col]){
      panel.appendChild(h("div", {class:"footnote", style: lines.length ? "margin-top:2px" : "margin-top:8px"}, "Collège "+col.toLowerCase()+" : rien renseigné pour l’instant."));
    }
  });
  body.appendChild(panel);

  if(mergedEntryCompleteness(mergedRecordFromGroup(group)).incomplete){
    body.appendChild(h("p", {class:"footnote", style:"margin-top:8px;color:var(--red)"}, "⚠ Audience incomplète — il manque au moins un conseiller."));
  }

  editableColleges.forEach(function(col, i){
    body.appendChild(h("button", {class:"sheet-btn "+(i===0 ? "accent" : "ghost"), style:"margin-top:10px", onclick:function(){ opts.onEdit(col); }},
      editableColleges.length>1 ? "Modifier le collège "+col : "Modifier mes conseillers ("+col+")"
    ));
  });
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:closeSheet}, "Fermer"));

  openSheet(planningDateLabel(group.date), body);
}

/* Formulaire combiné de l'espace administrateur pour une audience : à la
   différence de président/vice-président de section (restreints à leur
   propre collège, voir openPlanningForm et openAudienceDetail ci-dessus),
   l'administrateur n'est jamais restreint à un collège — un clic sur une
   audience l'amène donc DIRECTEMENT en modification, avec les champs des
   DEUX collèges déjà affichés côte à côte (gain de temps demandé par
   l'utilisateur : « il est déjà en mode modification et voit les 2 ou 4
   champs de conseillers »), plutôt que de passer par une vue de détail
   intermédiaire en lecture seule. group vient de groupPlanningByAudience,
   ou est un groupe vide ({date:"", type:"bj", presidence:…, byCollege:{}})
   pour une toute nouvelle audience (« + Ajouter une date »). */
function openAdminAudienceForm(group){
  var isEdit = !!(group.byCollege["Salarié"] || group.byCollege["Employeur"]);
  var ids = {};
  COLLEGES.forEach(function(c){ ids[c] = group.byCollege[c] ? group.byCollege[c].id : uid(); });

  var form = h("div", null);

  form.appendChild(h("label", {class:"field-label"}, "Type"));
  var typeSel = h("select", null, PLANNING_TYPES.map(function(t){
    return h("option", {value:t.id, selected: t.id===group.type ? "selected" : null}, t.label);
  }));
  form.appendChild(typeSel);

  form.appendChild(h("label", {class:"field-label", style:"margin-top:14px"}, "Date"));
  var dateInput = h("input", {type:"date", value:group.date||""});
  form.appendChild(dateInput);

  form.appendChild(h("label", {class:"field-label", style:"margin-top:14px"}, "Statut"));
  var presidenceSel = h("select", null, COLLEGES.map(function(c){
    return h("option", {value:c, selected: c===group.presidence ? "selected" : null}, "Présidence "+(c==="Salarié"?"salariée":"employeur"));
  }));
  form.appendChild(presidenceSel);

  var collegeBoxes = {};
  COLLEGES.forEach(function(col){
    form.appendChild(h("label", {class:"field-label", style:"margin-top:18px;font-weight:700"}, "Collège "+col));
    var box = h("div", {style:"margin-top:6px"});
    form.appendChild(box);
    collegeBoxes[col] = box;
  });

  /* selsByCollege[col] = { president: selectOrNull, assesseurs:[selects] } —
     un jeu de champs par collège, construit indépendamment (voir
     updateRolesForCollege) puisque chaque collège a ses propres candidats
     et sa propre répartition président/assesseurs selon qui préside. */
  var selsByCollege = {};

  function updateRolesForCollege(col){
    var box = collegeBoxes[col];
    clear(box);
    var type = typeSel.value;
    var presides = col === presidenceSel.value;
    var candidates = rankedCandidatesIn(adminBuffer.sectionMembers, adminBuffer.planning, col, type);
    var presidentSel = null, assesseurSels = [];

    function roleSelect(){
      var opts = [ h("option", {value:"", selected:"selected"}, "— Choisir —") ];
      candidates.forEach(function(c){ opts.push(h("option", {value:c.id}, candidateOptionLabel(c, type))); });
      return h("select", null, opts);
    }

    if(candidates.length===0){
      box.appendChild(h("div", {class:"footnote"}, "Aucun conseiller enregistré dans ce collège — ajoutez-le d’abord dans l’annuaire ci-dessus."));
    }

    if(type==="bj"){
      if(presides){
        box.appendChild(h("label", {class:"field-label"}, "Président"));
        presidentSel = roleSelect(); box.appendChild(presidentSel);
        box.appendChild(h("label", {class:"field-label", style:"margin-top:10px"}, "Assesseur"));
        var a1 = roleSelect(); box.appendChild(a1);
        assesseurSels = [a1];
      } else {
        box.appendChild(h("label", {class:"field-label"}, "1er assesseur"));
        var b1 = roleSelect(); box.appendChild(b1);
        box.appendChild(h("label", {class:"field-label", style:"margin-top:10px"}, "2e assesseur"));
        var b2 = roleSelect(); box.appendChild(b2);
        assesseurSels = [b1, b2];
      }
    } else {
      if(presides){
        box.appendChild(h("label", {class:"field-label"}, "Président"));
        presidentSel = roleSelect(); box.appendChild(presidentSel);
      } else {
        box.appendChild(h("label", {class:"field-label"}, "Assesseur"));
        var c1 = roleSelect(); box.appendChild(c1);
        assesseurSels = [c1];
      }
    }

    var existing = group.byCollege[col];
    if(existing){
      if(presidentSel && existing.president && candidates.some(function(c){ return c.id===existing.president; })){
        presidentSel.value = existing.president;
      }
      assesseurSels.forEach(function(sel, i){
        var val = existing.assesseurs && existing.assesseurs[i];
        if(val && candidates.some(function(c){ return c.id===val; })) sel.value = val;
      });
    }

    selsByCollege[col] = { president: presidentSel, assesseurs: assesseurSels };
  }
  function updateAllRoles(){ COLLEGES.forEach(updateRolesForCollege); }
  typeSel.addEventListener("change", updateAllRoles);
  presidenceSel.addEventListener("change", updateAllRoles);
  updateAllRoles();

  var actions = h("div", {style:"margin-top:18px"});
  actions.appendChild(h("button", {class:"sheet-btn primary", onclick:function(){
    if(!dateInput.value){ toast("Choisissez une date."); return; }

    var picked = [];
    COLLEGES.forEach(function(col){
      var s = selsByCollege[col];
      if(s.president && s.president.value) picked.push(s.president.value);
      s.assesseurs.forEach(function(sel){ if(sel.value) picked.push(sel.value); });
    });
    var dupes = picked.filter(function(v, i){ return picked.indexOf(v)!==i; });
    if(dupes.length){ toast("Une même personne ne peut pas occuper deux rôles pour cette date."); return; }

    COLLEGES.forEach(function(col){
      var s = selsByCollege[col];
      var president = s.president && s.president.value ? s.president.value : null;
      var assesseurs = s.assesseurs.map(function(sel){ return sel.value; }).filter(Boolean);
      var existing = group.byCollege[col];
      if(!president && !assesseurs.length && !existing) return; // rien à créer pour ce collège si rien n'a été renseigné

      var entry = {
        id: ids[col],
        type: typeSel.value,
        date: dateInput.value,
        college: col,
        presidence: presidenceSel.value,
        president: president,
        assesseurs: assesseurs,
        importSourceId: existing ? (existing.importSourceId||null) : null
      };
      if(existing){
        adminBuffer.planning = adminBuffer.planning.map(function(p){ return p.id===entry.id ? entry : p; });
      } else {
        adminBuffer.planning.push(entry);
      }
    });

    closeSheet();
    render("sysadmin-section-planning");
    toast((isEdit ? "Date modifiée" : "Date ajoutée")+" — pensez à « Enregistrer et synchroniser ».");
  }}, isEdit ? "Enregistrer les modifications" : "Ajouter la date"));

  if(isEdit){
    actions.appendChild(h("button", {class:"sheet-btn danger", onclick:function(){
      var idsToRemove = COLLEGES.map(function(c){ return ids[c]; });
      adminBuffer.planning = adminBuffer.planning.filter(function(p){ return idsToRemove.indexOf(p.id)===-1; });
      closeSheet(); render("sysadmin-section-planning"); toast("Audience supprimée — pensez à « Enregistrer et synchroniser ».");
    }}, "Supprimer cette audience"));
  }
  actions.appendChild(h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler"));
  form.appendChild(actions);

  openSheet(isEdit ? "Modifier l’audience" : "Nouvelle audience", form);
}

/* Fusionne, pour un même jour et un même type d'audience, l'enregistrement
   de chaque collège (chaque co-président ne saisit que les conseillers de
   son propre collège dans « Outil de planification ») en une seule ligne
   réunissant tous les conseillers renseignés, quel que soit leur collège
   — plutôt que de n'en montrer que la moitié selon qui a saisi la ligne.
   Le président effectif est celui du côté qui préside (college===
   presidence) ; les assesseurs des deux côtés sont additionnés. Un BJ
   attend au total 1 président + 3 assesseurs (1 du côté présidence, 2 de
   l'autre côté) ; un BCO/BCO MEE attend 1 président + 1 assesseur. */
function mergePlanningEntriesForDisplay(records){
  var groups = {}, order = [];
  records.forEach(function(pl){
    var key = pl.date+"|"+pl.type;
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(pl);
  });
  var merged = order.map(function(key){
    var recs = groups[key];
    var presidingRec = recs.filter(function(r){ return r.college===r.presidence; })[0] || null;
    var assesseurs = [];
    recs.forEach(function(r){ assesseurs = assesseurs.concat(r.assesseurs||[]); });
    return {
      date: recs[0].date,
      type: recs[0].type,
      presidence: presidingRec ? presidingRec.presidence : recs[0].presidence,
      president: presidingRec ? presidingRec.president : null,
      assesseurs: assesseurs
    };
  });
  merged.sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date ? -1 : 1;
    return (PLANNING_TYPE_ORDER[a.type]||0) - (PLANNING_TYPE_ORDER[b.type]||0);
  });
  return merged;
}

/* Complétude d'une entrée FUSIONNÉE (issue de mergePlanningEntriesForDisplay
   ci-dessus) : calculée sur le TOTAL des deux collèges réunis (1 président
   + 3 assesseurs pour un BJ — 1 du côté présidence, 2 de l'autre côté ; 1
   président + 1 assesseur pour un BCO/BCO MEE).
   C'est cette fonction-ci, et elle seule, qui fait foi pour savoir si une
   audience apparaîtra « incomplète » (surlignée en rouge, dans toutes les
   listes comme sur l'image téléchargée) — buildPlanningCanvases ci-dessous
   et toutes les vues de liste (outil de planification, espace
   administrateur, détail d'une audience) DOIVENT impérativement partager
   ce même calcul : une audience peut très bien n'avoir JAMAIS reçu de
   contrepartie de l'autre collège (aucun enregistrement du tout de ce
   côté) sans que cela ne rende incomplet un seul enregistrement EXISTANT
   pris isolément — d'où l'intérêt de toujours raisonner sur l'audience
   fusionnée plutôt que sur un enregistrement par collège. */
function mergedEntryCompleteness(pl){
  var assesseursExpected = pl.type==="bj" ? 3 : 1;
  var presidentMissing = !pl.president;
  var assesseursMissing = pl.assesseurs.length < assesseursExpected;
  return { presidentMissing:presidentMissing, assesseursMissing:assesseursMissing, assesseursExpected:assesseursExpected, incomplete: presidentMissing || assesseursMissing };
}

/* Nom de fichier du document de planning : planning-{période}[-NOM]. */
function planningDocBaseName(periodKey, scopeSlug){
  var nom = sanitizeFilenamePart(state.profile.nom);
  var base = "planning-"+periodKey+(scopeSlug ? "-"+scopeSlug : "");
  return nom ? (base+"-"+nom) : base;
}

/* Image récapitulative (JPG, A4 paysage) de toutes les audiences d'un
   périmètre donné (un collège entier, ou un seul conseiller) pour une
   période — construite sur le même principe que le relevé de vacations
   (buildVacationsCanvases) : pagination automatique si la période compte
   beaucoup d'audiences. Une case « Président » ou « Assesseur(s) »
   incomplète est surlignée en rouge (fond + texte gras) pour bien
   ressortir à l'impression ; le conseiller qui préside est imprimé en
   gras pour se distinguer des assesseurs, et chaque nom porte son collège
   entre parenthèses — « (S) » ou « (E) » — via resolveMemberNameForPrint,
   puisqu'une même ligne réunit désormais les deux collèges (voir
   mergePlanningEntriesForDisplay). scopeLabel est déjà mis en forme par
   l'appelant (ex. « Collège Salarié » ou « MARTIN Alice »). entries doit
   avoir déjà été fusionné par mergePlanningEntriesForDisplay. */
function buildPlanningCanvases(periodLabel, scopeLabel, entries){
  var titleTxt = "Planning — "+(scopeLabel||"—")+" — "+periodLabel;
  var cphDisp = cphLabel(state.profile);
  var subTxt = (fullName(state.profile)||"Conseiller(ère) prud’homal(e)") + (cphDisp ? " · CPH de "+cphDisp : "") + (state.profile.section ? " · Section "+state.profile.section : "");
  var sans = "-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
  var missingBg = "#F5E1DE", missingText = "#B34D3B";

  var margin = 70;
  var contentW = A4_IMG_W - margin*2;
  var cols = [
    {key:"date", label:"Date", w:120},
    {key:"type", label:"Type", w:110},
    {key:"presidence", label:"Présidence", w:170},
    {key:"president", label:"Président", w:320}
  ];
  var fixedW = cols.reduce(function(s,c){ return s+c.w; }, 0);
  cols.push({key:"assesseurs", label:"Assesseur(s)", w: Math.max(220, contentW-fixedW)});

  var headerBlockH = 68, footerBlockH = 110, tableHeaderRowH = 46;
  var availH = A4_IMG_H - margin*2 - headerBlockH - footerBlockH;

  var rowH = 34, maxLines = 2;
  if(Math.floor((availH-tableHeaderRowH)/rowH) < Math.max(entries.length,1)){
    rowH = 24; maxLines = 1;
  }
  var perPage = Math.max(1, Math.floor((availH-tableHeaderRowH)/rowH));
  var pageCount = Math.max(1, Math.ceil((entries.length||1)/perPage));

  var canvases = [];
  for(var p=0; p<pageCount; p++){
    var pageEntries = entries.slice(p*perPage, (p+1)*perPage);
    var canvas = document.createElement("canvas");
    canvas.width = A4_IMG_W; canvas.height = A4_IMG_H;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,A4_IMG_W,A4_IMG_H);

    var x = margin, y = margin;
    ctx.fillStyle = "#141414";
    ctx.font = "700 28px "+sans;
    ctx.fillText(titleTxt, x, y+30);
    ctx.fillStyle = "#555";
    ctx.font = "400 17px "+sans;
    ctx.fillText(subTxt, x, y+58);
    if(pageCount>1){
      ctx.textAlign = "right";
      ctx.fillStyle = "#777";
      ctx.font = "400 15px "+sans;
      ctx.fillText("Page "+(p+1)+" / "+pageCount, margin+contentW, y+30);
      ctx.textAlign = "left";
    }

    var tx = margin, ty = margin + headerBlockH;
    ctx.fillStyle = "#EFEDE7";
    ctx.fillRect(tx, ty, contentW, tableHeaderRowH);
    ctx.strokeStyle = "#999"; ctx.lineWidth = 1;
    ctx.strokeRect(tx, ty, contentW, tableHeaderRowH);
    ctx.fillStyle = "#1C2024";
    ctx.font = "700 14px "+sans;
    var cx = tx;
    cols.forEach(function(c){
      var hLines = wrapCanvasText(ctx, c.label, c.w-16, 2);
      var lh = tableHeaderRowH/(hLines.length+0.8);
      hLines.forEach(function(ln, li){ ctx.fillText(ln, cx+8, ty + lh*(li+1) - 4); });
      cx += c.w;
    });

    var ry = ty + tableHeaderRowH;
    var normalFont = (maxLines===2 ? "400 14px " : "400 13px ")+sans;
    var boldFont = (maxLines===2 ? "700 14px " : "700 13px ")+sans;
    pageEntries.forEach(function(pl, idx){
      if(idx % 2 === 1){ ctx.fillStyle = "#FAF9F6"; ctx.fillRect(tx, ry, contentW, rowH); }
      var completeness = mergedEntryCompleteness(pl);
      var presidentMissing = completeness.presidentMissing;
      var assesseursMissing = completeness.assesseursMissing;

      var cvals = {
        date: parseISODate(pl.date).toLocaleDateString("fr-FR"),
        type: planningTypeLabel(pl.type),
        presidence: pl.presidence==="Salarié"?"Salariée":pl.presidence==="Employeur"?"Employeur":"—",
        president: pl.president ? resolveMemberNameForPrint(pl.president) : "Non renseigné",
        assesseurs: pl.assesseurs.length ? pl.assesseurs.map(resolveMemberNameForPrint).join(" / ") : "Non renseigné"
      };
      var ccx = tx;
      cols.forEach(function(c){
        var cellW = c.w - 16;
        var isMissingCell = (c.key==="president" && presidentMissing) || (c.key==="assesseurs" && assesseursMissing);
        /* Le conseiller qui préside (colonne « Président », quand renseigné)
           ressort en gras pour se distinguer des assesseurs. */
        var isPresidingName = c.key==="president" && !!pl.president;
        if(isMissingCell){
          ctx.fillStyle = missingBg;
          ctx.fillRect(ccx+2, ry+2, c.w-4, rowH-4);
        }
        ctx.fillStyle = isMissingCell ? missingText : "#26292D";
        ctx.font = (isMissingCell || isPresidingName) ? boldFont : normalFont;
        if(c.key === "assesseurs"){
          var lines = wrapCanvasText(ctx, cvals[c.key], cellW, maxLines);
          var lh = rowH/(lines.length+0.6);
          lines.forEach(function(ln, li){ ctx.fillText(ln, ccx+8, ry + lh*(li+1) - 3); });
        } else {
          var txt = String(cvals[c.key]);
          while(txt.length>1 && ctx.measureText(txt).width > cellW){ txt = txt.slice(0,-1); }
          if(txt !== String(cvals[c.key])) txt = txt.replace(/.$/, "…");
          ctx.fillText(txt, ccx+8, ry+rowH/2+5);
        }
        ccx += c.w;
      });
      ry += rowH;
    });
    ctx.font = normalFont;

    ctx.strokeStyle = "#CFCBC2";
    var gy = ty+tableHeaderRowH;
    for(var i=0;i<=pageEntries.length;i++){ ctx.beginPath(); ctx.moveTo(tx, gy); ctx.lineTo(tx+contentW, gy); ctx.stroke(); gy += rowH; }
    var gx = tx;
    ctx.beginPath();
    cols.forEach(function(c){ ctx.moveTo(gx, ty); ctx.lineTo(gx, ty+tableHeaderRowH+pageEntries.length*rowH); gx+=c.w; });
    ctx.moveTo(tx+contentW, ty); ctx.lineTo(tx+contentW, ty+tableHeaderRowH+pageEntries.length*rowH);
    ctx.stroke();
    ctx.strokeRect(tx, ty, contentW, tableHeaderRowH+pageEntries.length*rowH);

    var fy = A4_IMG_H - margin - footerBlockH + 24;
    ctx.fillStyle = "#141414";
    ctx.font = "700 16px "+sans;
    ctx.fillText(entries.length+" audience(s) au total.", margin, fy);
    fy += 26;

    /* Légende : un carré de la même couleur que les cases surlignées,
       pour que le renvoi « conseiller non renseigné » soit repérable au
       premier coup d’œil plutôt qu’un simple texte coloré. */
    ctx.fillStyle = missingBg;
    ctx.fillRect(margin, fy-13, 18, 18);
    ctx.strokeStyle = missingText; ctx.lineWidth = 1;
    ctx.strokeRect(margin, fy-13, 18, 18);
    ctx.fillStyle = "#141414";
    ctx.font = "600 13px "+sans;
    ctx.fillText("Conseiller non renseigné", margin+26, fy);
    fy += 22;
    ctx.font = "700 13px "+sans;
    ctx.fillText("Nom en gras : conseiller assurant la présidence.", margin, fy);
    fy += 20;
    ctx.fillStyle = "#777";
    ctx.font = "400 12px "+sans;
    ctx.fillText("Document généré le "+new Date().toLocaleDateString("fr-FR")+" à partir de l’Outil de planification.", margin, fy);

    canvases.push(canvas);
  }
  return canvases;
}

function showPlanningImageFallback(blobs, baseName){
  var urls = blobs.map(function(b){ return URL.createObjectURL(b); });
  var imgs = urls.map(function(u, i){
    var filename = baseName+(blobs.length>1 ? "-page"+(i+1) : "")+".jpg";
    return h("div", {style:"margin-bottom:20px;"},
      blobs.length>1 ? h("p", {class:"lede"}, "Page "+(i+1)+" / "+blobs.length) : null,
      h("img", {src:u, style:"width:100%; border-radius:8px; border:1px solid var(--divider); display:block; margin-bottom:8px;"}),
      h("a", {href:u, download:filename, class:"sheet-btn primary", style:"display:block; text-align:center; text-decoration:none; box-sizing:border-box;"}, "Télécharger")
    );
  });
  openSheet("Planning — image à enregistrer", h("div", null,
    h("p", {class:"lede"}, "Le bouton « Télécharger » sous chaque page tente un enregistrement direct. S’il ne fait rien sur cet appareil, faites un appui long (ou un clic droit) sur l’image, puis « Enregistrer l’image »."),
    h("div", null, imgs),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Fermer")
  ));
}

function exportPlanningImage(periodKey, periodLabel, scopeLabel, scopeSlug, entries){
  toast("Préparation de l’image…");
  var canvases = buildPlanningCanvases(periodLabel, scopeLabel, entries);
  var baseName = planningDocBaseName(periodKey, scopeSlug);
  Promise.all(canvases.map(function(c){ return canvasToJpegBlob(c, 0.92); })).then(function(blobs){
    downloadsReady.then(function(){
      if(!downloadsCap){ showPlanningImageFallback(blobs, baseName); return; }
      var i = 0;
      function next(){
        if(i >= blobs.length){
          toast(blobs.length>1 ? "Images enregistrées ("+blobs.length+" pages)." : "Image enregistrée.");
          return;
        }
        var suffix = blobs.length>1 ? "-page"+(i+1) : "";
        downloadsCap.save({ filename:baseName+suffix+".jpg", data:blobs[i] }).then(function(){
          i++; next();
        }).catch(function(err){
          if(err && err.code==="declined"){ toast("Téléchargement annulé."); return; }
          showPlanningImageFallback(blobs, baseName);
        });
      }
      next();
    });
  });
}

var PLANNING_TYPE_ORDER = {"bj":0, "bco":1, "bco-mee":2};

function openPlanningExportSheet(){
  var mode = "month";
  var monthVal = planningViewMonth;
  var yearVal = planningViewMonth.slice(0,4);

  var body = h("div", null);

  var upcomingBtn = h("button", {class:"sheet-btn small ghost", onclick:function(){ mode="upcoming"; updateModeButtons(); updateField(); }}, "Planning à venir");
  modeRow.appendChild(monthBtn); modeRow.appendChild(yearBtn); modeRow.appendChild(upcomingBtn);
  function updateModeButtons(){
    monthBtn.className = "sheet-btn small "+(mode==="month" ? "primary" : "ghost");
    yearBtn.className = "sheet-btn small "+(mode==="year" ? "primary" : "ghost");
    upcomingBtn.className = "sheet-btn small "+(mode==="upcoming" ? "primary" : "ghost");
  }

  var monthInput = null, yearInput = null;
  function updateField(){
    clear(fieldBox);
    if(mode==="month"){
      fieldBox.appendChild(h("label", {class:"field-label"}, "Mois"));
      monthInput = h("input", {type:"month", value: monthVal});
      fieldBox.appendChild(monthInput);
    } else if(mode==="year"){
      fieldBox.appendChild(h("label", {class:"field-label"}, "Année"));
      yearInput = h("input", {type:"number", value: yearVal, min:"2000", max:"2100", step:"1", inputmode:"numeric"});
      fieldBox.appendChild(yearInput);
    } else {
      fieldBox.appendChild(h("div", {class:"footnote", style:"margin:0;"}, "Toutes les audiences à partir du mois en cours ("+monthLabel(monthKey(todayISO()))+"), sans limite de fin."));
    }
  }
  updateField();

  var actions = h("div", {style:"margin-top:18px"});
  actions.appendChild(h("button", {class:"sheet-btn primary", onclick:function(){
    var periodKey, periodLabel;
    var collegeValue = collegeSel.value;
    var curMonthKey = monthKey(todayISO());
    if(mode==="month"){
      if(!monthInput.value){ toast("Choisissez un mois."); return; }
      periodKey = monthInput.value;
      periodLabel = monthLabel(periodKey);
    } else if(mode==="year"){
      var y = String(yearInput.value||"").trim();
      if(!/^\d{4}$/.test(y)){ toast("Choisissez une année valide."); return; }
      periodKey = y;
      periodLabel = "Année "+y;
    } else {
      periodKey = curMonthKey+"-a-venir";
      periodLabel = "À partir de "+monthLabel(curMonthKey);
    }
    var both = collegeValue==="__both__";
    function inPeriod(pl){
      if(mode==="month") return monthKey(pl.date)===periodKey;
      if(mode==="year") return pl.date.slice(0,4)===periodKey;
      return monthKey(pl.date) >= curMonthKey;
    }
    /* On détermine d'abord quelles audiences (date+type) sont concernées
       par le collège choisi, puis on récupère les enregistrements des
       DEUX collèges pour ces mêmes audiences : ainsi, même en choisissant
       un seul collège, on affiche tous les conseillers renseignés pour
       chaque audience (voir mergePlanningEntriesForDisplay) plutôt que
       seulement ceux du collège sélectionné. */
    var periodRecords = state.planning.filter(inPeriod);
    var keys = {};
    periodRecords.forEach(function(pl){
      if(both || pl.college===collegeValue) keys[pl.date+"|"+pl.type] = true;
    });
    if(Object.keys(keys).length===0){ toast(both ? "Aucune audience enregistrée pour cette période." : "Aucune audience enregistrée pour ce collège sur cette période."); return; }
    var relevantRecords = periodRecords.filter(function(pl){ return keys[pl.date+"|"+pl.type]; });
    var entries = mergePlanningEntriesForDisplay(relevantRecords);
    var collegeSlug = collegeValue==="Salarié" ? "salarie" : collegeValue==="Employeur" ? "employeur" : "tous-colleges";
    var scopeLabel = both ? "Les deux collèges" : "Collège "+collegeValue;
    closeSheet();
    exportPlanningImage(periodKey, periodLabel, scopeLabel, collegeSlug, entries);
  }}, "Générer l’image"));
  actions.appendChild(h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler"));
  body.appendChild(actions);

  openSheet("Éditer le planning", body);
}

function openMemberPlanningExportSheet(member){

  var yearBtn = h("button", {class:"sheet-btn small ghost", onclick:function(){ mode="year"; updateModeButtons(); updateField(); }}, "Une année entière");

    monthBtn.className = "sheet-btn small "+(mode==="month" ? "primary" : "ghost");
    yearBtn.className = "sheet-btn small "+(mode==="year" ? "primary" : "ghost");
  }

    clear(fieldBox);

      monthInput = h("input", {type:"month", value: monthVal});
      fieldBox.appendChild(monthInput);
    } else {
      fieldBox.appendChild(h("label", {class:"field-label"}, "Année"));
      yearInput = h("input", {type:"number", value: yearVal, min:"2000", max:"2100", step:"1", inputmode:"numeric"});
      fieldBox.appendChild(yearInput);
    }
  }
  updateField();

  var actions = h("div", {style:"margin-top:18px"});
  actions.appendChild(h("button", {class:"sheet-btn primary", onclick:function(){
    var periodKey, periodLabel;
    if(mode==="month"){
      if(!monthInput.value){ toast("Choisissez un mois."); return; }
      periodKey = monthInput.value;
      periodLabel = monthLabel(periodKey);
    } else {
      var y = String(yearInput.value||"").trim();
      if(!/^\d{4}$/.test(y)){ toast("Choisissez une année valide."); return; }
      periodKey = y;
      periodLabel = "Année "+y;
    }
    function inPeriod(pl){
      return mode==="month" ? monthKey(pl.date)===periodKey : pl.date.slice(0,4)===periodKey;
    }
    var myRecords = state.planning.filter(function(pl){
      var involved = pl.president===member.id || pl.assesseurs.indexOf(member.id)!==-1;
      return involved && inPeriod(pl);
    });
    if(myRecords.length===0){ toast("Aucune audience enregistrée pour ce conseiller sur cette période."); return; }
    /* Comme pour l'export global, on complète chaque audience où ce
       conseiller intervient avec les conseillers de l'autre collège
       renseignés pour la même date+type, afin d'afficher la composition
       complète plutôt que seulement le collège de ce conseiller. */
    var keys = {};
    myRecords.forEach(function(pl){ keys[pl.date+"|"+pl.type] = true; });

      return keys[pl.date+"|"+pl.type] && inPeriod(pl);
    });
    var entries = mergePlanningEntriesForDisplay(relevantRecords);
    var scopeSlug = sanitizeFilenamePart(member.nom || member.prenom || "conseiller");
    closeSheet();
    exportPlanningImage(periodKey, periodLabel, displayName, scopeSlug, entries);
  }}, "Générer l’image"));

/* =================================================================
   ÉCRAN — PRISE DE FONCTION (checklist, sous Administrer le CPH)
   Contenu organisé en phases chronologiques (PRISE_FONCTION_STEPS,
   plus haut). Chaque item de phase est l’unité cochée : une case à
   cocher sur l’en-tête + un détail dépliable (description + référence
   légale le cas échéant), pas de sous-checklist. Certains items sont
   réservés à un ou plusieurs CPH précis (cphOnly) ; pfVisibleItems()
   aplatit et filtre les items visibles pour l’utilisateur courant.
   ================================================================= */
function updatePriseFonctionProgress(){
  var items = pfVisibleItems();
  var gs = state.priseFonction;
  var done = items.filter(function(it){ return gs.checked.indexOf(it.id)!==-1; }).length;
  var fill = document.getElementById("pf-progress-fill");
  var label = document.getElementById("pf-progress-label");
  if(fill) fill.style.width = (items.length ? Math.round(done/items.length*100) : 0)+"%";
  if(label) label.textContent = done+" / "+items.length+" étapes réalisées";
}
renderers["prise-fonction"] = function(root){
  if(!isAppOwner()){
    root.appendChild(h("div", {class:"banner"},
      h("span", null, h("b", null, "Bientôt disponible. "), "Cette rubrique est encore en cours de construction et n’est pas encore ouverte.")
    ));
    return;
  }

  var gs = state.priseFonction;
  var items = pfVisibleItems();

  root.appendChild(h("p", {class:"lede"}, "Les démarches à accomplir en prenant vos fonctions. Cochez chaque étape une fois réalisée ; touchez son titre pour en voir le détail."));

  if(items.length===0){
    root.appendChild(h("div", {class:"banner blue"},
      h("span", null, h("b", null, "Contenu à venir. "), "Cette checklist sera complétée avec les étapes de prise de fonction — dites-moi lesquelles inclure et je les ajoute ici.")
    ));
    return;
  }

  root.appendChild(h("div", {class:"panel", style:"margin:16px 0"},
    h("div", {style:"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"},
      h("span", {style:"font-size:.8rem;font-weight:600"}, "Progression"),
      h("span", {id:"pf-progress-label", style:"font-size:.74rem;color:var(--text-muted)"}, "")
    ),
    h("div", {class:"progress-track"}, h("div", {id:"pf-progress-fill", class:"progress-fill", style:"width:0%"}))
  ));

  PRISE_FONCTION_STEPS.forEach(function(phase){
    var visibleItems = phase.items.filter(pfItemVisible);
    if(visibleItems.length===0) return;

    root.appendChild(h("div", {class:"pf-phase-head"},
      h("span", {class:"section-title", style:"margin:0"}, phase.title),
      h("span", {class:"pf-phase-when"}, phase.when)
    ));

    visibleItems.forEach(function(item){
      var isDone = gs.checked.indexOf(item.id)!==-1;
      var card = h("div", {class:"step-card"+(isDone?" done":""), id:"pf-card-"+item.id});
      var checkbox = h("input", {class:"step-check", type:"checkbox", checked: isDone?"checked":null});
      checkbox.addEventListener("click", function(e){ e.stopPropagation(); });
      checkbox.addEventListener("change", function(e){
        var idx = gs.checked.indexOf(item.id);
        if(e.target.checked && idx===-1) gs.checked.push(item.id);
        if(!e.target.checked && idx!==-1) gs.checked.splice(idx,1);
        saveState();
        card.classList.toggle("done", e.target.checked);
        updatePriseFonctionProgress();
      });
      var blocks = [{t:"p", v:item.desc}];
      var body = h("div", {class:"step-body"});
      body.appendChild(renderBlocks(blocks, item.id));
      if(item.ref) body.appendChild(h("span", {class:"pf-ref"}, item.ref));
      var head = h("div", {class:"step-head", onclick:function(){ card.classList.toggle("open"); }},
        checkbox,
        h("h3", null, item.title),
        h("span", {class:"pf-tag cat-"+item.cat}, PF_CAT_LABEL[item.cat]||item.cat),
        icon("ic-chev", "chev")
      );
      card.appendChild(head); card.appendChild(body);
      root.appendChild(card);
    });
  });

  setTimeout(updatePriseFonctionProgress, 0);
};

/* Pavé de signature manuscrite (Réglages > Signature). L'utilisateur trace
   sa signature au doigt (ou à la souris) sur un <canvas>, via les
   événements Pointer (couvrent souris/tactile/stylet en une seule API).
   Le tracé n'est enregistré dans le profil (en PNG data-URL) qu'au clic
   sur « Enregistrer » — tant que ce n'est pas fait, rien n'est persisté.
   Une fois enregistrée, la signature est apposée automatiquement sur le
   relevé de vacations (RITA), en plus de la mention de validation
   horodatée déjà existante (voir buildVacationsCanvases / printVacations). */
/* onSignatureChange (facultatif) est rappelé après chaque enregistrement
   ou suppression de la signature, en plus de la mise à jour normale de
   l'aperçu — utilisé par renderers["onboarding-signature"] pour réactiver
   son bouton « Continuer » dès qu'une signature existe (voir plus bas),
   sans quoi il resterait bloqué sur l'état capturé au premier rendu. Le
   panneau reste sinon rigoureusement identique à celui de Réglages. */
function buildSignaturePanel(p, onSignatureChange){
  var panel = h("div", {class:"panel"});
  var previewWrap = h("div", null);
  var padWrap = h("div", {style:"display:none;"});
  var canvas = h("canvas", {style:"display:block; width:100%; height:160px; border:1px solid var(--divider); border-radius:8px; background:#fff; touch-action:none; cursor:crosshair;"});
  var ctx2d = null, drawing = false, hasDrawn = false, lastX = 0, lastY = 0;

  function setupCanvas(){
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, rect.width), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w*dpr);
    canvas.height = Math.round(160*dpr);
    ctx2d = canvas.getContext("2d");
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx2d.lineWidth = 2.4;
    ctx2d.lineCap = "round";
    ctx2d.lineJoin = "round";
    ctx2d.strokeStyle = "#141414";
    ctx2d.fillStyle = "#ffffff";
    ctx2d.fillRect(0, 0, w, 160);
    hasDrawn = false;
  }
  function posFromEvent(e){
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX-rect.left, y: e.clientY-rect.top };
  }
  canvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    if(canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
    drawing = true;
    var pos = posFromEvent(e); lastX = pos.x; lastY = pos.y;
  });
  canvas.addEventListener("pointermove", function(e){
    if(!drawing) return;
    e.preventDefault();
    var pos = posFromEvent(e);
    ctx2d.beginPath(); ctx2d.moveTo(lastX, lastY); ctx2d.lineTo(pos.x, pos.y); ctx2d.stroke();
    lastX = pos.x; lastY = pos.y; hasDrawn = true;
  });
  function endStroke(){ drawing = false; }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointerleave", endStroke);
  canvas.addEventListener("pointercancel", endStroke);

  function showPreview(){
    clear(previewWrap);
    if(p.signature){
      previewWrap.appendChild(h("div", {class:"footnote", style:"margin-bottom:6px;"}, "Signature enregistrée :"));
      previewWrap.appendChild(h("img", {src:p.signature, style:"display:block; max-width:220px; max-height:90px; border:1px solid var(--divider); border-radius:8px; background:#fff; padding:6px; margin-bottom:10px;"}));
    } else {
      previewWrap.appendChild(h("div", {class:"footnote", style:"margin-bottom:10px;"}, "Aucune signature enregistrée pour l’instant — elle est facultative, mais permet de faire apparaître une signature manuscrite sur votre relevé de vacations plutôt qu'un document à imprimer et signer à la main."));
    }
    previewWrap.appendChild(h("div", {class:"btn-row"},
      h("button", {class:"sheet-btn ghost", onclick:function(){
        previewWrap.style.display = "none"; padWrap.style.display = "";
        setTimeout(setupCanvas, 0);
      }}, p.signature ? "Modifier la signature" : "Ajouter une signature"),
      p.signature ? h("button", {class:"sheet-btn danger", onclick:function(){
        openSheet("Supprimer la signature", h("div", null,
          h("p", {class:"lede"}, "Votre relevé de vacations n’inclura plus de signature manuscrite à partir de maintenant."),
          h("button", {class:"sheet-btn danger", onclick:function(){ p.signature=""; saveState(); closeSheet(); if(onSignatureChange){ onSignatureChange(); } else { render("settings"); } }}, "Supprimer"),
          h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
        ));
      }}, "Supprimer") : null
    ));
    previewWrap.style.display = ""; padWrap.style.display = "none";
  }

  padWrap.appendChild(h("div", {class:"footnote", style:"margin-bottom:8px;"}, "Tracez votre signature au doigt (ou à la souris) dans le cadre ci-dessous."));
  padWrap.appendChild(canvas);
  padWrap.appendChild(h("div", {class:"btn-row", style:"margin-top:10px;"},
    h("button", {class:"sheet-btn ghost", onclick:function(){ setupCanvas(); }}, "Effacer"),
    h("button", {class:"sheet-btn primary", onclick:function(){
      if(!hasDrawn){ toast("Dessinez votre signature avant d’enregistrer."); return; }
      p.signature = canvas.toDataURL("image/png");
      saveState();
      toast("Signature enregistrée.");
      showPreview();
      if(onSignatureChange) onSignatureChange();
    }}, "Enregistrer la signature"),
    h("button", {class:"sheet-btn ghost", onclick:function(){ showPreview(); }}, "Annuler")
  ));

  showPreview();
  panel.appendChild(previewWrap);
  panel.appendChild(padWrap);
  panel.appendChild(h("div", {class:"footnote", style:"margin-top:10px;"}, "Stockée uniquement sur cet appareil, comme le reste de vos données — jamais transmise ailleurs qu’apposée sur vos propres documents générés."));
  return panel;
}

/* La fonction en section (aucune / président(e) / vice-président(e))
   n'est plus déclarable ici : elle se lit uniquement sur l'étiquette
   posée par l'administrateur sur la fiche de l'annuaire liée à ce profil
   (voir module ADMINISTRATION GÉNÉRALE, openAdminMemberForm, et
   openPickMyMemberSheet -> selectMember qui la recopie dans
   state.profile.sectionRole dès qu'une fiche est choisie). Le président
   crée et répartit les audiences pour son propre collège ; le
   vice-président complète ensuite le collège opposé, sans pouvoir créer
   de nouvelles dates (voir renderers["planification"]). */

renderers.settings = function(root){
  var p = state.profile;

  if(hasManifest()){
    root.appendChild(h("div", {class:"section-title"}, "Application"));
    if(isStandaloneDisplay()){
      root.appendChild(h("div", {class:"panel"}, h("div", {class:"footnote", style:"margin:0;"}, "✓ Application déjà installée sur cet appareil.")));
    } else {
      root.appendChild(h("div", {class:"panel"},
        h("button", {class:"sheet-btn primary", onclick:triggerInstallPrompt}, "Installer sur l’écran d’accueil"),
        h("div", {class:"footnote"}, "Ouvre l’application en un geste, sans repasser par le navigateur.")
      ));
    }
  }

  root.appendChild(h("div", {class:"section-title"}, "Votre profil"));
  /* Depuis le parcours d'accueil unifié « Acteur(rice) de section », la
     fiche (nom, prénom, collège, téléphone, fonction en section) est déjà
     créée en amont, dans l'annuaire de la section — plus besoin de la
     ressaisir ni de pouvoir la modifier ici. Seule la mise en relation
     avec cette fiche (openPickMyMemberSheet) reste une action possible ;
     le reste s'affiche en lecture seule, tel que recopié automatiquement
     depuis la fiche choisie (voir selectMember). */
  var linkedMember = state.profile.memberId ? state.sectionMembers.filter(function(m){ return m.id===state.profile.memberId; })[0] : null;
  if(state.sectionMembers.length>0){
    root.appendChild(h("div", {class:"panel", style:"margin-bottom:10px"},
      h("div", {class:"footnote", style:"margin:0 0 8px"},
        linkedMember
          ? "Profil lié à la fiche « "+memberDisplayName(linkedMember)+" » de l'annuaire — vos statistiques et votre planning personnel reconnaissent vos audiences de façon fiable."
          : "Choisir votre fiche dans l'annuaire évite les faux négatifs dans « Mes statistiques » si votre nom y est orthographié un peu différemment."),
      h("button", {class:"sheet-btn ghost", onclick:function(){ openPickMyMemberSheet(); }},
        linkedMember ? "Changer mon identité" : "Me lier à ma fiche dans l'annuaire")
    ));
  }
  var identityList = h("div", {class:"info-list"});
  function identityRow(label, value){
    identityList.appendChild(h("div", {class:"info-row"},
      h("div", {class:"info-label"}, label),
      h("div", {class:"info-value"}, value || "—")
    ));
  }
  identityRow("Prénom", p.prenom);
  identityRow("Nom", p.nom);
  identityRow("Téléphone", p.tel);
  identityRow("Collège", p.college);
  identityRow("Section", p.section);
  identityRow("CPH de", p.cph===CPH_AUTRE ? p.cphAutre : p.cph);
  root.appendChild(h("div", {class:"panel"}, identityList));

  root.appendChild(h("div", {class:"section-title"}, "Activité salariée"));
  var workPanel = h("div", {class:"panel"});
  workPanel.appendChild(boolField("Êtes-vous rémunéré(e) en tant que salarié(e) ?", p.remunere, function(v){ p.remunere=v; if(!v){ p.poste=null; } saveState(); render("settings"); }));
  if(p.remunere===true){
    workPanel.appendChild(h("div", {style:"margin-top:14px"}, boolField("Êtes-vous posté(e) ?", p.poste, function(v){ p.poste=v; saveState(); render("settings"); })));
    workPanel.appendChild(h("label", {class:"field-label"}, "Horaires de travail habituels (optionnel)"));
    var timeRow = h("div", {class:"btn-row"},
      h("div", null,
        h("label", {class:"field-label"}, "Début"),
        h("select", {onchange:function(e){ p.horaireDebut=e.target.value; saveState(); }},
          h("option", {value:"", selected: p.horaireDebut?null:"selected"}, "—"),
          TIME_OPTIONS.map(function(t){ return h("option", {value:t[0], selected: t[0]===p.horaireDebut?"selected":null}, t[1]); }))
      ),
      h("div", null,
        h("label", {class:"field-label"}, "Fin"),
        h("select", {onchange:function(e){ p.horaireFin=e.target.value; saveState(); }},
          h("option", {value:"", selected: p.horaireFin?null:"selected"}, "—"),
          TIME_OPTIONS.map(function(t){ return h("option", {value:t[0], selected: t[0]===p.horaireFin?"selected":null}, t[1]); }))
      )
    );
    workPanel.appendChild(timeRow);
    workPanel.appendChild(h("div", {class:"footnote", style:"margin-top:8px"}, "Champ facultatif — non requis pour activer l’application. Utile pour les calculs liés aux vacations postées."));
  }
  root.appendChild(workPanel);

  root.appendChild(h("div", {class:"section-title"}, "Signature"));
  root.appendChild(buildSignaturePanel(p));

  root.appendChild(h("div", {class:"section-title"}, "Apparence"));
  var themePanel = h("div", {class:"panel"});
  var themeChips = h("div", {class:"chip-row"});
  [["system","Système"],["light","Clair"],["dark","Sombre"]].forEach(function(pair){
    var c = h("span", {class:"chip"+(state.theme===pair[0]?" active":""), onclick:function(){
      state.theme=pair[0]; saveState(); applyTheme();
      Array.prototype.forEach.call(themeChips.children, function(el){ el.classList.remove("active"); });
      c.classList.add("active");
    }}, pair[1]);
    themeChips.appendChild(c);
  });
  themePanel.appendChild(themeChips);
  root.appendChild(themePanel);

  root.appendChild(h("div", {class:"section-title"}, "Vos données"));
  root.appendChild(h("p", {class:"lede"}, "Tout est enregistré uniquement sur cet appareil, sans serveur. Sauvegardez-les manuellement ci-dessous, restaurez une sauvegarde existante, ou réinitialisez l’application."));
  var dataPanel = h("div", {class:"panel"});
  /* Bouton de sauvegarde déplacé ici depuis son ancienne section dédiée
     « Sauvegarde », en tête de « Vos données » — à la demande de
     l'utilisateur, pour regrouper toutes les actions sur les données au
     même endroit. */
  var lastBackupTxt = "Aucune sauvegarde effectuée pour l’instant.";
  if(state.lastBackupAt){
    var bd = new Date(state.lastBackupAt);
    lastBackupTxt = "Dernière sauvegarde le "+bd.toLocaleDateString("fr-FR")+" à "+bd.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"})+".";
  }
  dataPanel.appendChild(h("div", {class:"footnote", style:"margin:0 0 12px;"}, lastBackupTxt));
  dataPanel.appendChild(h("button", {class:"sheet-btn primary", onclick:function(){ runBackup(false); }}, "Sauvegarder maintenant"));
  dataPanel.appendChild(h("div", {class:"footnote", style:"margin-bottom:16px"}, "Une sauvegarde complète de vos données (profil et vacations) est proposée automatiquement au téléchargement tous les 7 jours à l’ouverture de l’application, au format JSON — à conserver précieusement, par exemple en cas de changement d’appareil."));
  var fileIn = h("input", {type:"file", accept:"application/json", style:"display:none", onchange:function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        openSheet("Importer la sauvegarde", h("div", null,
          h("p", {class:"lede"}, "Cela remplacera toutes les données actuellement enregistrées sur cet appareil par celles du fichier importé. Cette action est irréversible."),
          h("button", {class:"sheet-btn danger", onclick:function(){
            state = migrate(parsed); saveState(); closeSheet(); toast("Sauvegarde importée."); render("settings");
          }}, "Remplacer mes données"),
          h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
        ));
      }catch(err){ toast("Fichier illisible — vérifiez qu’il s’agit bien d’une sauvegarde JSON."); }
    };
    reader.readAsText(file);
    e.target.value="";
  }});
  dataPanel.appendChild(fileIn);
  dataPanel.appendChild(h("button", {class:"sheet-btn ghost", onclick:function(){ fileIn.click(); }}, "Importer une sauvegarde"));
  dataPanel.appendChild(h("button", {class:"sheet-btn danger", onclick:function(){
    openSheet("Réinitialiser", h("div", null,
      h("p", {class:"lede"}, "Toutes vos vacations, votre progression et votre profil seront définitivement supprimés de cet appareil."),
      h("button", {class:"sheet-btn danger", onclick:function(){
        state = clone(DEFAULT_STATE); saveState(); applyTheme(); closeSheet(); toast("Données réinitialisées.");
        window.__cph.state = state;
        navStack = ["onboarding"];
        render("onboarding");
      }}, "Tout réinitialiser"),
      h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
    ));
  }}, "Réinitialiser toutes les données"));
  root.appendChild(dataPanel);

  root.appendChild(h("div", {class:"section-title"}, "Synchronisation avec la section"));
  /* Simplifiée à la demande de l'utilisateur : la fiche utilisateur et
     l'espace de section sont désormais créés en amont (parcours d'accueil
     unifié « Acteur(rice) de section »), donc plus besoin ici de créer un
     espace, rejoindre avec un code, consulter le code de section, ou
     désactiver la synchronisation — seule l'action de rafraîchir les
     données reste utile au quotidien pour un(e) simple conseiller(e).
     Exception nécessaire, identifiée en construisant cet écran et
     confirmée avec l'utilisateur : président(e) et vice-président(e)
     éditent leur répertoire et leur planning uniquement en local (voir
     « Administrer ma section » → répertoire/planification, jamais
     poussés automatiquement) — sans un moyen de les envoyer, leurs
     modifications resteraient bloquées sur leur appareil pour toujours.
     « Envoyer mes modifications » leur reste donc réservé ici. */
  var syncPanel = h("div", {class:"panel"});
  syncPanel.appendChild(h("button", {class:"sheet-btn accent", onclick:function(){ confirmAndPullSection(); }}, "Synchroniser les données"));
  if(state.profile.sectionRole==="president" || state.profile.sectionRole==="vice-president"){
    syncPanel.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:pushToSectionNow}, "Envoyer mes modifications"));
  }
  root.appendChild(syncPanel);

  root.appendChild(h("div", {class:"section-title"}, "Espace administrateur"));
  var sysAdminPanel = h("div", {class:"panel"});
  sysAdminPanel.appendChild(h("p", {class:"lede", style:"margin:0 0 12px"}, "Accès réservé, protégé par un code à 8 chiffres : gestion de l'annuaire et du planning de n'importe quelle section, sur n'importe quel CPH."));
  sysAdminPanel.appendChild(h("button", {class:"sheet-btn ghost", onclick:openAdminEntryPoint},
    adminSessionCode ? "Rouvrir l'espace administrateur" : "Ouvrir l'espace administrateur"));
  root.appendChild(sysAdminPanel);

  root.appendChild(h("div", {class:"footnote"}, "Mon Assistant CPH a été réalisé pour les conseillers prud’homaux, dans l’esprit du guide « Présider un BJ ». Les textes de loi reproduits le sont à titre pratique — vérifiez toujours leur version en vigueur sur Légifrance avant toute décision."));
};

window.__cph = { h:h, icon:icon, clear:clear, toast:toast, openSheet:openSheet, closeSheet:closeSheet, copyText:copyText,
  state:state, saveState:saveState, go:go, goBack:goBack, render:render, renderers:renderers,
  NATURES:NATURES, SECTIONS:SECTIONS, DURATIONS:DURATIONS, REF_TEXTS:REF_TEXTS, PHRASES:PHRASES,
  BJ_STEPS:BJ_STEPS, BCO_STEPS:BCO_STEPS, uid:uid, todayISO:todayISO, saveFile:saveFile, downloadsReady:downloadsReady,
  applyTheme:applyTheme };

render(navStack[navStack.length-1]);

})();
</script>

<!-- =====================================================================
     PONT VERS LE SDK FIREBASE — module ES séparé (voir le module
     SYNCHRONISATION dans le script principal ci-dessus pour le pourquoi).
     Un script "module" s'exécute après le script classique ci-dessus
     (jamais avant) : le reste de l'application n'attend jamais ce pont
     pour s'afficher, elle reste pleinement utilisable même si ce script
     ne charge pas (pas de réseau, etc.) — la synchronisation est un
     service en plus, jamais une condition de fonctionnement.
     ===================================================================== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  /* Ces valeurs ne sont pas secrètes malgré le nom "apiKey" : Firebase les
     conçoit pour être visibles publiquement dans le code d'une
     application cliente (voir la documentation Firebase). La protection
     des données vient des règles de sécurité Firestore (firestore.rules,
     fourni séparément) et du chiffrement côté client (module
     SYNCHRONISATION plus haut) — jamais de la confidentialité de ces
     identifiants. */
  var firebaseConfig = {
    apiKey: "AIzaSyDtsS-Jgg2wX9AlSVccqHyn59JtvSIflSQ",
    authDomain: "cph-toolbox.firebaseapp.com",
    projectId: "cph-toolbox",
    storageBucket: "cph-toolbox.firebasestorage.app",
    messagingSenderId: "254997006915",
    appId: "1:254997006915:web:18f0caac41afca6d12a2f6"
  };

  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);

  function tsToIso(ts){
    try{ return (ts && typeof ts.toDate === "function") ? ts.toDate().toISOString() : null; }catch(e){ return null; }
  }

  /* API exposée au script principal (classique, non-module) : volontairement
     réduite à trois fonctions simples qui ne renvoient jamais d'objets
     propres au SDK Firebase — juste des chaînes/dates JS ordinaires — afin
     que tout le reste de l'application (chiffrement, logique de
     synchronisation, interface) reste totalement indépendant du SDK. */
  window.__fbFirestore = {
    getSectionDoc: function(sectionCode){
      return getDoc(doc(db, "sections", sectionCode)).then(function(snap){
        if(!snap.exists()) return null;
        var data = snap.data();
        return {
          cph: data.cph, section: data.section, iv: data.iv, ciphertext: data.ciphertext,
          updatedAt: tsToIso(data.updatedAt)
        };
      });
    },
    getSectionMeta: function(sectionCode){
      return getDoc(doc(db, "sections", sectionCode)).then(function(snap){
        if(!snap.exists()) return null;
        return { updatedAt: tsToIso(snap.data().updatedAt) };
      });
    },
    setSectionDoc: function(sectionCode, data){
      var payload = Object.assign({}, data, { updatedAt: serverTimestamp() });
      return setDoc(doc(db, "sections", sectionCode), payload);
    },
    /* Module ADMINISTRATION GÉNÉRALE (voir plus haut dans le script
       classique) : un unique petit document (empreinte du code
       administrateur) et un registre CPH+section -> code de section
       chiffré, tous deux à identifiant déterministe — voir firestore.rules
       pour la raison pour laquelle cela reste sûr sans "list". */
    getAdminConfig: function(){
      return getDoc(doc(db, "admin", "config")).then(function(snap){
        if(!snap.exists()) return null;
        return { codeHash: snap.data().codeHash };
      });
    },
    setAdminConfig: function(data){
      var payload = Object.assign({}, data, { updatedAt: serverTimestamp() });
      return setDoc(doc(db, "admin", "config"), payload);
    },
    getRegistryDoc: function(registryId){
      return getDoc(doc(db, "registry", registryId)).then(function(snap){
        if(!snap.exists()) return null;
        var data = snap.data();
        return { cph: data.cph, section: data.section, iv: data.iv, ciphertext: data.ciphertext };
      });
    },
    setRegistryDoc: function(registryId, data){
      var payload = Object.assign({}, data, { updatedAt: serverTimestamp() });
      return setDoc(doc(db, "registry", registryId), payload);
    },
    /* Coffre des codes personnels déjà connus de l'administrateur, par
       section — voir Codes personnels retrouvables sans régénération dans
       le script classique ci-dessus. Même identifiant déterministe
       (CPH+section) que "registry", dans une collection séparée. */
    getAdminPinsDoc: function(registryId){
      return getDoc(doc(db, "adminPins", registryId)).then(function(snap){
        if(!snap.exists()) return null;
        var data = snap.data();
        return { iv: data.iv, ciphertext: data.ciphertext };
      });
    },
    setAdminPinsDoc: function(registryId, data){
      var payload = Object.assign({}, data, { updatedAt: serverTimestamp() });
      return setDoc(doc(db, "adminPins", registryId), payload);
    }
  };

  window.dispatchEvent(new Event("fb-sync-ready"));
</script>
