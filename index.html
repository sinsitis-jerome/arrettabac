  openSheet(memberDisplayName(member) || "Fiche du conseiller", body);
}

renderers["section-membres"] = function(root){
  var members = state.sectionMembers;

  root.appendChild(h("p", {class:"lede"}, "Les personnes clés de votre section, et le répertoire des conseillers par collège."));

  var rolesPanel = h("div", {class:"panel"});
  SECTION_ROLES.forEach(function(r){
    var role = state.sectionRoles[r.key];
    var name = memberDisplayName({nom:role.nom, prenom:role.prenom});
    var subParts = [];
    if(role.email) subParts.push(role.email);
    if(role.tel) subParts.push(formatTelFR(role.tel));
    rolesPanel.appendChild(h("div", {class:"row-click", onclick:function(){ openSectionRoleForm(r.key, r.label); }},
      h("div", {class:"rc-main"},
        h("div", {class:"rc-title"}, r.label),
        h("div", {class:"rc-sub"}, name ? (name + (subParts.length ? " · "+subParts.join(" · ") : "")) : "Non renseigné")
      ),
      icon("ic-chev", "chev")
    ));
  });
  root.appendChild(rolesPanel);

  root.appendChild(h("div", {class:"section-title", style:"margin-top:20px"}, "Conseillers de la section"));

  if(state.profile.sectionRole==="president"){
    renderPresidentMembersTable(root, members);
  } else {
    renderBasicMembersList(root, members);
  }

  root.appendChild(h("div", {class:"footnote", style:"margin-top:16px"}, "Ce répertoire est enregistré uniquement sur cet appareil, comme le reste de vos données."));
};

/* Répertoire des conseillers tel qu'affiché au vice-président (inchangé
   par rapport à avant) : simple regroupement par collège, sans compteurs
   ni tri — la vue enrichie ci-dessous (renderPresidentMembersTable) est
   réservée au président de section. */
function renderBasicMembersList(root, members){
  if(members.length===0){
    root.appendChild(h("div", {class:"init-empty"},
      h("p", null, "Aucun conseiller enregistré pour l’instant.")
    ));
  } else {
    root.appendChild(h("p", {class:"lede"}, members.length+(members.length>1 ? " conseillers enregistrés. " : " conseiller enregistré. ")+"Touchez une fiche pour la consulter."));

    var groupOrder = COLLEGES.slice();
    if(state.profile.college && groupOrder.indexOf(state.profile.college) > 0){
      groupOrder = [state.profile.college].concat(groupOrder.filter(function(c){ return c!==state.profile.college; }));
    }
    groupOrder.push(""); // Collège non précisé, toujours affiché en dernier.

    groupOrder.forEach(function(collegeValue){
      var group = members.filter(function(m){ return (m.college||"")===collegeValue; }).sort(memberSortCompare);
      if(group.length===0) return;
      root.appendChild(h("div", {class:"section-title"}, collegeValue ? "Collège "+collegeValue.toLowerCase() : "Collège non précisé"));
      var panel = h("div", {class:"panel"});
      group.forEach(function(m){
        var subParts = [];
        if(m.syndicat) subParts.push(m.syndicat);
        if(m.email) subParts.push(m.email);
        panel.appendChild(h("div", {class:"row-click", onclick:function(){ openSectionMemberView(m); }},
          h("div", {class:"rc-main"},
            h("div", {class:"rc-title"}, memberDisplayName(m) || "(Sans nom)"),
            h("div", {class:"rc-sub"}, subParts.length ? subParts.join(" · ") : "—")
          ),
          h("div", {class:"rc-val"}, formatTelFR(m.tel))
        ));
      });
      root.appendChild(panel);
    });
  }

  root.appendChild(h("button", {class:"sheet-btn accent", style:"margin-top:14px", onclick:function(){ openSectionMemberForm(null); }},
    "+ Ajouter un conseiller"));
}

/* Répertoire enrichi réservé au président de section : compteurs par
   collège, tableau trié au choix par collège ou par syndicat, puis
   bouton de création — voir la demande du président du 30/08/2026. */
function renderPresidentMembersTable(root, members){
  var nSalarie = members.filter(function(m){ return m.college==="Salarié"; }).length;
  var nEmployeur = members.filter(function(m){ return m.college==="Employeur"; }).length;

  root.appendChild(h("div", {class:"stat-row"},
    h("div", {class:"stat-box"}, h("div", {class:"n"}, String(nSalarie)), h("div", {class:"l"}, "Salariés")),
    h("div", {class:"stat-box"}, h("div", {class:"n"}, String(nEmployeur)), h("div", {class:"l"}, "Employeurs")),
    h("div", {class:"stat-box"}, h("div", {class:"n"}, String(members.length)), h("div", {class:"l"}, "Au total"))
  ));

  if(members.length===0){
    root.appendChild(h("div", {class:"init-empty", style:"margin-top:14px"},
      h("p", null, "Aucun conseiller enregistré pour l’instant.")
    ));
  } else {
    var sortRow = h("div", {class:"btn-row", style:"margin-top:14px; margin-bottom:4px;"});
    [["college","Trier par collège"],["syndicat","Trier par syndicat"]].forEach(function(pair){
      sortRow.appendChild(h("button", {
        class:"sheet-btn small "+(memberSortMode===pair[0] ? "primary" : "ghost"),
        onclick:function(){ memberSortMode=pair[0]; render("section-membres"); }
      }, pair[1]));
    });
    root.appendChild(sortRow);

    root.appendChild(h("p", {class:"lede"}, members.length+(members.length>1 ? " conseillers enregistrés. " : " conseiller enregistré. ")+"Touchez une fiche pour la consulter."));

    var groups; // liste ordonnée de {label, items}
    if(memberSortMode==="syndicat"){
      var bySyndicat = {};
      members.forEach(function(m){
        var key = (m.syndicat||"").trim();
        (bySyndicat[key] || (bySyndicat[key]=[])).push(m);
      });
      var syndicatKeys = Object.keys(bySyndicat).filter(function(k){ return k!==""; }).sort(function(a,b){
        return a.localeCompare(b, "fr-FR");
      });
      if(bySyndicat[""]) syndicatKeys.push(""); // Syndicat non précisé, en dernier.
      groups = syndicatKeys.map(function(k){
        return { label: k || "Syndicat non précisé", items: bySyndicat[k].slice().sort(memberSortCompare) };
      });
    } else {
      var groupOrder = COLLEGES.slice();
      if(state.profile.college && groupOrder.indexOf(state.profile.college) > 0){
        groupOrder = [state.profile.college].concat(groupOrder.filter(function(c){ return c!==state.profile.college; }));
      }
      groupOrder.push(""); // Collège non précisé, toujours affiché en dernier.
      groups = groupOrder.map(function(collegeValue){
        return {
          label: collegeValue ? "Collège "+collegeValue.toLowerCase() : "Collège non précisé",
          items: members.filter(function(m){ return (m.college||"")===collegeValue; }).sort(memberSortCompare)
        };
      });
    }

    groups.forEach(function(group){
      if(group.items.length===0) return;
      root.appendChild(h("div", {class:"section-title"}, group.label));
      var panel = h("div", {class:"panel"});
      group.items.forEach(function(m){
        var subParts = [];
        if(memberSortMode==="syndicat"){
          if(m.college) subParts.push(m.college);
        } else {
          if(m.syndicat) subParts.push(m.syndicat);
        }
        if(m.email) subParts.push(m.email);
        panel.appendChild(h("div", {class:"row-click", onclick:function(){ openSectionMemberView(m); }},
          h("div", {class:"rc-main"},
            h("div", {class:"rc-title"}, memberDisplayName(m) || "(Sans nom)"),
            h("div", {class:"rc-sub"}, subParts.length ? subParts.join(" · ") : "—")
          ),
          h("div", {class:"rc-val"}, formatTelFR(m.tel))
        ));
      });
      root.appendChild(panel);
    });
  }

  root.appendChild(h("button", {class:"sheet-btn accent", style:"margin-top:14px", onclick:function(){ openSectionMemberForm(null); }},
    "+ Créer un conseiller"));

  /* Bouton discret d'import JSON de la liste des conseillers, réservé au
     président de section — voir handleMembersImportFile ci-dessus. */
  var membersImportInput = h("input", {type:"file", accept:"application/json", style:"display:none", onchange:function(e){
    var file = e.target.files[0]; if(!file) return;
    handleMembersImportFile(file);
    e.target.value = "";
  }});
  root.appendChild(membersImportInput);
  root.appendChild(h("button", {
    class:"discreet-icon-btn", type:"button",
    title:"Importer une liste de conseillers (JSON)", "aria-label":"Importer une liste de conseillers (JSON)",
    onclick:function(){ membersImportInput.click(); }
  }, icon("ic-upload")));
}

/* =================================================================
   ÉCRAN — OUTIL DE PLANIFICATION
   ================================================================= */

/* Nombre de dates de planification d'un type donné (bj / bco / bco-mee)
   où le conseiller est président ou assesseur, dans la liste de planning
   fournie. Version générique (planningList explicite) sous-jacente à
   memberTotalForType (state.planning) ET à son pendant de l'espace
   administrateur (adminBuffer.planning — voir openAdminAudienceForm), pour
   ne jamais dupliquer cette logique de classement entre les deux. */
function memberTotalForTypeIn(planningList, memberId, typeId){
  var n = 0;
  planningList.forEach(function(pl){
    if(pl.type!==typeId) return;
    if(pl.president===memberId || pl.assesseurs.indexOf(memberId)!==-1) n++;
  });
  return n;
}
/* Nombre total d'audiences tous types confondus (BJ + BCO + BCO MEE), dans
   la liste de planning fournie. Version générique — voir memberTotalForTypeIn. */
function memberTotalAllTypesIn(planningList, memberId){
  return PLANNING_TYPES.reduce(function(sum, t){ return sum + memberTotalForTypeIn(planningList, memberId, t.id); }, 0);
}
function memberTotalForType(memberId, typeId){ return memberTotalForTypeIn(state.planning, memberId, typeId); }
function memberTotalAllTypes(memberId){ return memberTotalAllTypesIn(state.planning, memberId); }

/* Classement des candidats proposés : en premier critère, le nombre total
   d'audiences tous types confondus (du moins sollicité au plus sollicité) ;
   à égalité, le nombre d'audiences du même type que celle en cours de
   planification ; à égalité encore, l'ordre alphabétique. Version
   générique (members/planningList explicites) — voir memberTotalForTypeIn. */
function rankedCandidatesIn(members, planningList, collegeValue, typeId){
  return members
    .filter(function(m){ return (m.college||"")===collegeValue; })
    .map(function(m){ return { id:m.id, member:m, count: memberTotalForTypeIn(planningList, m.id, typeId), total: memberTotalAllTypesIn(planningList, m.id) }; })
    .sort(function(a,b){
      if(a.total!==b.total) return a.total-b.total;
      if(a.count!==b.count) return a.count-b.count;
      return memberSortCompare(a.member, b.member);
    });
}
function rankedCandidates(collegeValue, typeId){ return rankedCandidatesIn(state.sectionMembers, state.planning, collegeValue, typeId); }

function candidateOptionLabel(c, typeId){
  var unit = typeId==="bj" ? "BJ" : typeId==="bco" ? "BCO" : "BCO MEE";
  return memberDisplayName(c.member) + " — " + c.total + " audience"+(c.total>1?"s":"")+" au total ("+c.count+" "+unit+")";
}

/* Mention entre parenthèses du collège d'un conseiller, affichée après
   son nom sur tous les plannings (« (S) » pour Salarié, « (E) » pour
   Employeur) afin de toujours savoir à quel collège chacun appartient,
   même une fois les deux collèges mélangés sur un même document. */
function collegeSuffix(college){
  return college==="Salarié" ? " (S)" : college==="Employeur" ? " (E)" : "";
}

/* Version générique (liste de conseillers explicite) sous-jacente à
   resolveMemberName (state.sectionMembers) ET à la vue combinée d'une
   audience côté espace administrateur (adminBuffer.sectionMembers — voir
   openAudienceDetail), pour ne jamais dupliquer cette résolution. */
function resolveMemberNameIn(members, id){
  if(!id) return "";
  if(id==="__self__") return "Moi-même"+(fullName(state.profile) ? " — "+fullName(state.profile)+collegeSuffix(state.profile.college) : "");
  var m = members.filter(function(x){ return x.id===id; })[0];
  return m ? memberDisplayName(m)+collegeSuffix(m.college) : "(Conseiller supprimé)";
}
function resolveMemberName(id){ return resolveMemberNameIn(state.sectionMembers, id); }
/* Même résolution que resolveMemberName, mais pour le document imprimé :
   l'utilisateur y apparaît sous la même forme « NOM Prénom » que les
   autres conseillers, sans la mention « Moi-même ». */
function resolveMemberNameForPrint(id){
  if(!id) return "";
  if(id==="__self__") return (memberDisplayName({nom:state.profile.nom, prenom:state.profile.prenom}) || "Moi-même")+collegeSuffix(state.profile.college);
  return resolveMemberName(id);
}

function planningDateLabel(dateStr){
  var label = parseISODate(dateStr).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  return label.charAt(0).toUpperCase() + label.slice(1);
}

/* prefill (facultatif) : {date, presidence} — ne s'applique qu'à la
   création d'une toute nouvelle entrée (existing===null), pour reprendre
   la date et la présidence d'une audience déjà connue par ailleurs (voir
   openAudienceDetail, qui ouvre ce formulaire pour compléter SON PROPRE
   collège sur une audience déjà visible mais pas encore renseignée de ce
   côté) plutôt que de laisser la date vide comme pour un tout premier
   ajout depuis « + Ajouter une date ». */
function openPlanningForm(existing, defaultType, prefill){
  var isEdit = !!existing;
  var defaultCollege = state.profile.college || COLLEGES[0] || "";
  var draft = existing ? Object.assign({}, existing, {assesseurs: existing.assesseurs.slice()}) : Object.assign({
    id:uid(), type: defaultType || "bj", date:"", college: defaultCollege, presidence: defaultCollege,
    president:null, assesseurs:[]
  }, prefill || {});

  var form = h("div", null);

  form.appendChild(h("label", {class:"field-label"}, "Type"));
  var typeSel = h("select", null, PLANNING_TYPES.map(function(t){
    return h("option", {value:t.id, selected: t.id===draft.type ? "selected" : null}, t.label);
  }));
  form.appendChild(typeSel);

  form.appendChild(h("label", {class:"field-label", style:"margin-top:14px"}, "Date"));
  var dateInput = h("input", {type:"date", value:draft.date});
  form.appendChild(dateInput);

  /* Le collège n'est plus un choix pour une NOUVELLE date : elle est
     toujours créée dans le collège renseigné dans les paramètres. Lors de
     la MODIFICATION d'une date existante, en revanche, on conserve son
     collège d'origine plutôt que de le forcer — une date reçue de l'autre
     collège via « Importer de l'autre collège » doit rester attribuée à ce
     collège même si on l'ouvre pour la consulter ou la corriger. */
  var entryCollege = (isEdit && COLLEGES.indexOf(draft.college)!==-1) ? draft.college : defaultCollege;

  form.appendChild(h("label", {class:"field-label", style:"margin-top:14px"}, "Statut"));
  var presidenceSel = h("select", null, COLLEGES.map(function(c){
    return h("option", {value:c, selected: c===draft.presidence ? "selected" : null}, "Présidence "+(c==="Salarié"?"salariée":"employeur"));
  }));
  form.appendChild(presidenceSel);

  var rolesBox = h("div", {style:"margin-top:14px"});
  form.appendChild(rolesBox);

  var presidentSel = null, assesseurSels = [];

  function roleSelect(candidates, typeId, allowSelf){
    var opts = [ h("option", {value:"", selected:"selected"}, "— Choisir —") ];
    if(allowSelf){
      opts.push(h("option", {value:"__self__"}, "Moi-même — "+(fullName(state.profile)||"vous")));
    }
    candidates.forEach(function(c){
      opts.push(h("option", {value:c.id}, candidateOptionLabel(c, typeId)));
    });
    return h("select", null, opts);
  }

  /* L'utilisateur apparaît toujours comme candidat possible (« Moi-même »)
     dans tous les menus de rôle dès lors que le collège choisi est le
     sien — sauf dans les menus autres que celui où il est déjà retenu
     pour cette même audience (une même personne ne peut tenir deux rôles
     à la fois) : voir syncSelfAvailability ci-dessous. */
  function syncSelfAvailability(allowSelf){
    if(!allowSelf) return;
    var selects = [presidentSel].concat(assesseurSels).filter(Boolean);
    var holder = null;
    selects.forEach(function(sel){ if(sel.value==="__self__") holder = sel; });
    selects.forEach(function(sel){
      var opt = sel.querySelector('option[value="__self__"]');
      if(sel===holder) return;
      if(holder){
        if(opt) opt.remove();
      } else if(!opt){
        var newOpt = h("option", {value:"__self__"}, "Moi-même — "+(fullName(state.profile)||"vous"));
        sel.insertBefore(newOpt, sel.options[1] || null);
      }
    });
  }

  function updateRoles(){
    clear(rolesBox);
    presidentSel = null; assesseurSels = [];
    var type = typeSel.value;
    var college = entryCollege;
    var presides = college === presidenceSel.value;
    var candidates = rankedCandidates(college, type);
    var allowSelf = college === state.profile.college;

    if(candidates.length===0){
      rolesBox.appendChild(h("div", {class:"footnote"}, "Aucun conseiller enregistré dans ce collège — ajoutez-le d’abord dans « Acteurs de ma section »."));
    }

    if(type==="bj"){
      if(presides){
        rolesBox.appendChild(h("label", {class:"field-label"}, "Président"));
        presidentSel = roleSelect(candidates, type, allowSelf);
        rolesBox.appendChild(presidentSel);
        rolesBox.appendChild(h("label", {class:"field-label", style:"margin-top:12px"}, "Assesseur"));
        var a1 = roleSelect(candidates, type, allowSelf);
        rolesBox.appendChild(a1);
        assesseurSels = [a1];
      } else {
        rolesBox.appendChild(h("label", {class:"field-label"}, "1er assesseur"));
        var b1 = roleSelect(candidates, type, allowSelf);
        rolesBox.appendChild(b1);
        rolesBox.appendChild(h("label", {class:"field-label", style:"margin-top:12px"}, "2e assesseur"));
        var b2 = roleSelect(candidates, type, allowSelf);
        rolesBox.appendChild(b2);
        assesseurSels = [b1, b2];
      }
    } else {
      if(presides){
        rolesBox.appendChild(h("label", {class:"field-label"}, "Président"));
        presidentSel = roleSelect(candidates, type, allowSelf);
        rolesBox.appendChild(presidentSel);
      } else {
        rolesBox.appendChild(h("label", {class:"field-label"}, "Assesseur"));
        var c1 = roleSelect(candidates, type, allowSelf);
        rolesBox.appendChild(c1);
        assesseurSels = [c1];
      }
    }

    /* Pré-sélection des valeurs existantes, une fois les menus reconstruits. */
    if(presidentSel){
      if(draft.president && (draft.president==="__self__" || candidates.some(function(c){ return c.id===draft.president; }))){
        presidentSel.value = draft.president;
      }
    }
    assesseurSels.forEach(function(sel, i){
      var val = draft.assesseurs[i];
      if(val && (val==="__self__" || candidates.some(function(c){ return c.id===val; }))){
        sel.value = val;
      }
    });

    var allSelects = [presidentSel].concat(assesseurSels).filter(Boolean);
    allSelects.forEach(function(sel){ sel.addEventListener("change", function(){ syncSelfAvailability(allowSelf); }); });
    syncSelfAvailability(allowSelf);
  }
  typeSel.addEventListener("change", updateRoles);
  presidenceSel.addEventListener("change", updateRoles);
  updateRoles();

  var actions = h("div", {style:"margin-top:18px"});
  actions.appendChild(h("button", {class:"sheet-btn primary", onclick:function(){
    if(!dateInput.value){ toast("Choisissez une date."); return; }

    var picked = [];
    if(presidentSel && presidentSel.value) picked.push(presidentSel.value);
    assesseurSels.forEach(function(sel){ if(sel.value) picked.push(sel.value); });
    var dupes = picked.filter(function(v, i){ return picked.indexOf(v)!==i; });
    if(dupes.length){ toast("Une même personne ne peut pas occuper deux rôles pour cette date."); return; }

    var entry = {
      id: draft.id,
      type: typeSel.value,
      date: dateInput.value,
      college: entryCollege,
      presidence: presidenceSel.value,
      president: presidentSel && presidentSel.value ? presidentSel.value : null,
      assesseurs: assesseurSels.map(function(sel){ return sel.value; }).filter(Boolean),
      importSourceId: draft.importSourceId || null
    };

    if(isEdit){
      state.planning = state.planning.map(function(p){ return p.id===entry.id ? entry : p; });
    } else {
      state.planning.push(entry);
    }
    saveState(); closeSheet();
    planningViewType = entry.type;
    planningViewMonth = monthKey(entry.date);
    render("planification");
    toast(isEdit ? "Date modifiée." : "Date ajoutée.");
  }}, isEdit ? "Enregistrer les modifications" : "Ajouter la date"));
  if(isEdit){
    actions.appendChild(h("button", {class:"sheet-btn danger", onclick:function(){
      state.planning = state.planning.filter(function(p){ return p.id!==draft.id; });
      saveState(); closeSheet(); render("planification"); toast("Date supprimée.");
    }}, "Supprimer cette date"));
  }
  actions.appendChild(h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler"));
  form.appendChild(actions);

  openSheet(isEdit ? "Modifier la date" : "Nouvelle date", form);
}

/* =================================================================
   ÉCHANGE DU PLANNING AVEC L'AUTRE COLLÈGE (fichier JSON)
   Chaque conseiller ne saisit que les audiences et conseillers de son
   propre collège (voir openPlanningForm ci-dessus, qui fixe désormais le
   collège au profil). Pour obtenir, de chaque côté, un planning complet
   des deux collèges, on échange un fichier JSON auto-suffisant : les
   références aux conseillers y sont enregistrées sous forme de nom
   (nom/prénom), jamais d'identifiant interne, ces identifiants étant
   propres à chaque appareil et n'ayant aucun sens une fois transmis.
   ================================================================= */

/* Forme « exportable » (nom/prénom uniquement) d'un président ou
   assesseur d'audience — équivalent de resolveMemberNameForPrint, mais
   qui renvoie un objet structuré plutôt qu'un texte déjà mis en forme,
   pour pouvoir être ré-associé à un conseiller local à l'import. */
function resolveMemberForExport(id){
  if(!id) return null;
  if(id==="__self__") return { nom: state.profile.nom||"", prenom: state.profile.prenom||"" };
  var m = state.sectionMembers.filter(function(x){ return x.id===id; })[0];
  return m ? { nom: m.nom||"", prenom: m.prenom||"" } : null;
}


/* =================================================================
   FORME « DIFFUSION » DU PLANNING (les deux collèges réunis)
   Format JSON regroupant l'intégralité du planning connu (les deux
   collèges). Ne sert plus, depuis le retrait du bouton « Partager avec la
   section », qu'en interne à sectionPlanningPayloadForSync ci-dessous,
   pour DÉRIVER automatiquement « Mon planning » de chaque conseiller
   depuis le planning de section déjà synchronisé via Firebase — plus
   aucun écran ne propose d'envoyer ce fichier à la main. */
function sectionBroadcastPayload(){
  var members = state.sectionMembers.map(function(m){
    return { nom:m.nom||"", prenom:m.prenom||"", college:m.college||"", syndicat:m.syndicat||"", email:m.email||"", tel:m.tel||"" };
  });
  var planning = state.planning.map(function(p){
    return {
      type: p.type, date: p.date, college: p.college||"", presidence: p.presidence||"",
      president: resolveMemberForExport(p.president),
      assesseurs: (p.assesseurs||[]).map(resolveMemberForExport).filter(Boolean)
    };
  });
  return {
    schema: "cph-planning-broadcast.v1",
    exportedAt: new Date().toISOString(),
    section: state.profile.section||"",
    cph: cphLabel(state.profile),
    from: fullName(state.profile),
    fromTel: state.profile.tel||"",
    members: members,
    planning: planning
  };
}

/* Variante de sectionBroadcastPayload utilisée pour DÉRIVER automatiquement
   « Mon planning » depuis le planning de section déjà synchronisé via
   Firebase (voir syncMyPlanningFromSection et renderers["mon-planning"]),
   plutôt que depuis un fichier reçu à la main de la présidence. Mêmes
   annuaire et planning, mais from/fromTel doivent représenter le PRÉSIDENT
   DE LA SECTION (annoncé par sectionRole sur l'annuaire), et non le profil
   du présent appareil — contrairement à un export classique, cette
   fonction peut être appelée depuis l'appareil d'un simple conseiller. */
function sectionPlanningPayloadForSync(){
  var payload = sectionBroadcastPayload();
  var president = state.sectionMembers.filter(function(m){ return m.sectionRole==="president"; })[0];
  payload.from = president ? memberDisplayName(president) : "";
  payload.fromTel = president ? (president.tel||"") : "";
  return payload;
}
/* Recalcule state.myPlanning depuis le planning de section déjà présent
   localement (state.planning/state.sectionMembers, tenus à jour par la
   synchronisation Firebase — voir maybeAutoPullSection), en réutilisant
   TEL QUEL applyMyPlanningImport (même reconnaissance "audiences me
   concernant", même fusion des deux collèges par « pendant ») : aucune
   règle métier dupliquée entre le fichier reçu à la main et cette version
   automatique — seule la provenance du payload change. Ne s'applique que
   si la synchronisation est active ET que nom+prénom sont renseignés (même
   condition que openMyPlanningImportConfirm, nécessaire à la reconnaissance
   par nom) ; renvoie false sans rien changer sinon, laissant alors
   renderers["mon-planning"] proposer l'alternative appropriée (import
   manuel si pas de synchronisation, ou invitation à renseigner son profil
   si la synchronisation est active mais l'identité pas encore connue). */
function syncMyPlanningFromSection(){
  if(!state.sync.sectionCode) return false;
  if(!(state.profile.nom||"").trim() || !(state.profile.prenom||"").trim()) return false;
  applyMyPlanningImport(sectionPlanningPayloadForSync());
  saveState();
  return true;
}

function isValidSectionBroadcastPayload(parsed){
  return !!(parsed && typeof parsed==="object"
    && typeof parsed.schema==="string" && parsed.schema.indexOf("cph-planning-broadcast")===0
    && Array.isArray(parsed.members) && Array.isArray(parsed.planning));
}

/* Ne retient, dans le fichier reçu, que les audiences où l'utilisateur
   apparaît (comme président ou assesseur) — reconnu par son nom/prénom
   tels que renseignés dans son profil. Remplace entièrement le planning
   personnel précédemment importé (pas de fusion : c'est un instantané en
   lecture seule, alimenté uniquement par la présidence de section).
   payload.planning contient les enregistrements BRUTS des deux collèges
   (un enregistrement par collège et par audience, comme dans state.planning
   — voir sectionBroadcastPayload) : pour que l'écran « Mon planning »
   puisse afficher TOUS les conseillers prévus sur une audience (et pas
   seulement ceux de son propre côté), chaque enregistrement où
   l'utilisateur apparaît est complété par son « pendant » (même date,
   même type, collège opposé), sur le même principe que
   mergePlanningEntriesForDisplay côté présidence : le président retenu
   est celui du côté qui préside, les assesseurs des deux côtés sont
   additionnés. Chaque conseiller est étiqueté par son collège d'origine
   (voir collegeSuffix) pour rester lisible une fois les deux côtés
   réunis. */
function applyMyPlanningImport(payload){
  var myNom = (state.profile.nom||"").trim().toLocaleLowerCase("fr-FR");
  var myPrenom = (state.profile.prenom||"").trim().toLocaleLowerCase("fr-FR");
  function isMe(nameObj){
    if(!nameObj) return false;
    return (nameObj.nom||"").trim().toLocaleLowerCase("fr-FR")===myNom
      && (nameObj.prenom||"").trim().toLocaleLowerCase("fr-FR")===myPrenom;
  }
  function tagCollege(nameObj, college){
    return nameObj ? { nom:nameObj.nom||"", prenom:nameObj.prenom||"", college:college||"" } : null;
  }
  var records = payload.planning||[];
  var entries = [];
  records.forEach(function(p){
    if(!p || !p.date || !p.type) return;
    var role = isMe(p.president) ? "president" : ((p.assesseurs||[]).some(isMe) ? "assesseur" : null);
    if(!role) return;
    var counterpart = records.filter(function(o){
      return o!==p && o.date===p.date && o.type===p.type && (o.college||"")!==(p.college||"");
    })[0] || null;
    var presidingRec = (p.college||"")===(p.presidence||"") ? p : (counterpart && (counterpart.college||"")===(counterpart.presidence||"") ? counterpart : null);
    var assesseurs = (p.assesseurs||[]).map(function(a){ return tagCollege(a, p.college); });
    if(counterpart){
      assesseurs = assesseurs.concat((counterpart.assesseurs||[]).map(function(a){ return tagCollege(a, counterpart.college); }));
    }
    entries.push({
      type: p.type, date: p.date, college: p.college||"", presidence: p.presidence||"",
      president: presidingRec ? tagCollege(presidingRec.president, presidingRec.college) : null,
      assesseurs: assesseurs.filter(Boolean),
      role: role
    });
  });
  state.myPlanning = {
    importedAt: new Date().toISOString(),
    from: payload.from||"",
    fromTel: payload.fromTel||"",
    section: payload.section||"",
    cph: payload.cph||"",
    entries: entries,
    members: (payload.members||[]).map(function(m){
      return { nom:m.nom||"", prenom:m.prenom||"", college:m.college||"", syndicat:m.syndicat||"", email:m.email||"", tel:m.tel||"" };
    })
  };
  return entries.length;
}

function openMyPlanningImportConfirm(payload){
  if(!(state.profile.nom||"").trim() || !(state.profile.prenom||"").trim()){
    toast("Renseignez d’abord votre nom et votre prénom dans Réglages, pour que votre planning personnel puisse être reconnu dans le fichier.");
    return;
  }
  var exportedDate = null;
  try{ exportedDate = payload.exportedAt ? new Date(payload.exportedAt) : null; }catch(e){}
  var whenTxt = exportedDate && !isNaN(exportedDate) ? " le "+exportedDate.toLocaleDateString("fr-FR") : "";
  openSheet("Importer mon planning", h("div", null,
    h("p", {class:"lede"},
      "Fichier de la section"+(payload.from ? ", envoyé par "+payload.from : "")+whenTxt+"."),
    h("p", {class:"lede"},
      "Seules les audiences où vous apparaissez (président ou assesseur) seront conservées. Ce planning personnel n’est pas modifiable ; il remplace la version précédemment importée, s’il y en avait une."),
    h("button", {class:"sheet-btn primary", onclick:function(){
      var n = applyMyPlanningImport(payload);
      saveState(); closeSheet(); render("mon-planning");
      toast(n>0 ? n+" audience(s) vous concernant importée(s)." : "Fichier importé — aucune audience ne vous concerne pour l’instant.");
    }}, "Confirmer l’import"),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
  ));
}

/* =================================================================
   ÉCRAN — MON PLANNING (conseiller sans droits de présidence)
   ================================================================= */
function myPlanningImportInput(onImported){
  return h("input", {type:"file", accept:"application/json", style:"display:none", onchange:function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!isValidSectionBroadcastPayload(parsed)){
          toast("Fichier illisible — vérifiez qu’il s’agit bien d’un export envoyé depuis « Partager avec la section ».");
          return;
        }
        openMyPlanningImportConfirm(parsed);
      }catch(err){ toast("Fichier illisible — vérifiez qu’il s’agit bien d’un export envoyé depuis « Partager avec la section »."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }});
}

/* Nom affiché pour un conseiller « Mon planning » ({nom,prenom,college}) —
   même convention (S)/(E) que resolveMemberNameForPrint côté présidence. */
function formatMyPlanningPerson(o){
  if(!o || (!o.nom && !o.prenom)) return "";
  return (memberDisplayName({nom:o.nom, prenom:o.prenom}) || "")+collegeSuffix(o.college);
}
function isMyPlanningSelf(nameObj){
  if(!nameObj) return false;
  var myNom = (state.profile.nom||"").trim().toLocaleLowerCase("fr-FR");
  var myPrenom = (state.profile.prenom||"").trim().toLocaleLowerCase("fr-FR");
  return (nameObj.nom||"").trim().toLocaleLowerCase("fr-FR")===myNom
    && (nameObj.prenom||"").trim().toLocaleLowerCase("fr-FR")===myPrenom;
}

/* Ouvre l'app SMS native avec un message pré-rempli — même principe et
   même limite que les liens mailto: employés ailleurs dans l'application
   (impossible d'envoyer automatiquement depuis une page web, seule
   l'ouverture pré-remplie l'est). Le séparateur avant "body=" diffère
   entre iOS (« & ») et les autres systèmes (« ? »), d'où la détection. */
function isIOSDevice(){
  var ua = (navigator.userAgent || navigator.platform || "");
  return /iP(hone|od|ad)/.test(ua);
}
function openSmsCompose(tel, body){
  var digits = (tel||"").replace(/[^\d+]/g, "");
  var sep = isIOSDevice() ? "&" : "?";
  var link = "sms:"+encodeURIComponent(digits)+sep+"body="+encodeURIComponent(body);
  try{ window.location.href = link; }catch(e){}
}

/* Message d'invitation envoyé par SMS depuis une fiche de l'espace
   administrateur (bouton « Inviter », demande explicite de l'utilisateur)
   — texte et retours à la ligne imposés tels quels. */
function buildInviteSmsBody(sectionCode, pin){
  return [
    "Bienvenue sur Mon Assistant CPH.",
    "",
    "Pour vous connecter, cliquez sur ce lien : https://sinsitis-jerome.github.io/assistantcph/",
    "",
    "Utiliser ce code de section : "+sectionCode,
    "",
    "Puis ce code personnel lorsque demandé : "+pin
  ].join("\n");
}

/* Vue détail d'une audience de « Mon planning » : rappelle qui d'autre y
   est prévu (les deux collèges réunis, voir applyMyPlanningImport) et
   propose la demande d'échange. */
function openMyPlanningEntryDetail(e){
  var body = h("div", null);
  var sub = planningTypeLabel(e.type)+" · Présidence "+(e.presidence==="Salarié"?"salariée":e.presidence==="Employeur"?"employeur":"—");
  body.appendChild(h("p", {class:"lede"}, sub));

  var panel = h("div", {class:"panel"});
  panel.appendChild(h("div", null,
    h("div", {class:"field-label"}, "Président"),
    h("div", {style:"margin-bottom:12px"}, e.president ? (formatMyPlanningPerson(e.president)+(isMyPlanningSelf(e.president) ? " (vous)" : "")) : "Non renseigné")
  ));
  panel.appendChild(h("div", null,
    h("div", {class:"field-label"}, e.assesseurs.length>1 ? "Assesseurs" : "Assesseur"),
    h("div", null, e.assesseurs.length
      ? e.assesseurs.map(function(a){ return h("div", {style:"margin-bottom:4px"}, formatMyPlanningPerson(a)+(isMyPlanningSelf(a) ? " (vous)" : "")); })
      : h("div", null, "Non renseigné"))
  ));
  body.appendChild(panel);

  /* Deux façons bien différentes de « demander un échange » selon que
     l'appareil dispose ou non d'une synchronisation Firebase active (voir
     échange avec l'utilisateur, demande du module ÉCHANGE AUTOMATISÉ
     ci-dessous) : avec synchronisation, state.planning et
     state.sectionMembers reflètent déjà toute la section (pas seulement
     « Mon planning », dérivé) — l'application peut donc dérouler tout le
     parcours (candidats classés, confirmation, choix de l'audience à
     échanger, mise à jour Firebase) sans intervention du président. Sans
     synchronisation, l'appareil n'a jamais eu accès qu'à son propre
     planning personnel (fichier reçu à la main) : la demande reste alors
     manuelle, jusqu'à une simple notification SMS au président
     (comportement d'origine, entièrement inchangé — voir
     openSwapRequestInstructions ci-dessous). */
  body.appendChild(h("button", {class:"sheet-btn accent", style:"margin-top:14px", onclick:function(){
    if(state.sync.sectionCode){ openExchangeRequest(e); } else { openSwapRequestInstructions(e); }
  }}, "Demander un échange"));
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:closeSheet}, "Fermer"));

  openSheet(planningDateLabel(e.date), body);
}

/* =================================================================
   ÉCHANGE AUTOMATISÉ (synchronisation Firebase active)
   ------------------------------------------------------------------
   Demande de l'utilisateur (parcours détaillé en quatre étapes) : depuis
   une audience de « Mon planning », proposer d'abord les conseillers de
   même section + même collège + même syndicat, classés du moins au plus
   sollicité (même logique que l'outil de planification — voir
   rankedCandidatesIn), avec leurs coordonnées (tél/email) pour un contact
   hors application ; à défaut, les mêmes mais avec un syndicat différent ;
   à défaut encore, prévenir que l'échange n'est pas possible. Dès qu'un
   conseiller accepte, exiger la confirmation qu'un écrit de sa part existe
   (case à cocher obligatoire) avant de proposer ses audiences à venir et
   d'appliquer l'échange (state.planning ET Firestore mis à jour) —
   contrairement au module ci-dessus (SMS au président), ici c'est
   l'appareil du conseiller demandeur qui applique directement l'échange :
   possible parce que la synchronisation Firebase donne accès en écriture
   à n'importe quel acteur de la section (voir « Envoyer ma version
   actuelle » en Réglages, déjà ouvert à tous, pas seulement à la
   présidence — Firestore lui-même ne distingue pas les rôles, voir module
   SYNCHRONISATION). Un échange ne change jamais le collège attaché à une
   audience (le candidat proposé est toujours du même collège que la
   personne qui échange), ce qui garantit que chacun reste qualifié pour
   la place qu'il occupe après l'échange, dans les deux sens. */

/* Retrouve, dans state.planning (données de section à jour, pas le
   « Mon planning » dérivé et purement nominatif), la ligne réelle où
   l'utilisateur apparaît pour une date+type donnés — nécessaire pour
   pouvoir la modifier (id inclus), contrairement aux entrées de
   state.myPlanning qui ne portent aucun identifiant technique. */
function findOwnPlanningEntryFor(dateStr, typeId){
  return state.planning.filter(function(p){
    return p.date===dateStr && p.type===typeId
      && (isSelfMemberId(p.president) || (p.assesseurs||[]).some(isSelfMemberId));
  })[0] || null;
}

function openExchangeRequest(e){
  if(!state.profile.memberId){
    openSheet("Demander un échange", h("div", null,
      h("p", {class:"lede"}, "Pour demander un échange, votre profil doit d’abord être lié à votre fiche dans l’annuaire de la section."),
      h("button", {class:"sheet-btn primary", onclick:function(){ closeSheet(); go("settings"); }}, "Aller à Réglages"),
      h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:closeSheet}, "Fermer")
    ));
    return;
  }
  var meMember = state.sectionMembers.filter(function(m){ return m.id===state.profile.memberId; })[0];
  if(!meMember){
    toast("Votre fiche est introuvable dans l’annuaire actuel de la section — actualisez depuis « Mon planning » puis réessayez.");
    return;
  }
  var myEntry = findOwnPlanningEntryFor(e.date, e.type);
  if(!myEntry){
    toast("Cette audience est introuvable dans le planning actuel de la section — actualisez depuis « Mon planning » puis réessayez.");
    return;
  }
  openExchangeCandidatesSheet(myEntry, meMember, 1);
}

/* Étape 1 (et son repli à l'étape 2) : liste des candidats, classés comme
   pour l'outil de planification (rankedCandidatesIn), avec leurs
   coordonnées. tier 1 = même syndicat ; tier 2 = syndicat différent, mais
   même collège (jamais d'autre collège — voir commentaire du module
   ci-dessus). Une liste vide saute automatiquement à l'étape suivante
   plutôt que d'afficher une liste vide avec deux boutons sans objet. */
function openExchangeCandidatesSheet(myEntry, meMember, tier){
  var pool = state.sectionMembers.filter(function(m){
    if(m.id===meMember.id) return false;
    if((m.college||"")!==(meMember.college||"")) return false;
    var sameSyndicat = (m.syndicat||"")===(meMember.syndicat||"");
    return tier===1 ? sameSyndicat : !sameSyndicat;
  });
  if(pool.length===0){
    if(tier===1){ openExchangeCandidatesSheet(myEntry, meMember, 2); return; }
    openExchangeImpossibleSheet();
    return;
  }
  var ranked = rankedCandidatesIn(pool, state.planning, meMember.college, myEntry.type);

  var body = h("div", null);
  body.appendChild(h("p", {class:"lede"}, tier===1
    ? "Conseillers de votre collège et de votre syndicat, classés du moins au plus sollicité :"
    : "Aucun conseiller de votre syndicat n’a accepté — conseillers de votre collège mais d’un autre syndicat, classés du moins au plus sollicité :"));
  body.appendChild(h("p", {class:"lede", style:"font-weight:600"}, "Contactez en priorité les conseillers ci-dessous dans l’ordre indiqué."));

  ranked.forEach(function(c){
    var m = c.member;
    var digits = (m.tel||"").replace(/\D/g, "");
    body.appendChild(h("div", {class:"panel", style:"margin-bottom:10px; padding:12px 14px;"},
      h("div", {style:"display:flex; justify-content:space-between; align-items:baseline; gap:8px;"},
        h("div", {style:"font-weight:600"}, memberDisplayName(m)),
        h("div", {class:"footnote"}, c.total+" audience"+(c.total>1?"s":"")+" au total")
      ),
      h("div", {class:"info-list", style:"margin-top:6px"},
        h("div", {class:"info-row"},
          h("div", {class:"info-label"}, "Téléphone"),
          m.tel ? h("a", {href:"tel:"+digits, class:"info-value"}, formatTelFR(m.tel)) : h("div", {class:"info-value"}, "—")),
        h("div", {class:"info-row"},
          h("div", {class:"info-label"}, "Email"),
          m.email ? h("a", {href:"mailto:"+m.email, class:"info-value"}, m.email) : h("div", {class:"info-value"}, "—"))
      )
    ));
  });

  body.appendChild(h("button", {class:"sheet-btn accent", style:"margin-top:8px", onclick:function(){
    openExchangeAcceptedPicker(myEntry, meMember, ranked, tier);
  }}, "L’un d’eux a accepté l’échange"));
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:function(){
    if(tier===1){ openExchangeCandidatesSheet(myEntry, meMember, 2); }
    else { openExchangeImpossibleSheet(); }
  }}, "Aucun n’a accepté l’échange"));
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:closeSheet}, "Fermer"));

  openSheet("Demander un échange", body);
}

function openExchangeImpossibleSheet(){
  openSheet("Demander un échange", h("div", null,
    h("p", {class:"lede"}, "Aucun conseiller de votre collège n’a accepté l’échange — l’échange n’est pas possible pour cette audience."),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Fermer")
  ));
}

/* Étape 2 : qui, dans la liste qui vient d'être présentée, a effectivement
   accepté (bouton unique « L'un d'eux » — encore fallait-il préciser
   lequel). Un simple <select>, comme pour la notification SMS existante
   (openSwapNotifyPicker), plutôt qu'une liste de coordonnées à nouveau
   cliquable (déjà affichée juste avant, purement informative). */
function openExchangeAcceptedPicker(myEntry, meMember, ranked, tier){
  var body = h("div", null);
  body.appendChild(h("p", {class:"lede"}, "Qui a accepté l’échange ?"));
  body.appendChild(h("label", {class:"field-label"}, "Conseiller"));
  var sel = h("select", null,
    [h("option", {value:"", selected:"selected"}, "— Choisir —")].concat(
      ranked.map(function(c, i){ return h("option", {value:String(i)}, memberDisplayName(c.member)); })
    )
  );
  body.appendChild(sel);
  var nextBtn = h("button", {class:"sheet-btn accent", style:"margin-top:14px", disabled:"disabled", onclick:function(){
    var chosen = ranked[Number(sel.value)];
    if(!chosen) return;
    openExchangeConfirmSheet(myEntry, meMember, chosen.member);
  }}, "Continuer");
  sel.addEventListener("change", function(){ nextBtn.disabled = !sel.value; });
  body.appendChild(nextBtn);
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:function(){ openExchangeCandidatesSheet(myEntry, meMember, tier); }}, "Retour"));
  openSheet("Demander un échange", body);
}

/* Étape 3 : confirmation obligatoire d'un écrit — case à cocher (jamais
   pré-cochée), bouton de validation désactivé tant qu'elle ne l'est pas
   (voir échange avec l'utilisateur : « une fenêtre de confirmation
   apparait demandant à l'utilisateur de cocher une case comme quoi il
   dispose d'un écrit... ce n'est qu'une fois que la case est cochée que
   l'utilisateur peut valider »). Rien n'est modifié à ce stade : seule
   l'étape suivante (choix de l'audience) déclenche réellement l'échange. */
function openExchangeConfirmSheet(myEntry, meMember, candidateMember){
  var body = h("div", null);
  body.appendChild(h("p", {class:"lede"},
    "Avant de continuer, confirmez que vous disposez bien d’un ",
    h("span", {style:"font-weight:700; text-decoration:underline"}, "écrit"),
    " (mail ou SMS) de "+memberDisplayName(candidateMember)+" actant son accord pour cet échange."
  ));

  var label = h("label", {style:"display:flex; align-items:flex-start; gap:8px; margin-top:12px; cursor:pointer;"});
  var checkbox = h("input", {type:"checkbox"});
  label.appendChild(checkbox);
  label.appendChild(h("span", null, "Je dispose d’un écrit de "+memberDisplayName(candidateMember)+" actant son accord pour cet échange."));
  body.appendChild(label);

  var nextBtn = h("button", {class:"sheet-btn accent", style:"margin-top:14px", disabled:"disabled", onclick:function(){
    openExchangeTargetPicker(myEntry, meMember, candidateMember);
  }}, "Valider l’échange");
  checkbox.addEventListener("change", function(){ nextBtn.disabled = !checkbox.checked; });
  body.appendChild(nextBtn);
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:closeSheet}, "Annuler"));

  openSheet("Confirmer l’échange", body);
}

/* Étape 4 : choix, parmi les audiences À VENIR du conseiller ayant
   accepté, de celle qui sera échangée contre la sienne — exclut par
   sécurité toute ligne qui contiendrait déjà l'un ou l'autre des deux
   conseillers (ne devrait jamais arriver en pratique, myEntry et cette
   liste portant sur deux personnes distinctes, mais évite un échange
   incohérent si jamais une même audience impliquait déjà les deux). Un
   conseiller sans aucune audience à venir ne peut par construction rien
   échanger : message dédié plutôt qu'une liste vide. */
function openExchangeTargetPicker(myEntry, meMember, candidateMember){
  var today = todayISO();
  var candidateEntries = state.planning.filter(function(p){
    if(p.id===myEntry.id) return false;
    if(p.date<today) return false;
    var candidatePresent = p.president===candidateMember.id || (p.assesseurs||[]).indexOf(candidateMember.id)!==-1;
    if(!candidatePresent) return false;
    var mePresent = p.president===meMember.id || (p.assesseurs||[]).indexOf(meMember.id)!==-1;
    return !mePresent;
  }).sort(function(a,b){ return a.date<b.date ? -1 : a.date>b.date ? 1 : 0; });

  if(candidateEntries.length===0){
    openSheet("Demander un échange", h("div", null,
      h("p", {class:"lede"}, memberDisplayName(candidateMember)+" n’a aucune audience à venir sur laquelle échanger — l’échange n’est pas possible avec cette personne."),
      h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Fermer")
    ));
    return;
  }

  var body = h("div", null);
  body.appendChild(h("p", {class:"lede"}, "Choisissez l’audience de "+memberDisplayName(candidateMember)+" à échanger contre la vôtre :"));
  var list = h("div", null);
  candidateEntries.forEach(function(p){
    var roleTxt = p.president===candidateMember.id ? "Préside" : "Assesseur";
    list.appendChild(h("div", {class:"row-click", onclick:function(){
      performExchange(myEntry, meMember, p, candidateMember);
    }},
      h("div", {class:"rc-main"},
        h("div", {class:"rc-title"}, planningDateLabel(p.date)),
        h("div", {class:"rc-sub"}, roleTxt+" · "+planningTypeLabel(p.type)+" · Collège "+(p.college||"—").toLowerCase())
      ),
      icon("ic-chev", "chev")
    ));
  });
  body.appendChild(h("div", {class:"panel"}, list));
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:14px", onclick:closeSheet}, "Annuler"));

  openSheet("Choisir l’audience", body);
}

/* Applique réellement l'échange : remplace, dans chacune des deux lignes
   réelles de state.planning, l'un des deux conseillers par l'autre (rôle
   et collège de la ligne inchangés — voir commentaire du module) puis
   enregistre et pousse immédiatement vers Firestore (comme « Envoyer ma
   version actuelle » en Réglages, ouvert à tout acteur synchronisé). En
   cas d'échec d'envoi (hors ligne, par exemple), l'échange reste appliqué
   localement — jamais perdu — avec une invitation claire à renvoyer
   depuis Réglages dès que possible, plutôt que de faire disparaître
   silencieusement le travail de négociation qui vient d'aboutir. */
function performExchange(myEntry, meMember, candidateEntry, candidateMember){
  function swapIn(entry, oldId, newId){
    if(entry.president===oldId) entry.president = newId;
    entry.assesseurs = (entry.assesseurs||[]).map(function(id){ return id===oldId ? newId : id; });
  }
  swapIn(myEntry, meMember.id, candidateMember.id);
  swapIn(candidateEntry, candidateMember.id, meMember.id);
  saveState();
  closeSheet();
  toast("Échange enregistré — envoi à la section en cours…");
  var cph = cphLabel(state.profile) || state.profile.cph || "";
  var section = state.profile.section || "";
  pushSectionSync(state.sync.sectionCode, cph, section).then(function(){
    markSyncDone();
    toast("Échange enregistré et envoyé à la section.");
    render("mon-planning");
  }).catch(function(err){
    /* Un simple renvoi vers « Réglages > Synchronisation > Envoyer mes
       modifications » ne convient plus ici : ce bouton est désormais
       réservé à président(e)/vice-président(e) (voir Réglages), alors
       que n'importe quel conseiller synchronisé peut se retrouver ici.
       Offrir un vrai bouton « Réessayer » sur place évite ce problème,
       quel que soit le rôle de la personne. */
    render("mon-planning");
    openSheet("Envoi à la section échoué", h("div", null,
      h("p", {class:"lede"}, "L’échange est bien enregistré sur cet appareil, mais l’envoi à la section a échoué — vérifiez votre connexion."),
      h("button", {class:"sheet-btn accent", onclick:function(){
        pushSectionSync(state.sync.sectionCode, cph, section).then(function(){
          markSyncDone(); closeSheet(); toast("Échange envoyé à la section.");
        }).catch(function(){ toast("Échec de l’envoi — réessayez plus tard."); });
      }}, "Réessayer l’envoi"),
      h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Plus tard")
    ));
  });
}

/* Étape 1 de la demande d'échange manuelle (sans synchronisation) : marche
   à suivre — l'application ne peut évidemment pas savoir qui accepte
   quoi, la démarche reste manuelle (annuaire + accord écrit obligatoire) ;
   seule la notification finale au président est automatisée. */
function openSwapRequestInstructions(e){
  var body = h("div", null);
  body.appendChild(h("p", {class:"lede"}, "Contactez les autres conseillers de votre section et collège en utilisant l’annuaire."));
  if(sectionLink("annuaireUrl")){
    body.appendChild(h("a", {href:sectionLink("annuaireUrl"), target:"_blank", rel:"noopener", class:"sheet-btn ghost", style:"display:block; text-align:center; text-decoration:none; box-sizing:border-box; margin-bottom:8px;"}, "Ouvrir l’annuaire"));
  }
  body.appendChild(h("p", {class:"lede"}, "Une fois que la personne vous a accepté l’échange (confirmation écrite obligatoire — mail ou SMS), cliquez ci-dessous :"));
  body.appendChild(h("button", {class:"sheet-btn accent", onclick:function(){ openSwapNotifyPicker(e); }}, "Notifier un échange"));
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:closeSheet}, "Annuler"));
  openSheet("Demander un échange", body);
}

/* Étape 2 : choix du conseiller qui a accepté l'échange, parmi ceux du
   même collège que soi (un échange ne change jamais le collège attaché à
   l'audience), puis envoi du SMS de notification à la présidence de
   section (numéro transmis avec le fichier — voir applyMyPlanningImport).
   Comme pour tout lien sms:, l'application ne peut qu'ouvrir l'app de
   messagerie pré-remplie ; l'envoi final reste un geste de l'utilisateur. */
function openSwapNotifyPicker(e){
  var mine = state.myPlanning || DEFAULT_STATE.myPlanning;
  var myCollege = state.profile.college || COLLEGES[0] || "";
  var candidates = (mine.members||[])
    .filter(function(m){ return (m.college||"")===myCollege && !isMyPlanningSelf(m); })
    .sort(function(a,b){ return memberDisplayName(a).localeCompare(memberDisplayName(b), "fr"); });

  if(candidates.length===0){
    openSheet("Notifier un échange", h("div", null,
      h("p", {class:"lede"}, "Aucun autre conseiller de votre collège n’est disponible dans "+(state.sync.sectionCode ? "l’annuaire de la section — vérifiez qu’il est à jour (bouton « Actualiser depuis la section »)." : "le fichier reçu — demandez à la présidence de section de vous transmettre une version à jour du planning (bouton « Importer une nouvelle version »).")),
      h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Fermer")
    ));
    return;
  }

  var body = h("div", null);
  body.appendChild(h("p", {class:"lede"}, "Qui a accepté de prendre votre place sur cette audience ?"));
  body.appendChild(h("label", {class:"field-label"}, "Remplacé par"));
  var sel = h("select", null,
    [h("option", {value:"", selected:"selected"}, "— Choisir —")].concat(
      candidates.map(function(c, i){ return h("option", {value:String(i)}, memberDisplayName(c)); })
    )
  );
  body.appendChild(sel);

  var sendBtn = h("button", {class:"sheet-btn accent", style:"margin-top:14px", disabled:"disabled", onclick:function(){
    var chosen = candidates[Number(sel.value)];
    if(!chosen) return;
    var tel = (mine.fromTel||"").trim();
    if(!tel){
      toast("Le président de section n’a pas transmis de numéro de téléphone dans ce fichier — contactez-le autrement.");
      return;
    }
    var audienceTxt = planningTypeLabel(e.type)+" du "+planningDateLabel(e.date);
    var msg = "Bonjour, veuillez enregistrer l’échange suivant sur l’audience "+audienceTxt+" : "
      + fullName(state.profile)+" est remplacé par "+memberDisplayName(chosen)+".";
    closeSheet();
    openSmsCompose(tel, msg);
  }}, "Notifier le président");
  sel.addEventListener("change", function(){ sendBtn.disabled = !sel.value; });
  body.appendChild(sendBtn);
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:closeSheet}, "Annuler"));

  openSheet("Notifier un échange", body);
}

renderers["mon-planning"] = function(root){

     se recalcule à chaque affichage depuis le planning de section déjà
     présent localement (state.planning), lui-même tenu à jour par
     maybeAutoPullSection au lancement et par la récupération manuelle
     (voir Réglages > Synchronisation, ou le bouton "Actualiser" plus bas)
     — plus besoin d'attendre un fichier envoyé à la main. Sans
     synchronisation active, le fonctionnement reste inchangé : un fichier
     reçu de la présidence, importé manuellement ci-dessous. */
  var syncActive = !!state.sync.sectionCode;
  var derivedFromSync = syncActive ? syncMyPlanningFromSection() : false;

  if(syncActive && !derivedFromSync){
    root.appendChild(h("p", {class:"lede"}, "Votre planning personnel se calcule automatiquement depuis celui de la section, dès que votre nom et votre prénom sont renseignés."));

    root.appendChild(h("div", {class:"panel"},

  var importedDate = null;

  var whenTxt = importedDate && !isNaN(importedDate) ? importedDate.toLocaleDateString("fr-FR") : "";
  root.appendChild(h("p", {class:"lede"},
    syncActive
      ? "Planning de la section"+(mine.from ? " (président·e : "+mine.from+")" : "")+", actualisé automatiquement — lecture seule ; seule la présidence de section peut le modifier."
      : "Planning reçu"+(mine.from ? " de "+mine.from : "")+(whenTxt ? " le "+whenTxt : "")+" — lecture seule ; seule la présidence de section peut le mettre à jour."
  ));

  var mode = "month";
  var monthVal = monthKey(todayISO());
  var yearVal = monthVal.slice(0,4);

  var modeRow = h("div", {class:"btn-row", style:"margin-bottom:14px"});
  var fieldBox = h("div", null);
  root.appendChild(modeRow);
  root.appendChild(fieldBox);

  var monthBtn = h("button", {class:"sheet-btn small primary", onclick:function(){ mode="month"; updateModeButtons(); updateField(); renderList(); }}, "Un mois");
  var yearBtn = h("button", {class:"sheet-btn small ghost", onclick:function(){ mode="year"; updateModeButtons(); updateField(); renderList(); }}, "Une année entière");
  modeRow.appendChild(monthBtn); modeRow.appendChild(yearBtn);
  function updateModeButtons(){
    monthBtn.className = "sheet-btn small "+(mode==="month" ? "primary" : "ghost");
    yearBtn.className = "sheet-btn small "+(mode==="year" ? "primary" : "ghost");
  }

  var monthInput = null, yearInput = null;
  var listBox = h("div", {style:"margin-top:14px"});
  function updateField(){
    clear(fieldBox);
    if(mode==="month"){
      fieldBox.appendChild(h("label", {class:"field-label"}, "Mois"));
      monthInput = h("input", {type:"month", value: monthVal, onchange:function(){ monthVal = monthInput.value; renderList(); }});
      fieldBox.appendChild(monthInput);
    } else {
      fieldBox.appendChild(h("label", {class:"field-label"}, "Année"));
      yearInput = h("input", {type:"number", value: yearVal, min:"2000", max:"2100", step:"1", inputmode:"numeric", onchange:function(){ yearVal = yearInput.value; renderList(); }});
      fieldBox.appendChild(yearInput);
    }
  }
  function renderList(){
    clear(listBox);
    var entries = mine.entries.filter(function(e){
      return mode==="month" ? monthKey(e.date)===monthVal : e.date.slice(0,4)===String(yearVal);
    }).sort(function(a,b){ return a.date<b.date ? -1 : a.date>b.date ? 1 : 0; });
    var panel = h("div", {class:"panel"});

      panel.appendChild(h("p", {class:"lede", style:"margin:0"}, "Aucune audience vous concernant sur cette période."));

          ),
          icon("ic-chev", "chev")
        ));
      });

    listBox.appendChild(panel);
  }
  updateField();
  root.appendChild(listBox);
  renderList();

  if(syncActive){
    /* Le rechargement automatique au lancement (voir maybeAutoPullSection)
       couvre l'essentiel, mais reste volontairement silencieux ; ce
       bouton offre le même geste explicite qu'en Réglages > Synchronisation
       pour qui veut forcer une actualisation immédiate sans y retourner. */
    root.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:16px", onclick:function(){ confirmAndPullSection("mon-planning"); }}, "Actualiser depuis la section"));

    root.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:16px", onclick:function(){ refreshInput.click(); }}, "Importer une nouvelle version"));
