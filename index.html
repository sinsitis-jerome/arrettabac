       horodatée, sur le relevé de vacations (RITA) généré — voir
       buildVacationsCanvases / printVacations. */
    signature:"",
    /* Identifiant (sectionMembers[].id) de la fiche de l'annuaire
       correspondant à cette personne, posé en choisissant son nom dans une
       liste plutôt qu'en le tapant (voir openPickMyMemberSheet) — rend la
       reconnaissance « c'est moi » (Mes statistiques, Moi-même dans le
       planning) fiable même si le nom tapé ici diverge légèrement de la
       fiche. Vide = pas encore lié ; le rapprochement par nom (voir
       isSelfMemberId) reste alors utilisé en repli. */
    memberId:null
  },
  vacations:[],
  ritaSent:{},
  lastBackupAt:null,
  sectionMembers:[],
  sectionRoles:{
    greffier:{prenom:"", nom:"", email:"", tel:""},
    coPresident:{prenom:"", nom:"", email:"", tel:""}
  },
  /* Voir defaultSectionSettings() (déclarée plus bas, mais les
     déclarations de fonction sont hoistées : disponible dès ici) : liens
     utiles, horaires par défaut et fiches de contact de la section,
     désormais configurés depuis l'espace administrateur et synchronisés
     (jamais modifiables ici localement). */
  sectionSettings: defaultSectionSettings(),
  planning:[],
  /* Vestige de l'ancien parcours guidé « Outil de planification » (partage
     JSON entre président et vice-président, envoi au greffe, diffusion à
     la section), remplacé par un simple téléchargement JPEG du planning
     (voir renderers["planification"] et openPlanningExportSheet) — le
     champ n'est plus lu ni écrit nulle part, conservé uniquement pour ne
     pas casser la lecture d'un ancien état local sauvegardé. */
  planningFlowStep:0,
  /* Planning personnel d'un conseiller « simple » (sans droits de
     présidence) : une copie en lecture seule, filtrée sur ses propres
     audiences, importée depuis un fichier reçu de la présidence de
     section (bouton « Partager avec la section »). Distinct de
     sectionMembers/planning ci-dessus, qui restent réservés aux outils de
     présidence. */
  /* members : trombinoscope complet de la section (les deux collèges),
     transmis avec le fichier de diffusion — sert au bouton « Notifier un
     échange » (voir renderers["mon-planning"]) pour proposer la liste des
     conseillers du même collège que soi, sans avoir à redemander l'accès
     à « Acteurs de ma section » (réservé à la présidence). fromTel : le
     numéro de téléphone de la présidence de section au moment de l'envoi
     (state.profile.tel côté président), destinataire du SMS de
     notification d'échange. */
  myPlanning:{ importedAt:null, from:"", fromTel:"", section:"", cph:"", entries:[], members:[] },
  bj:{ checked:[], startedAt:null },
  bco:{ checked:[], startedAt:null },
  priseFonction:{ checked:[], startedAt:null },
  /* Synchronisation chiffrée entre les acteurs d'une même section (voir
     module SYNC-CRYPTO plus bas) : sectionCode est le jeton partagé.
     lastSyncAt trace la dernière synchronisation réussie (envoi ou
     réception), purement informatif. Vide = synchronisation non activée,
     l'app reste 100% locale comme avant (import/export JSON manuel
     toujours disponible).
     lastSyncedSnapshot (voir markSyncDone) est un instantané JSON de
     l'annuaire+planning TEL QU'ILS ÉTAIENT au moment de cette dernière
     synchronisation — il permet à maybeAutoPullSection (plus bas) de
     savoir si l'appareil a, depuis, des modifications locales pas encore
     envoyées (l'instantané ne correspond alors plus à l'état actuel) : dans
     ce cas SEULEMENT, le chargement automatique au lancement s'abstient
     et retombe sur une simple notification, exactement comme avant,
     plutôt que de risquer d'écraser une saisie locale. null = jamais
     synchronisé sur cet appareil (ou sauvegarde antérieure à ce champ) :
     traité comme "peut-être local et non envoyé", donc prudent par
     défaut, jusqu'à la prochaine synchronisation réussie. */
  sync:{ sectionCode:"", lastSyncAt:null, lastSyncedSnapshot:null },
  /* Codes personnels (4 chiffres) en clair pour les fiches créées ou
     régénérées SUR CET APPAREIL — voir le module CODE PERSONNEL PAR
     CONSEILLER : jamais synchronisé (syncPayloadFromState ne transmet que
     sectionMembers/planning), seul le hachage voyage entre appareils via
     sectionMembers[].pinHash. Clé = id du conseiller, valeur = code en
     clair, uniquement pour que le président puisse le consulter/retransmettre. */
  localMemberPins:{}
};

function migrate(parsed){
  var s = clone(DEFAULT_STATE);
  if(parsed && typeof parsed === "object"){
    if(parsed.theme==="light"||parsed.theme==="dark"||parsed.theme==="system") s.theme=parsed.theme;
    if(parsed.profile && typeof parsed.profile==="object"){
      var p = parsed.profile;
      s.profile.prenom = typeof p.prenom==="string" ? p.prenom : "";
      s.profile.nom = typeof p.nom==="string" ? p.nom : (typeof p.name==="string" ? p.name : "");
      s.profile.tel = typeof p.tel==="string" ? p.tel : "";
      s.profile.college = COLLEGES.indexOf(p.college)!==-1 ? p.college : "";
      s.profile.section = SECTIONS.indexOf(p.section)!==-1 ? p.section : "";
      if(typeof p.cph==="string" && p.cph){
        if(CPH_ALL.indexOf(p.cph)!==-1){ s.profile.cph = p.cph; }
        else { s.profile.cph = CPH_AUTRE; s.profile.cphAutre = p.cph; }
      }
      if(typeof p.cphAutre==="string" && p.cphAutre) s.profile.cphAutre = p.cphAutre;
      s.profile.remunere = p.remunere===true ? true : (p.remunere===false ? false : null);
      s.profile.poste = p.poste===true ? true : (p.poste===false ? false : null);
      var timeRe = /^([01]\d|2[0-3]):(00|30)$/;
      s.profile.horaireDebut = typeof p.horaireDebut==="string" && timeRe.test(p.horaireDebut) ? p.horaireDebut : "";
      s.profile.horaireFin = typeof p.horaireFin==="string" && timeRe.test(p.horaireFin) ? p.horaireFin : "";
      /* sectionRole remplace l'ancien booléen presidentSection (un seul
         rôle possible : aucun / président / vice-président de section).
         Compatibilité ascendante : un profil déjà enregistré avec l'ancien
         booléen est automatiquement reclassé en "president" ou "none". */
      if(["none","president","vice-president"].indexOf(p.sectionRole)!==-1){
        s.profile.sectionRole = p.sectionRole;
      } else if(p.presidentSection===true){
        s.profile.sectionRole = "president";
      } else if(p.presidentSection===false){
        s.profile.sectionRole = "none";
      } else {
        s.profile.sectionRole = null;
      }
      /* Normalisés en booléen (jamais null) dès la relecture depuis le
         stockage local : un profil enregistré avant l'ajout de l'étape
         "Terminer" qui les met à jour (ou qui, pour toute autre raison,
         ne l'a jamais déclenchée) se retrouve ainsi avec des valeurs
         par défaut sûres (false) plutôt que null — voir isProfileComplete,
         dont ces deux champs ne conditionnent plus l'accès à l'accueil,
         précisément pour ne plus jamais bloquer un profil déjà complet
         par ailleurs sur ce détail. */
      s.profile.presidentCph = p.presidentCph===true;
      s.profile.referiste = p.referiste===true;
      s.profile.annuaireUrl = typeof p.annuaireUrl==="string" ? p.annuaireUrl : "";
      s.profile.cphWebUrl = typeof p.cphWebUrl==="string" ? p.cphWebUrl : "";
      s.profile.vacationsEmail = typeof p.vacationsEmail==="string" ? p.vacationsEmail : "";
      s.profile.presidentEmail = typeof p.presidentEmail==="string" ? p.presidentEmail : "";
      /* Ces trois liens sont identiques pour tous les CPH : on préserve la
         valeur enregistrée si elle existe déjà (y compris si le conseiller
         l'a volontairement vidée), sinon on reprend la valeur par défaut
         plutôt qu'une chaîne vide, pour que les liens soient utilisables dès
         l'installation. */
      s.profile.formationEnmUrl = typeof p.formationEnmUrl==="string" ? p.formationEnmUrl : DEFAULT_STATE.profile.formationEnmUrl;
      s.profile.legifranceUrl = typeof p.legifranceUrl==="string" ? p.legifranceUrl : DEFAULT_STATE.profile.legifranceUrl;
      s.profile.ensapUrl = typeof p.ensapUrl==="string" ? p.ensapUrl : DEFAULT_STATE.profile.ensapUrl;
      s.profile.ritaReminders = p.ritaReminders===true;
      s.profile.signature = (typeof p.signature==="string" && /^data:image\/png;base64,/.test(p.signature) && p.signature.length<400000) ? p.signature : "";
      s.profile.memberId = (typeof p.memberId==="string" && p.memberId) ? p.memberId : null;
    }
    if(parsed.ritaSent && typeof parsed.ritaSent==="object"){
      var mKeyRe = /^\d{4}-\d{2}$/;
      Object.keys(parsed.ritaSent).forEach(function(k){
        if(mKeyRe.test(k) && typeof parsed.ritaSent[k]==="string") s.ritaSent[k] = parsed.ritaSent[k];
      });
    }
    s.lastBackupAt = typeof parsed.lastBackupAt==="string" ? parsed.lastBackupAt : null;
    if(Array.isArray(parsed.sectionMembers)){
      s.sectionMembers = parsed.sectionMembers.map(function(m){
        return {
          id: typeof m.id==="string" && m.id ? m.id : uid(),
          nom: typeof m.nom==="string" ? m.nom : "",
          prenom: typeof m.prenom==="string" ? m.prenom : "",
          college: typeof m.college==="string" ? m.college : "",
          syndicat: typeof m.syndicat==="string" ? m.syndicat : "",
          email: typeof m.email==="string" ? m.email : "",
          tel: typeof m.tel==="string" ? m.tel : "",
          pinHash: (typeof m.pinHash==="string" && m.pinHash) ? m.pinHash : null,
          /* Fonction en section (président/vice-président) — voir module
             ADMINISTRATION GÉNÉRALE : désignée exclusivement depuis
             l'espace administrateur, jamais localement (ni par le
             conseiller concerné, ni par le président lui-même en éditant
             une fiche depuis « Acteurs de ma section »). */
          sectionRole: (m.sectionRole==="president" || m.sectionRole==="vice-president") ? m.sectionRole : null
        };
      }).filter(function(m){ return m.nom || m.prenom || m.email || m.tel; });
    }
    if(parsed.sectionRoles && typeof parsed.sectionRoles==="object"){
      ["greffier","coPresident"].forEach(function(key){
        var r = parsed.sectionRoles[key];
        if(r && typeof r==="object"){
          s.sectionRoles[key] = {
            prenom: typeof r.prenom==="string" ? r.prenom : "",
            nom: typeof r.nom==="string" ? r.nom : "",
            email: typeof r.email==="string" ? r.email : "",
            tel: typeof r.tel==="string" ? r.tel : ""
          };
        }
      });
    }
    if(Array.isArray(parsed.planning)){
      var planningTypeIds = PLANNING_TYPES.map(function(t){ return t.id; });
      var dateRe = /^\d{4}-\d{2}-\d{2}$/;
      s.planning = parsed.planning.map(function(pl){
        return {
          id: typeof pl.id==="string" && pl.id ? pl.id : uid(),
          type: planningTypeIds.indexOf(pl.type)!==-1 ? pl.type : "bj",
          date: typeof pl.date==="string" && dateRe.test(pl.date) ? pl.date : "",
          college: COLLEGES.indexOf(pl.college)!==-1 ? pl.college : "",
          presidence: COLLEGES.indexOf(pl.presidence)!==-1 ? pl.presidence : "",
          president: typeof pl.president==="string" && pl.president ? pl.president : null,
          assesseurs: Array.isArray(pl.assesseurs) ? pl.assesseurs.filter(function(a){ return typeof a==="string" && a; }).slice(0,2) : [],
          /* Identifiant d'origine hérité de l'ancien échange JSON entre
             président et vice-président (fonctionnalité retirée — voir
             renderers["planification"]) : conservé tel quel sur les
             entrées existantes pour ne rien perdre, mais plus jamais
             écrit ni interprété nulle part. */
          importSourceId: typeof pl.importSourceId==="string" && pl.importSourceId ? pl.importSourceId : null
        };
      }).filter(function(pl){ return pl.date; });
    }
    s.planningFlowStep = (typeof parsed.planningFlowStep==="number" && parsed.planningFlowStep>=0 && parsed.planningFlowStep<=4) ? Math.floor(parsed.planningFlowStep) : 0;
    if(parsed.myPlanning && typeof parsed.myPlanning==="object"){
      var mp = parsed.myPlanning;
      s.myPlanning.importedAt = typeof mp.importedAt==="string" ? mp.importedAt : null;
      s.myPlanning.from = typeof mp.from==="string" ? mp.from : "";
      s.myPlanning.fromTel = typeof mp.fromTel==="string" ? mp.fromTel : "";
      s.myPlanning.section = typeof mp.section==="string" ? mp.section : "";
      s.myPlanning.cph = typeof mp.cph==="string" ? mp.cph : "";
      var myPlanningTypeIds = PLANNING_TYPES.map(function(t){ return t.id; });
      var myPlanningDateRe = /^\d{4}-\d{2}-\d{2}$/;
      function sanitizeNameObj(o){
        return (o && typeof o==="object") ? { nom: typeof o.nom==="string" ? o.nom : "", prenom: typeof o.prenom==="string" ? o.prenom : "", college: COLLEGES.indexOf(o.college)!==-1 ? o.college : "" } : null;
      }
      s.myPlanning.entries = Array.isArray(mp.entries) ? mp.entries.map(function(e){
        return {
          type: myPlanningTypeIds.indexOf(e.type)!==-1 ? e.type : "bj",
          date: typeof e.date==="string" && myPlanningDateRe.test(e.date) ? e.date : "",
          college: COLLEGES.indexOf(e.college)!==-1 ? e.college : "",
          presidence: COLLEGES.indexOf(e.presidence)!==-1 ? e.presidence : "",
          president: sanitizeNameObj(e.president),
          assesseurs: Array.isArray(e.assesseurs) ? e.assesseurs.map(sanitizeNameObj).filter(Boolean) : [],
          role: e.role==="president" ? "president" : "assesseur"
        };
      }).filter(function(e){ return e.date; }) : [];
      /* Trombinoscope complet transmis avec le fichier — sert au bouton
         « Notifier un échange » (voir renderers["mon-planning"]) ; pas
         d'identifiant, ce n'est qu'un instantané en lecture seule. */
      s.myPlanning.members = Array.isArray(mp.members) ? mp.members.map(function(m){
        return {
          nom: typeof m.nom==="string" ? m.nom : "",
          prenom: typeof m.prenom==="string" ? m.prenom : "",
          college: COLLEGES.indexOf(m.college)!==-1 ? m.college : "",
          syndicat: typeof m.syndicat==="string" ? m.syndicat : "",
          email: typeof m.email==="string" ? m.email : "",
          tel: typeof m.tel==="string" ? m.tel : ""
        };
      }).filter(function(m){ return m.nom || m.prenom; }) : [];
    }
    if(Array.isArray(parsed.vacations)){
      var hmRe = /^([01]\d|2[0-3]):([0-5]\d)$/;
      s.vacations = parsed.vacations.map(function(v){
        return {
          id: v && v.id ? String(v.id) : uid(),
          date: v && v.date ? String(v.date) : todayISO(),
          /* "redaction" (unique) a été scindée en trois natures distinctes ;
             les entrées déjà enregistrées sous l’ancien identifiant sont
             rattachées par défaut à « Rédaction jugement ». « preparation »
             (unique) a été scindée en « Préparation BJ » / « Préparation
             BCO/référé » ; les entrées existantes sont rattachées par défaut
             à « Préparation BJ ». */
          nature: v && v.nature==="redaction" ? "redaction-jugement"
                : v && v.nature==="preparation" ? "preparation-bj"
                : (v && v.nature ? String(v.nature) : "autre"),
          minutes: v && isFinite(v.minutes) ? Number(v.minutes) : 0,
          actStart: v && typeof v.actStart==="string" && hmRe.test(v.actStart) ? v.actStart : "",
          actEnd: v && typeof v.actEnd==="string" && hmRe.test(v.actEnd) ? v.actEnd : "",
          workStart: v && typeof v.workStart==="string" && hmRe.test(v.workStart) ? v.workStart : "",
          workEnd: v && typeof v.workEnd==="string" && hmRe.test(v.workEnd) ? v.workEnd : "",
          noWorkDay: v && v.noWorkDay===true,
          section: v && v.section ? String(v.section) : "",
          rg: v && v.rg ? String(v.rg) : "",
          notes: v && v.notes ? String(v.notes) : "",
          depFrom: v && (v.depFrom==="domicile"||v.depFrom==="entreprise"||v.depFrom==="sans_objet") ? v.depFrom : "",
          depTo: v && (v.depTo==="domicile"||v.depTo==="entreprise"||v.depTo==="sans_objet") ? v.depTo : ""
        };
      });
    }
    if(parsed.bj && typeof parsed.bj==="object"){
      s.bj.checked = Array.isArray(parsed.bj.checked) ? parsed.bj.checked.map(String) : [];
      s.bj.startedAt = parsed.bj.startedAt || null;
    }
    if(parsed.bco && typeof parsed.bco==="object"){
      s.bco.checked = Array.isArray(parsed.bco.checked) ? parsed.bco.checked.map(String) : [];
      s.bco.startedAt = parsed.bco.startedAt || null;
    }
    if(parsed.priseFonction && typeof parsed.priseFonction==="object"){
      s.priseFonction.checked = Array.isArray(parsed.priseFonction.checked) ? parsed.priseFonction.checked.map(String) : [];
      s.priseFonction.startedAt = parsed.priseFonction.startedAt || null;
    }
    if(parsed.sync && typeof parsed.sync==="object"){
      s.sync.sectionCode = typeof parsed.sync.sectionCode==="string" ? parsed.sync.sectionCode : "";
      s.sync.lastSyncAt = typeof parsed.sync.lastSyncAt==="string" ? parsed.sync.lastSyncAt : null;
      s.sync.lastSyncedSnapshot = typeof parsed.sync.lastSyncedSnapshot==="string" ? parsed.sync.lastSyncedSnapshot : null;
    }
    /* Voir defaultSectionSettings()/sanitizeSectionSettings() : reconstruit
       systématiquement la forme complète, jamais modifiée localement par un
       appareil de conseiller — seule une synchronisation la met à jour. */
    s.sectionSettings = sanitizeSectionSettings(parsed.sectionSettings);
    if(parsed.localMemberPins && typeof parsed.localMemberPins==="object"){
      Object.keys(parsed.localMemberPins).forEach(function(k){
        if(typeof parsed.localMemberPins[k]==="string" && /^\d{4}$/.test(parsed.localMemberPins[k])) s.localMemberPins[k] = parsed.localMemberPins[k];
      });
    }
    /* migrate() n'est appelé que lorsqu'un état existait déjà en local
       (voir loadState) : une installation qui date d'avant le parcours
       d'accueil ne doit jamais se voir imposer rétroactivement l'écran
       "Qui êtes-vous ?". On ne respecte un onboarding.done===false explicite
       que si un parcours avait déjà commencé (cas d'un rechargement en
       cours de route, avant d'avoir terminé). */
    if(parsed.onboarding && typeof parsed.onboarding==="object"){
      s.onboarding.done = parsed.onboarding.done===true;
      var onbRoles = ["conseiller","president-section","vice-president-section","president-cph","admin"];
      s.onboarding.role = onbRoles.indexOf(parsed.onboarding.role)!==-1 ? parsed.onboarding.role : null;
    } else {
      s.onboarding.done = true;
    }
  }
  return s;
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return clone(DEFAULT_STATE);
    return migrate(JSON.parse(raw));
  }catch(e){ return clone(DEFAULT_STATE); }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();

/* =================================================================
   SYNCHRONISATION CHIFFRÉE ENTRE ACTEURS D'UNE SECTION (Firebase)
   ---------------------------------------------------------------
   Remplace, pour qui l'active, l'échange manuel de fichiers JSON entre
   président(e), vice-président(e) et conseillers : l'annuaire de la
   section (sectionMembers) et le planning (planning) se synchronisent
   automatiquement via un petit document Firestore partagé, identifié et
   protégé par un unique « code de section ».

   Chiffrement : le contenu (nom, prénom, téléphone, email, syndicat,
   collège de chaque conseiller + toutes les dates de planning) est
   entièrement chiffré (AES-GCM 256) sur l'appareil avant tout envoi. La
   clé est dérivée du code de section lui-même via HKDF-SHA256— un jeton
   de 128 bits, donc pas besoin de PBKDF2 (réservé aux secrets faibles
   choisis par un humain). Firestore ne voit et ne stocke jamais que du
   texte chiffré, plus quelques métadonnées non personnelles (nom du CPH,
   nom de la section, horodatage). Le code sert AUSSI d'identifiant du
   document (voir firestore.rules) : sans le connaître, impossible même
   de localiser le document — Firestore interdit explicitement de lister
   la collection.

   Modèle d'accès retenu (voir échange avec l'utilisateur) : un seul code
   par section, qui donne à la fois lecture et écriture à quiconque le
   détient — pas de compte, pas de mot de passe, pas de Cloud Function
   (donc aucune carte bancaire requise, tout reste sur l'offre gratuite
   Firebase). L'application elle-même réserve les écrans de modification
   au président/vice-président selon le rôle choisi dans les Réglages ;
   Firestore ne fait pas cette distinction plus finement.

   Le pont vers le SDK Firebase (chargé en module ES, voir tout en bas du
   fichier) expose window.__fbFirestore une fois prêt ; en son absence
   (pas encore chargé, ou aucun réseau), toutes les fonctions ci-dessous
   rejettent proprement leur promesse plutôt que de planter — l'app reste
   pleinement utilisable hors-ligne, la synchronisation n'est qu'un
   service en plus. */

var SYNC_SCHEMA_VERSION = 1;
var SYNC_HKDF_INFO = "cph-toolbox-sync-v1";

function syncBytesToBase64Url(bytes){
  var bin = "";
  for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function syncBase64UrlToBytes(str){
  var b64 = str.replace(/-/g,"+").replace(/_/g,"/");
  while(b64.length % 4) b64 += "=";
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

/* Génère un nouveau code de section : 16 octets aléatoires (128 bits),
   encodés en base64url — utilisé par le président lors de la création
   d'un nouvel espace partagé pour sa section. */
function generateSectionCode(){
  var bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return syncBytesToBase64Url(bytes);
}

function deriveSyncKey(sectionCode){
  var codeBytes = syncBase64UrlToBytes(sectionCode);
  return crypto.subtle.importKey("raw", codeBytes, "HKDF", false, ["deriveKey"]).then(function(ikm){
    return crypto.subtle.deriveKey(
      { name:"HKDF", hash:"SHA-256", salt:new Uint8Array(0), info:new TextEncoder().encode(SYNC_HKDF_INFO) },
      ikm,
      { name:"AES-GCM", length:256 },
      false,
      ["encrypt","decrypt"]
    );
  });
}

function encryptSyncPayload(sectionCode, payloadObj){
  return deriveSyncKey(sectionCode).then(function(key){
    var iv = new Uint8Array(12);
    crypto.getRandomValues(iv);
    var plaintext = new TextEncoder().encode(JSON.stringify(payloadObj));
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, plaintext).then(function(cipherBuf){
      return { iv: syncBytesToBase64Url(iv), ciphertext: syncBytesToBase64Url(new Uint8Array(cipherBuf)) };
    });
  });
}

/* Rejette la promesse si le code est incorrect ou si les données ont été
   altérées : AES-GCM est authentifié, toute modification du texte chiffré
   fait échouer le déchiffrement plutôt que de renvoyer des données
   silencieusement fausses. */
function decryptSyncPayload(sectionCode, envelope){
  return deriveSyncKey(sectionCode).then(function(key){
    var iv = syncBase64UrlToBytes(envelope.iv);
    var cipherBytes = syncBase64UrlToBytes(envelope.ciphertext);
    return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, cipherBytes).then(function(plainBuf){
      return JSON.parse(new TextDecoder().decode(plainBuf));
    });
  });
}

/* Paramètres de la section (module ADMINISTRATION GÉNÉRALE — écran
   « Paramètres de la section ») : liens utiles, horaires par défaut des
   audiences et fiches de contact, désormais une vraie donnée DE LA
   SECTION plutôt que propre à chaque appareil — éditée exclusivement
   depuis l'espace administrateur (voir renderers["sysadmin-section-settings"]),
   synchronisée comme l'annuaire et le planning, et affichée en lecture
   seule à tous les conseillers de la section (voir sectionLink() et
   renderers["liens-utiles"]). Un appareil qui n'a encore rien reçu de ce
   type (section pas encore configurée par l'administrateur, ou
   synchronisation jamais activée) garde une valeur vide ici — voir
   sectionLink(), qui retombe alors sur l'ancien réglage local par
   appareil, pour ne rien casser pendant la transition. */
function defaultSectionSettings(){
  return {
    links: { cphWebUrl:"", annuaireUrl:"", formationEnmUrl:"", legifranceUrl:"", ensapUrl:"" },
    defaultTimes: {
      bj: { debut:"", fin:"" },
      bco: { debut:"", fin:"" },
      "bco-mee": { debut:"", fin:"" }
    },
    contacts: {
      greffier: { prenom:"", nom:"", email:"", tel:"" },
      presidentCph: { prenom:"", nom:"", email:"", tel:"" },
      presidentTj: { prenom:"", nom:"", email:"", tel:"" },
      presidentCourAppel: { prenom:"", nom:"", email:"", tel:"" },
      batonnier: { prenom:"", nom:"", email:"", tel:"" },
      directeurGreffe: { prenom:"", nom:"", email:"", tel:"" }
    }
  };
}
/* Normalisation défensive (même esprit que migrate()) : reconstruit
   toujours la forme complète ci-dessus, quelle que soit la fraîcheur ou
   la complétude de ce qui vient d'être reçu (section jamais configurée,
   ancien schéma, document partiellement corrompu…), sans jamais lever
   d'exception ni laisser un champ à `undefined`. */
function sanitizeSectionSettings(raw){
  var out = defaultSectionSettings();
  if(!raw || typeof raw!=="object") return out;
  if(raw.links && typeof raw.links==="object"){
    Object.keys(out.links).forEach(function(k){
      if(typeof raw.links[k]==="string") out.links[k] = raw.links[k];
    });
  }
  if(raw.defaultTimes && typeof raw.defaultTimes==="object"){
    var timeRe = /^([01]\d|2[0-3]):(00|30)$/;
    Object.keys(out.defaultTimes).forEach(function(typeId){
      var t = raw.defaultTimes[typeId];
      if(t && typeof t==="object"){
        out.defaultTimes[typeId].debut = (typeof t.debut==="string" && timeRe.test(t.debut)) ? t.debut : "";
        out.defaultTimes[typeId].fin = (typeof t.fin==="string" && timeRe.test(t.fin)) ? t.fin : "";
      }
    });
  }
  if(raw.contacts && typeof raw.contacts==="object"){
    Object.keys(out.contacts).forEach(function(k){
      var c = raw.contacts[k];
      if(c && typeof c==="object"){
        out.contacts[k] = {
          prenom: typeof c.prenom==="string" ? c.prenom : "",
          nom: typeof c.nom==="string" ? c.nom : "",
          email: typeof c.email==="string" ? c.email : "",
          tel: typeof c.tel==="string" ? c.tel : ""
        };
      }
    });
  }
  return out;
}
/* Ce que la synchronisation transmet : l'annuaire des conseillers, le
   planning et les paramètres de section. Les autres données (vacations
   personnelles, réglages propres à l'appareil, etc.) restent strictement
   locales. sectionSettings n'est en pratique jamais modifié localement
   par un appareil de conseiller (lecture seule, voir plus haut) : le
   reporter tel quel dans son propre envoi (« Envoyer mes modifications »,
   côté président/vice-président) ne fait donc que réémettre la dernière
   valeur reçue, sans jamais risquer d'écraser une modification de
   l'administrateur avec une copie appauvrie — un envoi ne pouvant de toute
   façon contenir qu'un instantané complet du document (voir
   pushSectionSyncPayload, aucune fusion champ-par-champ possible sur un
   contenu chiffré en bloc). */
function syncPayloadFromState(){
  return { sectionMembers: state.sectionMembers, planning: state.planning, sectionSettings: state.sectionSettings };
}
function applySyncPayloadToState(payload){
  state.sectionMembers = (payload && Array.isArray(payload.sectionMembers)) ? payload.sectionMembers : [];
  state.planning = (payload && Array.isArray(payload.planning)) ? payload.planning : [];
  state.sectionSettings = sanitizeSectionSettings(payload && payload.sectionSettings);
}
/* Valeur effective d'un lien utile : priorité à la donnée de section
   (configurée par l'administrateur, identique pour tous), repli sur
   l'ancien réglage local à cet appareil (préréglages par CPH ou saisie
   d'avant cette fonctionnalité) tant que la section n'a pas encore été
   configurée ou n'a jamais été synchronisée — voir defaultSectionSettings
   ci-dessus. */
function sectionLink(key){
  return (state.sectionSettings && state.sectionSettings.links && state.sectionSettings.links[key]) || state.profile[key] || "";
}

function syncAvailable(){ return !!(window.__fbFirestore); }

/* Récupère et déchiffre le document de la section — résout `null` si
   aucun document n'existe encore pour ce code (première utilisation). */
function pullSectionSync(sectionCode){
  if(!syncAvailable()) return Promise.reject(new Error("sync-unavailable"));
  return window.__fbFirestore.getSectionDoc(sectionCode).then(function(doc){
    if(!doc) return null;
    return decryptSyncPayload(sectionCode, {iv:doc.iv, ciphertext:doc.ciphertext}).then(function(payload){
      return { cph: doc.cph||"", section: doc.section||"", payload: payload };
    });
  });
}

/* Chiffre puis envoie l'état courant (conseillers + planning) vers le
   document de la section, en écrasant son contenu précédent. */
/* Variante paramétrée par les données à envoyer plutôt que de toujours lire
   syncPayloadFromState() : réutilisée par l'espace administrateur (voir
   module ADMINISTRATION GÉNÉRALE plus bas) pour envoyer les modifications
   apportées à la section d'UN AUTRE appareil, sans jamais toucher à
   l'état local (state) de l'appareil administrateur lui-même. */
function pushSectionSyncPayload(sectionCode, cph, sectionName, payloadObj){
  if(!syncAvailable()) return Promise.reject(new Error("sync-unavailable"));
  return encryptSyncPayload(sectionCode, payloadObj).then(function(envelope){
    return window.__fbFirestore.setSectionDoc(sectionCode, {
      cph: cph||"", section: sectionName||"", schemaVersion: SYNC_SCHEMA_VERSION,
      iv: envelope.iv, ciphertext: envelope.ciphertext
    });
  });
}
function pushSectionSync(sectionCode, cph, sectionName){
  return pushSectionSyncPayload(sectionCode, cph, sectionName, syncPayloadFromState());
}

/* Appelée après CHAQUE synchronisation réussie, envoi comme réception
   (voir tous les appels ci-dessous et dans le module ADMINISTRATION
   GÉNÉRALE) : capture au passage un instantané de l'annuaire+planning
   TELS QU'ILS VIENNENT d'être synchronisés (lastSyncedSnapshot) — c'est
   ce qui permet à maybeAutoPullSection, plus bas, de distinguer un
   appareil "propre" (rien de local à perdre) d'un appareil avec des
   modifications non envoyées. */
function markSyncDone(){
  state.sync.lastSyncAt = new Date().toISOString();
  state.sync.lastSyncedSnapshot = JSON.stringify(syncPayloadFromState());
  saveState();
}

/* Chargement automatique et silencieux du planning de section à
   l'arrivée sur l'application (voir échange avec l'utilisateur : « il
   doit y avoir un chargement des données depuis firebase... pour qu'il
   puisse afficher son dernier planning s'il le souhaite »).

   Pendant longtemps, ce point d'entrée se contentait d'une simple
   VÉRIFICATION de métadonnées (aucune donnée rapatriée), par crainte
   qu'un pull automatique n'écrase silencieusement une modification
   locale pas encore envoyée (par ex. une audience ajoutée hors ligne par
   la présidence). Plutôt que d'abandonner cette garantie, le chargement
   automatique ci-dessous ne s'applique QUE quand on peut prouver qu'il
   n'y a rien à perdre : state.sync.lastSyncedSnapshot (voir markSyncDone)
   est un instantané de l'annuaire+planning tel qu'ils étaient lors de la
   dernière synchronisation réussie — si l'état local actuel lui est
   encore rigoureusement identique, aucune modification locale n'a eu
   lieu depuis, et récupérer + appliquer la dernière version distante ne
   risque donc rien. Dans le cas contraire (ou si on ne peut pas encore le
   prouver : lastSyncedSnapshot vaut null, par exemple juste après une
   mise à jour de l'application qui introduit ce champ), on retombe
   exactement sur l'ancien comportement : une simple notification,
   jamais un écrasement silencieux — un vrai merge champ-par-champ des
   modifications concurrentes serait plus ambitieux mais bien plus risqué
   à construire correctement pour un gain incertain.

   Ne se déclenche qu'une fois par session (autoPullAttempted), pour ne
   jamais multiplier les allers-retours Firestore à chaque écran affiché
   — appelé à la fois sur l'événement fb-sync-ready (cas normal :
   ouverture de l'application, déjà synchronisée) et juste après
   completeOnboarding (cas d'un tout premier lancement, où
   sync.sectionCode ne devient vrai qu'au terme du parcours d'accueil,
   potentiellement après que fb-sync-ready ait déjà été ignoré une
   première fois faute de code de section à ce moment-là). */
var autoPullAttempted = false;
function checkRemoteFreshnessOnly(){
  window.__fbFirestore.getSectionMeta(state.sync.sectionCode).then(function(meta){
    if(!meta || !meta.updatedAt) return;
    var remoteTime = new Date(meta.updatedAt).getTime();
    var localTime = state.sync.lastSyncAt ? new Date(state.sync.lastSyncAt).getTime() : 0;
    if(remoteTime > localTime + 2000){ // marge de 2s pour l'horloge serveur
      toast("Une mise à jour de la section est disponible — Réglages > Synchronisation pour la récupérer.");
    }
  }).catch(function(err){
    if(window.console && console.warn) console.warn("Vérification de synchronisation impossible :", err);
  });
}
/* Instantané des SEULES audiences où l'utilisateur apparaît (président ou
   assesseur), avec leur id réel — contrairement à state.myPlanning (fusionné
   par nom, sans id), on garde ici de quoi comparer proprement un « avant »
   et un « après » du même appareil (voir notifyMyPlanningChanges). */
function myInvolvedPlanningSnapshot(planningList){
  return (planningList||[]).filter(function(p){
    return isSelfMemberId(p.president) || (p.assesseurs||[]).some(isSelfMemberId);
  }).map(function(p){
    return { id:p.id, type:p.type, date:p.date, role: isSelfMemberId(p.president) ? "president" : "assesseur" };
  });
}

/* Notification (au sens large : demande de l'utilisateur — voir échange —
   « une notification à l'ouverture de l'appli » ; pas une vraie notification
   système, voir la discussion sur les notifications push, mise de côté pour
   l'instant faute de pouvoir s'en passer d'un serveur) des audiences
   AJOUTÉES, SUPPRIMÉES ou MODIFIÉES (date/type/rôle) qui concernent
   personnellement l'utilisateur, entre l'état laissé par la session
   précédente (before, capturé juste avant d'appliquer le pull silencieux
   dans maybeAutoPullSection) et l'état qui vient d'être récupéré (after).
   Comparaison par id (stable d'un appareil à l'autre via Firestore),
   jamais par date+type seuls (une date modifiée doit se voir comme une
   modification, pas comme une suppression + un ajout sans lien). Reste
   silencieuse si rien ne concerne l'utilisateur, même si d'autres audiences
   de la section ont changé par ailleurs. */
function notifyMyPlanningChanges(before, after){
  var beforeById = {}; before.forEach(function(e){ beforeById[e.id] = e; });
  var afterById = {}; after.forEach(function(e){ afterById[e.id] = e; });
  var added = after.filter(function(e){ return !beforeById[e.id]; });
  var removed = before.filter(function(e){ return !afterById[e.id]; });
  var modified = after.filter(function(e){
    var b = beforeById[e.id];
    return b && (b.date!==e.date || b.type!==e.type || b.role!==e.role);
  });
  if(!added.length && !removed.length && !modified.length) return;

  function itemLabel(e){ return planningTypeLabel(e.type)+" du "+planningDateLabel(e.date); }
  function group(title, items, prefix){
    if(!items.length) return null;
    var box = h("div", {style:"margin-bottom:12px"});
    box.appendChild(h("div", {class:"section-title", style:"font-size:.92rem; margin-top:0;"}, title));
    items.forEach(function(e){ box.appendChild(h("p", {class:"lede", style:"margin:4px 0"}, prefix(e))); });
    return box;
  }

  var body = h("div", null);
  var addedBox = group(added.length>1 ? "Audiences ajoutées" : "Audience ajoutée", added, function(e){ return "+ "+itemLabel(e); });
  var removedBox = group(removed.length>1 ? "Audiences supprimées" : "Audience supprimée", removed, function(e){ return "– "+itemLabel(e); });
  var modifiedBox = group(modified.length>1 ? "Audiences modifiées" : "Audience modifiée", modified, function(e){ return itemLabel(beforeById[e.id])+" → "+itemLabel(e); });
  [addedBox, removedBox, modifiedBox].forEach(function(box){ if(box) body.appendChild(box); });
  body.appendChild(h("button", {class:"sheet-btn primary", style:"margin-top:6px", onclick:function(){ closeSheet(); go("mon-planning"); }}, "Voir mon planning"));
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:closeSheet}, "Fermer"));

  /* Une fenêtre qui s'ouvre toute seule dès l'arrivée sur l'accueil reste
     acceptable ; l'imposer alors que l'utilisateur est déjà engagé ailleurs
     dans l'application (un formulaire en cours, par exemple) serait
     intrusif — un simple toast suffit dans ce cas, moins précis mais non
     bloquant. */
  if(navStack[navStack.length-1]==="home"){
    openSheet("Votre planning a changé", body);
  } else {
    var parts = [];
    if(added.length) parts.push(added.length+" ajoutée"+(added.length>1?"s":""));
    if(removed.length) parts.push(removed.length+" supprimée"+(removed.length>1?"s":""));
    if(modified.length) parts.push(modified.length+" modifiée"+(modified.length>1?"s":""));
    toast("Votre planning a changé : "+parts.join(", ")+".");
  }
}

function maybeAutoPullSection(){
  if(autoPullAttempted) return;
  if(!state.sync.sectionCode || !syncAvailable()) return;
  autoPullAttempted = true;
  var localSnapshot = JSON.stringify(syncPayloadFromState());
  var isDirty = state.sync.lastSyncedSnapshot===null || state.sync.lastSyncedSnapshot!==localSnapshot;
  if(isDirty){ checkRemoteFreshnessOnly(); return; }
  pullSectionSync(state.sync.sectionCode).then(function(result){
    if(!result) return;
    var remoteSnapshot = JSON.stringify(result.payload);
    if(remoteSnapshot===localSnapshot) return; // déjà à jour, rien à faire
    var myBefore = myInvolvedPlanningSnapshot(state.planning);
    applySyncPayloadToState(result.payload);
    markSyncDone();
    notifyMyPlanningChanges(myBefore, myInvolvedPlanningSnapshot(state.planning));
    var current = navStack[navStack.length-1];
    if(["home","planification","mon-planning","section-membres"].indexOf(current)!==-1){
      render(current);
    }
  }).catch(function(err){
    if(window.console && console.warn) console.warn("Chargement automatique du planning impossible :", err);
  });
}
window.addEventListener("fb-sync-ready", maybeAutoPullSection);

/* =================================================================
   ADMINISTRATION GÉNÉRALE (rôle "Administrateur")
   ------------------------------------------------------------------
   Un unique code à 8 chiffres protège l'accès à un espace qui permet de
   consulter et modifier l'annuaire et le planning de N'IMPORTE QUELLE
   section, sur n'importe quel CPH — réservé en pratique à un usage
   personnel, depuis un seul appareil, pour répondre aux demandes des
   utilisateurs (voir échange avec l'utilisateur). Les vacations restent
   strictement locales à chaque conseiller et ne sont JAMAIS accessibles
   depuis cet espace, quel que soit le rôle.

   Le code n'est jamais stocké ni transmis en clair : seule son empreinte
   SHA-256 est comparée (même principe que le code personnel à 4 chiffres
   des conseillers, voir plus haut) — un hachage à sens unique, et non un
   chiffrement réversible, puisqu'une clé de déchiffrement embarquée dans
   le code source public de l'application serait de toute façon lisible
   par quiconque consulte ce code (l'application est un site statique,
   sans aucune authentification serveur : rien de ce qui est écrit dans
   ce fichier n'est réellement secret). L'empreinte de référence est
   stockée dans un petit document Firestore (admin/config), modifiable
   depuis l'espace administrateur lui-même (« Sécurité » > « Modifier le
   code administrateur ») ; à défaut — hors-ligne, ou avant toute
   modification — l'empreinte du code d'origine (30031990) sert de repli,
   codée en dur ci-dessous (ADMIN_CODE_BOOTSTRAP_HASH).

   Une fois vérifié, le code reste UNIQUEMENT en mémoire vive
   (adminSessionCode) — jamais dans state, donc jamais dans localStorage
   ni dans une sauvegarde JSON exportée. Il est oublié à la fermeture de
   l'application ou au rechargement de la page.

   Pour permettre à l'administrateur de retrouver « n'importe quel CPH,
   n'importe quelle section » sans que Firestore n'autorise à parcourir
   les sections existantes (voir firestore.rules : allow list: if false,
   un choix de confidentialité assumé pour tous les acteurs de l'app), un
   petit "registre" (collection registry, identifiants déterministes
   CPH+section) associe chaque section à une copie de son code, ELLE-MÊME
   chiffrée avec une clé dérivée du code administrateur — de sorte que
   Firestore ne révèle jamais un code de section en clair, même à qui
   parcourrait un par un tous les documents du registre (leurs identifiants
   sont déterministes, donc devinables, contrairement au code d'une
   section elle-même). Ce registre n'est alimenté que depuis l'espace
   administrateur (jamais depuis l'appareil d'un président ou d'un
   conseiller, qui ne connaissent pas le code administrateur) : la
   première fois qu'une section est consultée depuis l'administration,
   son code — transmis à l'administrateur par le président, comme
   n'importe quel autre acteur de la section — est saisi une fois puis
   indexé ; les fois suivantes, un simple choix CPH + section suffit.

   Limite assumée, à annoncer clairement : si le code administrateur est
   changé, les sections déjà indexées avec l'ancien code deviennent
   introuvables par CPH+section (leur entrée de registre reste chiffrée
   avec l'ancienne clé) — il suffit de les réindexer une fois avec leur
   code pour les retrouver de nouveau. */

var ADMIN_CODE_BOOTSTRAP_HASH = "4548d2ae520b4471017ae5401053b438228ad779b46131c14dd528ab8f161207"; // sha256("admin-code|30031990")
var ADMIN_HKDF_INFO = "cph-toolbox-admin-registry-v1";
var adminSessionCode = null; // en mémoire vive uniquement — jamais persisté
var adminBuffer = null; // section actuellement ouverte dans l'espace administrateur
/* Codes personnels en clair générés PENDANT la session administrateur en
   cours (création manuelle, création de section, import JSON), indexés par
   id de fiche — jamais synchronisés (comme state.localMemberPins côté
   président), et jamais persistés au-delà de cette session : seule leur
   empreinte (member.pinHash) est envoyée à Firestore. Permet à
   l'administrateur de voir et copier un code juste après l'avoir généré,
   sans avoir à le régénérer aussitôt pour le consulter (voir
   openAdminMemberForm). */
var adminMemberPins = {};

function hashAdminCode(code){
  var data = new TextEncoder().encode("admin-code|"+code);
  return crypto.subtle.digest("SHA-256", data).then(function(buf){
    var bytes = new Uint8Array(buf), hex = "";
    for(var i=0;i<bytes.length;i++) hex += bytes[i].toString(16).padStart(2,"0");
    return hex;
  });
}
function fetchAdminCodeHash(){
  if(!syncAvailable()) return Promise.resolve(ADMIN_CODE_BOOTSTRAP_HASH);
  return window.__fbFirestore.getAdminConfig().then(function(cfg){
    return (cfg && cfg.codeHash) ? cfg.codeHash : ADMIN_CODE_BOOTSTRAP_HASH;
  }).catch(function(){ return ADMIN_CODE_BOOTSTRAP_HASH; });
}
function verifyAdminCode(code){
  return Promise.all([hashAdminCode(code), fetchAdminCodeHash()]).then(function(results){
    return results[0]===results[1];
  });
}
function changeAdminCode(newCode){
  if(!syncAvailable()) return Promise.reject(new Error("sync-unavailable"));
  return hashAdminCode(newCode).then(function(hash){
    return window.__fbFirestore.setAdminConfig({codeHash:hash}).then(function(){
      adminSessionCode = newCode;
    });
  });
}

function deriveAdminKey(adminCode){
  var keyBytes = new TextEncoder().encode(adminCode);
  return crypto.subtle.importKey("raw", keyBytes, "HKDF", false, ["deriveKey"]).then(function(ikm){
    return crypto.subtle.deriveKey(
      {name:"HKDF", hash:"SHA-256", salt:new Uint8Array(0), info:new TextEncoder().encode(ADMIN_HKDF_INFO)},
      ikm, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
    );
  });
}
/* Identifiant déterministe (donc devinable — voir plus haut pourquoi ce
   n'est pas un problème) associé à un couple CPH + section, pour
   retrouver un document du registre sans jamais avoir besoin de lister
   la collection. */
function slugifyForRegistry(str){
  return (str||"").toString().normalize("NFD").replace(/\p{Diacritic}/gu,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "x";
}
function registryIdFor(cph, section){
  return slugifyForRegistry(cph)+"__"+slugifyForRegistry(section);
}
function registerSectionInAdminRegistry(adminCode, cph, section, sectionCode){
  if(!syncAvailable()) return Promise.reject(new Error("sync-unavailable"));
  return deriveAdminKey(adminCode).then(function(key){
    var iv = new Uint8Array(12);
    crypto.getRandomValues(iv);
    var plaintext = new TextEncoder().encode(sectionCode);
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, plaintext).then(function(cipherBuf){
      return window.__fbFirestore.setRegistryDoc(registryIdFor(cph, section), {
        cph: cph||"", section: section||"",
        iv: syncBytesToBase64Url(iv), ciphertext: syncBytesToBase64Url(new Uint8Array(cipherBuf))
      });
    });
  });
}
/* Résout `null` si la section n'est pas encore indexée — ou si elle l'a
   été avec un code administrateur différent de l'actuel (déchiffrement
   authentifié AES-GCM : échoue proprement plutôt que de renvoyer un
   code de section corrompu). */
function lookupAdminRegistry(adminCode, cph, section){
  if(!syncAvailable()) return Promise.reject(new Error("sync-unavailable"));
  return window.__fbFirestore.getRegistryDoc(registryIdFor(cph, section)).then(function(doc){
    if(!doc) return null;
    return deriveAdminKey(adminCode).then(function(key){
      var iv = syncBase64UrlToBytes(doc.iv);
      var cipherBytes = syncBase64UrlToBytes(doc.ciphertext);
      return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, cipherBytes).then(function(plainBuf){
        return new TextDecoder().decode(plainBuf);
      }).catch(function(){ return null; });
    });
  });
}

/* --- Codes personnels retrouvables sans régénération (demande explicite
   de l'utilisateur) ---
   Un petit coffre par section (collection adminPins, même identifiant
   déterministe CPH+section que le registre ci-dessus) garde les codes
   personnels EN CLAIR que l'administrateur a lui-même déjà générés ou vus
   (création d'une fiche, régénération, import JSON), chiffrés avec la même
   clé dérivée du CODE ADMINISTRATEUR — jamais du code de section. C'est ce
   choix de clé qui fait toute la différence de sécurité avec le reste des
   données de la section (annuaire, planning) : eux sont chiffrés avec une
   clé dérivée du code de SECTION, donc lisibles par quiconque détient ce
   code — n'importe quel conseiller. Si les codes personnels en clair
   étaient stockés de la même façon, n'importe quel conseiller synchronisé
   pourrait déchiffrer le code personnel de n'importe quel autre — ce qui
   viderait de son sens la protection contre l'usurpation d'identité que
   ces codes offrent justement aux conseillers (voir plus haut, Protection
   contre l'usurpation d'identité). En chiffrant plutôt avec le code
   ADMINISTRATEUR, seul celui-ci peut les relire, jamais un simple
   conseiller ni même le président ou la vice-présidente de la section.

   Limite assumée, à annoncer clairement : un code personnel généré
   directement sur l'appareil d'un président ou d'une vice-présidente (via
   « Acteurs de ma section », jamais transmis à l'espace administrateur)
   reste par construction invisible ici — il n'a jamais transité par
   l'espace administrateur, exactement comme aujourd'hui pour tout le
   reste de ces codes (voir CODE PERSONNEL PAR CONSEILLER plus haut). Ce
   coffre ne retrouve que ce que l'administrateur a lui-même déjà généré
   ou vu, désormais y compris d'une session à l'autre. */
function encryptAdminPinsBlob(adminCode, pinsObj){
  return deriveAdminKey(adminCode).then(function(key){
    var iv = new Uint8Array(12);
    crypto.getRandomValues(iv);
    var plaintext = new TextEncoder().encode(JSON.stringify(pinsObj || {}));
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, plaintext).then(function(cipherBuf){
      return { iv: syncBytesToBase64Url(iv), ciphertext: syncBytesToBase64Url(new Uint8Array(cipherBuf)) };
    });
  });
}
function decryptAdminPinsBlob(adminCode, doc){
  if(!doc) return Promise.resolve({});
  return deriveAdminKey(adminCode).then(function(key){
    var iv = syncBase64UrlToBytes(doc.iv);
    var cipherBytes = syncBase64UrlToBytes(doc.ciphertext);
    return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, cipherBytes).then(function(plainBuf){
      try{ return JSON.parse(new TextDecoder().decode(plainBuf)) || {}; }catch(e){ return {}; }
    });
  }).catch(function(){ return {}; });
}
/* Fusionne `updates` (id de fiche -> code en clair) dans le coffre déjà
   stocké pour cette section puis le renvoie sur Firestore. Best-effort et
   volontairement silencieux en cas d'échec (hors ligne, etc.) : la
   visibilité d'un code sans le régénérer est un confort, jamais une
   condition de fonctionnement — le code reste de toute façon affiché tout
   de suite après sa génération, comme avant cette fonctionnalité. */
/* Le pont Firebase (window.__fbFirestore) est fourni par un script module
   séparé (voir plus bas) et peut, hors conditions réelles, être remplacé
   par une simulation qui n'implémente pas encore ces deux méthodes toutes
   récentes — d'où la vérification explicite ci-dessous plutôt qu'un
   simple syncAvailable() : cette fonctionnalité reste un confort en plus,
   jamais une condition de fonctionnement du reste de l'espace
   administrateur (voir plus haut). */
function adminPinsBridgeAvailable(){
  return !!(window.__fbFirestore
    && typeof window.__fbFirestore.getAdminPinsDoc==="function"
    && typeof window.__fbFirestore.setAdminPinsDoc==="function");
}
function persistAdminPins(cph, section, updates){
  if(!adminPinsBridgeAvailable() || !adminSessionCode || !updates || !Object.keys(updates).length) return Promise.resolve();
  try{
    var registryId = registryIdFor(cph, section);
    return window.__fbFirestore.getAdminPinsDoc(registryId).then(function(doc){
      return decryptAdminPinsBlob(adminSessionCode, doc);
    }).then(function(existing){
      return encryptAdminPinsBlob(adminSessionCode, Object.assign({}, existing, updates));
    }).then(function(payload){
      return window.__fbFirestore.setAdminPinsDoc(registryId, payload);
    }).catch(function(){ /* best-effort, voir ci-dessus */ });
  }catch(e){ return Promise.resolve(); }
}
/* Recharge le coffre d'une section dans adminMemberPins (sans écraser un
   code déjà en mémoire pour la session en cours, par prudence — voir
   openAdminSection). Best-effort, même logique que persistAdminPins. */
function loadPersistedAdminPins(cph, section){
  if(!adminPinsBridgeAvailable() || !adminSessionCode) return Promise.resolve();
  try{
    var registryId = registryIdFor(cph, section);
    return window.__fbFirestore.getAdminPinsDoc(registryId).then(function(doc){
      return decryptAdminPinsBlob(adminSessionCode, doc);
    }).then(function(pins){
      Object.keys(pins || {}).forEach(function(id){
        if(!(id in adminMemberPins)) adminMemberPins[id] = pins[id];
      });
    }).catch(function(){});
  }catch(e){ return Promise.resolve(); }
}

/* --- Sheets et écrans de l'espace administrateur --- */

function openAdminCodeGateSheet(onVerified){
  var codeIn = h("input", {type:"password", inputmode:"numeric", pattern:"[0-9]*", maxlength:"8",
    placeholder:"8 chiffres", style:"font-family:var(--font-mono); letter-spacing:3px; text-align:center"});
  var btn;
  openSheet("Code administrateur", h("div", null,
    h("p", {class:"lede"}, "Cette zone donne un accès complet — annuaire, liens et planning — à n'importe quelle section, sur n'importe quel CPH. Réservée à l'administrateur de l'application."),
    codeIn,
    btn = h("button", {class:"sheet-btn accent", style:"margin-top:14px", onclick:function(){
      var code = codeIn.value.trim();
      if(!/^\d{8}$/.test(code)){ toast("Le code comporte 8 chiffres."); return; }
      btn.disabled = true;
      verifyAdminCode(code).then(function(ok){
        btn.disabled = false;
        if(!ok){ toast("Code incorrect."); return; }
        adminSessionCode = code;
        closeSheet();
        onVerified();
      }).catch(function(){
        btn.disabled = false;
        toast("Vérification impossible pour le moment (vérifiez votre connexion).");
      });
    }}, "Valider"),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
  ));
}

/* Point d'entrée unique vers l'espace administrateur (demande explicite de
   l'utilisateur : « pouvoir afficher les écrans de l'admin sans délogger »)
   — utilisé à la fois par le bouton de Réglages et par le raccourci sur
   l'écran d'accueil ci-dessous. Ne redemande le code à 8 chiffres que si
   la session en cours ne l'a pas déjà (adminSessionCode reste en mémoire
   vive tant que l'onglet n'est ni rechargé ni fermé — voir le module
   ADMINISTRATION GÉNÉRALE) : aller-retour libre entre son propre profil et
   l'espace administrateur, sans jamais toucher à state (profil, section,
   synchronisation) qui reste entièrement intact pendant ce temps — les
   deux coexistent simplement dans la même page, sur des données séparées
   (adminBuffer). Redemande le code normalement après « Quitter l'espace
   administrateur », ou après un rechargement de page (choix de sécurité
   assumé : ce code n'est jamais persisté). */
function openAdminEntryPoint(){
  if(adminSessionCode){ go("sysadmin-panel"); return; }
  openAdminCodeGateSheet(function(){ go("sysadmin-panel"); });
}

function openChangeAdminCodeSheet(){
  var codeIn = h("input", {type:"password", inputmode:"numeric", pattern:"[0-9]*", maxlength:"8",
    placeholder:"Nouveau code (8 chiffres)", style:"font-family:var(--font-mono); letter-spacing:3px; text-align:center"});
  var confirmIn = h("input", {type:"password", inputmode:"numeric", pattern:"[0-9]*", maxlength:"8",
    placeholder:"Confirmez le nouveau code", style:"font-family:var(--font-mono); letter-spacing:3px; text-align:center; margin-top:8px"});
  openSheet("Modifier le code administrateur", h("div", null,
    h("p", {class:"lede"}, "Le nouveau code s'applique immédiatement, y compris depuis un autre appareil. Les sections déjà indexées avec l'ancien code ne seront retrouvables par CPH + section qu'après avoir été réindexées avec leur code."),
    codeIn, confirmIn,
    h("button", {class:"sheet-btn accent", style:"margin-top:14px", onclick:function(){
      var code = codeIn.value.trim();
      if(!/^\d{8}$/.test(code)){ toast("Le code comporte 8 chiffres."); return; }
      if(code!==confirmIn.value.trim()){ toast("Les deux codes ne correspondent pas."); return; }
      changeAdminCode(code).then(function(){
        closeSheet();
        toast("Code administrateur modifié.");
      }).catch(function(){ toast("Impossible de modifier le code pour le moment (connexion ?)."); });
    }}, "Valider le nouveau code"),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
  ));
}

/* Crée un nouvel espace de zéro, réservé au cas où le président ne peut
   pas le faire lui-même (voir échange avec l'utilisateur). Contrairement
   à une création par le président (qui utilise son propre annuaire local
   comme point de départ — voir pushSectionSync/syncPayloadFromState),
   l'administrateur part d'un annuaire vide : il DOIT donc au minimum
   renseigner la fiche du président, faute de quoi celui-ci ne pourrait
   pas se retrouver dans la liste au moment de rejoindre avec le code
   (voir openPickMyMemberSheet, le même choix de fiche que pour un
   conseiller — renderers.onboarding utilise désormais un parcours unique
   pour les trois rôles). Cette fiche est automatiquement étiquetée
   sectionRole:"president", puisque c'est tout l'objet de cet écran.
   Le code généré doit ensuite être transmis au président par
   l'administrateur, hors de l'application — comme n'importe quel autre
   code de section. */
function openAdminCreateSectionSheet(cph, section){
  var prenomIn = h("input", {type:"text", autocapitalize:"words"});
  bindPrenomCasing(prenomIn);
  var nomIn = h("input", {type:"text", autocapitalize:"words"});
  bindNomCasing(nomIn);
  var collegeSel = h("select", null,
    h("option", {value:"", selected:"selected"}, "— Non précisé —"),
    COLLEGES.map(function(c){ return h("option", {value:c}, c); }));
  var syndField = createSyndicatField(function(){ return collegeSel.value; }, "");
  collegeSel.addEventListener("change", syndField.rebuild);
  var emailIn = h("input", {type:"email", autocapitalize:"none", autocomplete:"email"});
  var telIn = h("input", {type:"tel", autocomplete:"tel"});
  bindTelFormatting(telIn);

  var actionBtn;
  openSheet("Créer la section", h("div", null,
    h("p", {class:"lede"}, "Cette section n'existe pas encore. Renseignez au moins la fiche du président ou de la présidente — ce sera la première fiche de l'annuaire, celle qu'il ou elle retrouvera en rejoignant avec le code généré à l'étape suivante."),
    h("label", {class:"field-label"}, "Prénom"), prenomIn,
    h("label", {class:"field-label"}, "Nom"), nomIn,
    h("label", {class:"field-label"}, "Collège"), collegeSel,
    h("label", {class:"field-label"}, "Syndicat"), syndField.select, syndField.autreInput,
    h("label", {class:"field-label"}, "Email"), emailIn,
    h("label", {class:"field-label"}, "Téléphone"), telIn,
    actionBtn = h("button", {class:"sheet-btn accent", style:"margin-top:16px", onclick:function(){
      var nom = nomIn.value.trim(), prenom = prenomIn.value.trim();
      if(!nom && !prenom){ toast("Renseignez au moins le nom ou le prénom du président."); return; }
      actionBtn.disabled = true;
      var entry = {
        id:uid(), nom:nom, prenom:prenom, college:collegeSel.value||"",
        syndicat:syndField.getValue()||"", email:emailIn.value.trim(), tel:telIn.value.trim(), pinHash:null,
        sectionRole:"president"
      };
      var pin = generateMemberPin();
      hashMemberPin(pin, entry.id).then(function(hash){
        entry.pinHash = hash;
        adminMemberPins[entry.id] = pin;
        var code = generateSectionCode();
        return pushSectionSyncPayload(code, cph, section, {sectionMembers:[entry], planning:[]}).then(function(){
          return registerSectionInAdminRegistry(adminSessionCode, cph, section, code);
        }).then(function(){
          var pinUpdate = {}; pinUpdate[entry.id] = pin;
          persistAdminPins(cph, section, pinUpdate);
          openAdminSectionCreatedSheet(cph, section, code, pin);
        });
      }).catch(function(){
        actionBtn.disabled = false;
        toast("Impossible de créer la section pour le moment (connexion ?).");
      });
    }}, "Créer la section"),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
  ));
}

/* Écran de confirmation après création : DEUX secrets distincts à
   transmettre au président, hors de l'application (SMS, email…) — le code
   de section, et le code personnel à 4 chiffres qui protège la fiche que
   l'administrateur vient de créer pour lui (sans lui, le président ne
   pourrait pas choisir sa propre fiche en rejoignant — voir
   openPickMyMemberSheet). Un simple toast ne suffirait pas : il disparaît
   trop vite pour deux valeurs à recopier. */
function openAdminSectionCreatedSheet(cph, section, code, pin){
  openSheet("Section créée", h("div", null,
    h("p", {class:"lede"}, "Transmettez ces deux informations au président ou à la présidente de "+section+" — "+cph+", hors de l'application (SMS, email…) : le code active la section, le code personnel lui permet de retrouver sa propre fiche en rejoignant."),
    h("div", {class:"info-list"},
      h("div", {class:"info-row"}, h("div", {class:"info-label"}, "Code de section"), h("div", {class:"info-value", style:"font-family:var(--font-mono)"}, code)),
      h("div", {class:"info-row"}, h("div", {class:"info-label"}, "Code personnel"), h("div", {class:"info-value", style:"font-family:var(--font-mono)"}, pin))
    ),
    h("button", {class:"sheet-btn ghost", style:"margin-top:12px", onclick:function(){ copyText("Code de section : "+code+"\nCode personnel : "+pin); }}, "Copier les deux codes"),
    h("button", {class:"sheet-btn accent", style:"margin-top:8px", onclick:function(){ closeSheet(); openAdminSection(cph, section, code); }}, "Continuer")
  ));
}

function openAdminIndexSectionSheet(cph, section){
  var codeIn = h("input", {type:"text", placeholder:"Code de section (transmis par le président)", style:"font-family:var(--font-mono)"});
  openSheet("Indexer cette section", h("div", null,
    h("p", {class:"lede"}, "Cette section n'a pas encore été indexée dans l'espace administrateur. Saisissez une fois son code — transmis par son président ou vice-président, comme pour tout autre acteur de la section — pour y accéder ensuite directement par CPH et section."),
    codeIn,
    h("button", {class:"sheet-btn accent", style:"margin-top:14px", onclick:function(){
      var code = codeIn.value.trim();
      if(!code){ toast("Merci de saisir le code."); return; }
      pullSectionSync(code).then(function(result){
        if(!result){ toast("Aucun espace trouvé pour ce code."); return; }
        registerSectionInAdminRegistry(adminSessionCode, cph, section, code).then(function(){
          closeSheet();
          toast("Section indexée.");
          openAdminSection(cph, section, code);
        }).catch(function(){
          closeSheet();
          toast("Section trouvée, mais impossible de l'indexer pour le moment — accès quand même.");
          openAdminSection(cph, section, code);
        });
      }).catch(function(){ toast("Code incorrect, ou connexion indisponible."); });
    }}, "Vérifier et indexer"),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
  ));
}

function openAdminSection(cph, section, sectionCode){
  adminBuffer = {cph:cph, section:section, sectionCode:sectionCode, sectionMembers:[], planning:[], sectionSettings:defaultSectionSettings(), loaded:false};
  /* adminMemberPins n'est volontairement PAS remis à zéro ici : ouvrir une
     section fraîchement créée (openAdminSectionCreatedSheet -> "Continuer")
     appelle aussi cette fonction, et le code du président généré à
     l'instant doit rester visible juste après. Les identifiants de fiche
     (uid()) étant uniques dans toute l'application, garder d'anciennes
     entrées en mémoire ne crée aucun risque de collision entre sections. */
  go("sysadmin-section");
  refreshAdminBuffer();
  /* Recharge les codes personnels déjà connus de l'administrateur pour
     cette section (générés lors d'une session précédente) — voir Codes
     personnels retrouvables sans régénération plus haut. */
  loadPersistedAdminPins(cph, section);
}
function refreshAdminBuffer(){
  if(!adminBuffer) return;
  pullSectionSync(adminBuffer.sectionCode).then(function(result){
    if(result){
      adminBuffer.sectionMembers = (result.payload && result.payload.sectionMembers) || [];
      adminBuffer.planning = (result.payload && result.payload.planning) || [];
      adminBuffer.sectionSettings = sanitizeSectionSettings(result.payload && result.payload.sectionSettings);
    }
    adminBuffer.loaded = true;
    render("sysadmin-section");
  }).catch(function(){
    adminBuffer.loaded = true;
    toast("Impossible de récupérer les données de cette section pour le moment.");
    render("sysadmin-section");
  });
}
function pushAdminBuffer(){
  if(!adminBuffer) return Promise.reject(new Error("no-admin-buffer"));
  return pushSectionSyncPayload(adminBuffer.sectionCode, adminBuffer.cph, adminBuffer.section, {
    sectionMembers: adminBuffer.sectionMembers, planning: adminBuffer.planning, sectionSettings: adminBuffer.sectionSettings
  });
}

/* Formulaire d'ajout/modification d'un conseiller depuis l'espace
   administrateur — même formulaire que openSectionMemberForm, mais
   opérant sur adminBuffer.sectionMembers (une section distante) plutôt
   que sur state.sectionMembers (les données locales de l'appareil de
   l'administrateur), et sans appel à saveState() : l'envoi vers
   Firestore reste un geste explicite (« Enregistrer et synchroniser »,
   voir renderers["sysadmin-section"]). */
function openAdminMemberForm(existing){
  var isEdit = !!existing;
  var draft = existing ? Object.assign({}, existing) : {id:uid(), nom:"", prenom:"", college:"", syndicat:"", email:"", tel:""};

  var form = h("div", null);
  form.appendChild(h("label", {class:"field-label"}, "Nom"));
  var nomIn = h("input", {type:"text", value:draft.nom, autocapitalize:"words"});
  bindNomCasing(nomIn);
  form.appendChild(nomIn);

  form.appendChild(h("label", {class:"field-label"}, "Prénom"));
  var prenomIn = h("input", {type:"text", value:draft.prenom, autocapitalize:"words"});
  bindPrenomCasing(prenomIn);
  form.appendChild(prenomIn);

  form.appendChild(h("label", {class:"field-label"}, "Collège"));
  var collegeSel = h("select", null,
    h("option", {value:"", selected: draft.college?null:"selected"}, "— Non précisé —"),
    COLLEGES.map(function(c){ return h("option", {value:c, selected: c===draft.college?"selected":null}, c); })
  );
  form.appendChild(collegeSel);

  form.appendChild(h("label", {class:"field-label"}, "Syndicat"));
  var syndField = createSyndicatField(function(){ return collegeSel.value; }, draft.syndicat);
  form.appendChild(syndField.select);
  form.appendChild(syndField.autreInput);
  collegeSel.addEventListener("change", syndField.rebuild);

  form.appendChild(h("label", {class:"field-label"}, "Email"));
  var emailIn = h("input", {type:"email", value:draft.email, autocapitalize:"none", autocomplete:"email"});
  form.appendChild(emailIn);

  form.appendChild(h("label", {class:"field-label"}, "Téléphone"));
  var telIn = h("input", {type:"tel", value:draft.tel, autocomplete:"tel"});
  bindTelFormatting(telIn);
  form.appendChild(telIn);

  /* Étiquette réservée à l'administrateur (voir échange avec
     l'utilisateur : « ces tags ne sont pas modifiables en dehors de
     l'admin »). C'est la SEULE fonction qui pose ce tag — ni la fiche
     locale du président (openSectionMemberForm) ni l'import JSON ne
     l'exposent, ils se contentent de le reporter à l'identique. Un seul
     titulaire à la fois par section : voir l'enforcement plus bas, au
     moment de l'enregistrement. */
  form.appendChild(h("label", {class:"field-label", style:"margin-top:4px"}, "Fonction en section"));
  var roleSel = h("select", null,
    h("option", {value:"", selected: draft.sectionRole?null:"selected"}, "Aucune"),
    h("option", {value:"president", selected: draft.sectionRole==="president"?"selected":null}, "Président(e) de section"),
    h("option", {value:"vice-president", selected: draft.sectionRole==="vice-president"?"selected":null}, "Vice-président(e) de section")
  );
  form.appendChild(roleSel);
  form.appendChild(h("div", {class:"footnote"}, "Un seul titulaire à la fois : le désigner ici retire automatiquement cette fonction à quiconque la portait déjà."));

  /* Code personnel : visible et copiable côté administrateur tant qu'il
     reste connu dans adminMemberPins — généré ou régénéré pendant la
     session en cours, ou retrouvé au chargement de la section grâce au
     coffre persisté (voir loadPersistedAdminPins / persistAdminPins,
     Codes personnels retrouvables sans régénération plus haut). Pour une
     fiche déjà existante uniquement : une fiche pas encore créée n'a
     encore rien à régénérer (voir le bouton « Ajouter le conseiller »
     plus bas, qui génère le premier code). */
  if(isEdit){
    form.appendChild(h("label", {class:"field-label", style:"margin-top:14px"}, "Code personnel"));
    var pinPanel = h("div", {class:"panel", style:"margin-top:4px"});
    var cachedPin = adminMemberPins[draft.id];
    if(cachedPin){
      pinPanel.appendChild(h("div", {class:"info-row"},
        h("div", {class:"info-label"}, "Code"),
        h("div", {class:"info-value", style:"font-family:monospace; font-weight:700; letter-spacing:2px;"}, cachedPin)
      ));
      pinPanel.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:function(){ copyText(cachedPin); }}, "Copier le code"));
      pinPanel.appendChild(h("p", {class:"footnote", style:"margin:8px 0 0"}, "Retrouvé automatiquement pour cette section — à transmettre en privé (SMS, email…)."));
    } else if(draft.pinHash){
      pinPanel.appendChild(h("p", {class:"footnote", style:"margin:0"}, "Un code personnel existe déjà pour cette fiche, mais reste introuvable ici — il a été généré directement sur l'appareil d'un président ou d'une vice-présidente (jamais transmis à l'espace administrateur), ou avant l'ajout de cette fonctionnalité. Régénérez-en un si vous devez le retransmettre."));
    } else {
      pinPanel.appendChild(h("p", {class:"footnote", style:"margin:0"}, "Aucun code personnel — n'importe qui connaissant le code de section peut pour l'instant choisir cette fiche sans vérification."));
    }
    pinPanel.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:function(){
      var newPin = generateMemberPin();
      hashMemberPin(newPin, draft.id).then(function(hash){
        adminBuffer.sectionMembers = adminBuffer.sectionMembers.map(function(m){
          return m.id===draft.id ? Object.assign({}, m, {pinHash:hash}) : m;
        });
        adminMemberPins[draft.id] = newPin;
        var pinUpdate = {}; pinUpdate[draft.id] = newPin;
        persistAdminPins(adminBuffer.cph, adminBuffer.section, pinUpdate);
        toast("Nouveau code personnel : "+newPin+" — pensez à « Enregistrer et synchroniser ».");
        closeSheet();
        var refreshed = adminBuffer.sectionMembers.filter(function(m){ return m.id===draft.id; })[0];
        openAdminMemberForm(refreshed);
      });
    }}, draft.pinHash ? "Régénérer le code personnel" : "Générer un code personnel"));
    form.appendChild(pinPanel);
  }

  var actions = h("div", {style:"margin-top:18px"});
  actions.appendChild(h("button", {class:"sheet-btn primary", onclick:function(){
    var nom = nomIn.value.trim(), prenom = prenomIn.value.trim();
    if(!nom && !prenom){ toast("Renseignez au moins un nom ou un prénom."); return; }
    var newRole = roleSel.value || null;
    var entry = {
      id: draft.id, nom:nom, prenom:prenom, college:collegeSel.value,
      syndicat: syndField.getValue() || "",
      email:emailIn.value.trim(), tel:telIn.value.trim(),
      pinHash: draft.pinHash || null,
      sectionRole: newRole
    };
    function commit(){
      if(newRole==="president" || newRole==="vice-president"){
        adminBuffer.sectionMembers = adminBuffer.sectionMembers.map(function(m){
          return (m.id!==entry.id && m.sectionRole===newRole) ? Object.assign({}, m, {sectionRole:null}) : m;
        });
      }
      if(isEdit){
        adminBuffer.sectionMembers = adminBuffer.sectionMembers.map(function(m){ return m.id===entry.id ? entry : m; });
      } else {
        adminBuffer.sectionMembers.push(entry);
      }
      closeSheet();
      render("sysadmin-section-members");
    }
    if(isEdit){
      commit();
      toast("Conseiller modifié — pensez à « Enregistrer et synchroniser ».");
    } else {
      var pin = generateMemberPin();
      hashMemberPin(pin, entry.id).then(function(hash){
        entry.pinHash = hash;
        adminMemberPins[entry.id] = pin;
        var pinUpdate = {}; pinUpdate[entry.id] = pin;
        persistAdminPins(adminBuffer.cph, adminBuffer.section, pinUpdate);
        commit();
        toast("Conseiller ajouté (code personnel : "+pin+", à lui transmettre) — pensez à « Enregistrer et synchroniser ».");
      });
    }
  }}, isEdit ? "Enregistrer les modifications" : "Ajouter le conseiller"));
  /* Bouton « Inviter » (demande explicite de l'utilisateur) : ouvre l'app
     SMS avec un message pré-rempli (voir buildInviteSmsBody / openSmsCompose
     plus bas) — nécessite de connaître le code personnel EN CLAIR de cette
     fiche, donc n'agit que si adminMemberPins le connaît déjà (voir le
     panneau Code personnel ci-dessus pour les cas où ce n'est pas le cas). */
  if(isEdit){
    actions.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:function(){
      var pin = adminMemberPins[draft.id];
      if(!pin){ toast("Le code personnel de cette fiche n'est pas connu ici — générez-en un (ou régénérez-le) avant d'inviter."); return; }
      var body = buildInviteSmsBody(adminBuffer.sectionCode, pin);
      closeSheet();
      openSmsCompose(draft.tel, body);
    }}, "Inviter"));
  }
  if(isEdit){
    actions.appendChild(h("button", {class:"sheet-btn danger", onclick:function(){
      adminBuffer.sectionMembers = adminBuffer.sectionMembers.filter(function(m){ return m.id!==draft.id; });
      closeSheet();
      render("sysadmin-section-members");
      toast("Conseiller supprimé — pensez à « Enregistrer et synchroniser ».");
    }}, "Supprimer ce conseiller"));
  }
  actions.appendChild(h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler"));
  form.appendChild(actions);

  openSheet(isEdit ? "Modifier le conseiller" : "Nouveau conseiller", form);
}
