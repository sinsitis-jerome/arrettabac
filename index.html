/* onJoined (optionnel) est prévenu une fois l'ensemble du parcours terminé :
   espace rejoint ET fiche personnelle choisie (ou explicitement passée via
   « Je ne trouve pas mon nom » — voir openPickMyMemberSheet). Utilisé par
   le parcours d'accueil (renderers.onboarding) pour savoir quand marquer
   onboarding.done ; les appels existants depuis Réglages n'en ont pas
   besoin et se contentent de rester sur l'écran courant. */
/* opts (facultatif) permet de personnaliser le titre/texte d'introduction
   et d'ajouter une note supplémentaire (nœud DOM déjà construit) sans
   dupliquer toute la logique de récupération + rattachement de fiche. */
function openJoinSectionSyncSheet(onJoined, opts){
  if(!syncAvailable()){ toast("Synchronisation indisponible pour le moment (vérifiez votre connexion)."); return; }
  opts = opts || {};
  var codeInput = h("input", {type:"text", placeholder:"Collez le code reçu", style:"font-family:monospace"});
  openSheet(opts.title || "Rejoindre avec un code", h("div", null,
    h("p", {class:"lede"}, opts.lede || "Collez ici le code que vous a transmis le président ou le vice-président de la section. L'annuaire des conseillers et le planning actuellement enregistrés sur cet appareil seront remplacés par ceux déjà partagés."),
    codeInput,
    opts.extraNote || null,
    h("button", {class:"sheet-btn accent", style:"margin-top:12px", onclick:function(){
      var code = codeInput.value.trim();
      if(!code){ toast("Merci de saisir un code."); return; }
      pullSectionSync(code).then(function(result){
        if(!result){
          toast("Aucun espace trouvé pour ce code — vérifiez qu'il est correctement recopié.");
          return;
        }
        applySyncPayloadToState(result.payload);
        /* Reprend aussi le CPH et la section transmis avec le document
           distant, jusqu'ici silencieusement ignorés (result.cph/section
           n'étaient utilisés nulle part) : sans ça, un(e) conseiller(e) qui
           rejoint sur un appareil vierge garde un profil.cph/section vides
           pour toujours, ce qui bloque ensuite isProfileComplete() malgré
           un parcours d'accueil par ailleurs entièrement terminé — bug
           identifié en construisant les étapes obligatoires activité
           salariée + signature (voir échange avec l'utilisateur). Même
           logique de repli que dans migrate() pour un CPH non listé. */
        if(result.cph){
          if(CPH_ALL.indexOf(result.cph)!==-1){ state.profile.cph = result.cph; state.profile.cphAutre = ""; }
          else { state.profile.cph = CPH_AUTRE; state.profile.cphAutre = result.cph; }
          /* Réglages > « Paramètres avancés » n'existe plus pour un(e)
             utilisateur(rice) lambda (voir échange avec l'utilisateur) —
             c'était jusqu'ici le seul endroit où ces liens/adresses se
             remplissaient automatiquement en choisissant son CPH. Comme le
             CPH est maintenant connu dès la jonction par code plutôt que
             saisi à la main, on applique directement ici le même repli
             connu pour ce CPH (ex. Béziers), sans jamais écraser une
             valeur déjà présente. */
          var preset = CPH_ADVANCED_PRESETS[state.profile.cph];
          if(preset){
            if(!state.profile.annuaireUrl) state.profile.annuaireUrl = preset.annuaireUrl;
            if(!state.profile.cphWebUrl) state.profile.cphWebUrl = preset.cphWebUrl;
            if(!state.profile.vacationsEmail) state.profile.vacationsEmail = preset.vacationsEmail;
            if(!state.profile.presidentEmail) state.profile.presidentEmail = preset.presidentEmail;
          }
        }
        if(result.section && SECTIONS.indexOf(result.section)!==-1){ state.profile.section = result.section; }
        state.sync.sectionCode = code;
        markSyncDone();
        closeSheet();
        toast("Espace rejoint — vos données sont à jour.");
        render(navStack[navStack.length-1]);
        openPickMyMemberSheet(onJoined);
      }).catch(function(err){
        toast("Échec de la récupération — vérifiez votre connexion, puis réessayez.");
      });
    }}, "Rejoindre"),
    h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:closeSheet}, "Annuler")
  ));
}

/* Récupération et envoi restent deux gestes SÉPARÉS et EXPLICITES plutôt
   qu'un unique bouton « synchroniser » qui ferait les deux à la chaîne :
   enchaîner un pull puis un push écraserait automatiquement toute
   modification locale pas encore envoyée avec la version distante avant
   même d'avoir pu la publier. Séparer les deux laisse à la présidence le
   choix explicite, dans le rare cas où les deux appareils auraient
   modifié les données depuis la dernière synchronisation. */
/* returnScreen (facultatif, "settings" par défaut) : écran sur lequel
   revenir une fois la récupération faite — voir renderers["mon-planning"],
   qui réutilise ce même geste explicite plutôt que d'en dupliquer un. */
function confirmAndPullSection(returnScreen){
  if(!syncAvailable()){ toast("Synchronisation indisponible pour le moment (vérifiez votre connexion)."); return; }
  openSheet("Récupérer la dernière version", h("div", null,
    h("p", {class:"lede"}, "L'annuaire des conseillers et le planning enregistrés sur cet appareil vont être remplacés par la dernière version partagée. Si des modifications locales n'ont pas encore été envoyées, elles seront perdues."),
    h("button", {class:"sheet-btn accent", onclick:function(){
      pullSectionSync(state.sync.sectionCode).then(function(result){
        closeSheet();
        if(!result){ toast("Aucune donnée trouvée pour ce code."); return; }
        applySyncPayloadToState(result.payload);
        markSyncDone();
        toast("Données récupérées.");
        render(returnScreen || "settings");
      }).catch(function(err){
        toast("Échec de la récupération — vérifiez votre connexion.");
      });
    }}, "Récupérer et remplacer"),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
  ));
}

/* Relie le profil de cet appareil à une fiche précise de l'annuaire des
   conseillers (state.profile.memberId), plutôt que de compter sur un
   rapprochement approximatif par nom : évite qu'une faute de frappe ou un
   accent oublié empêche « Mes statistiques » de reconnaître ses propres
   audiences (voir isSelfMemberId). Utilisée à la fois juste après avoir
   rejoint une section (voir openJoinSectionSyncSheet) et, à tout moment,
   depuis Réglages > Votre profil. */
function openPickMyMemberSheet(onDone){
  var searchVal = "";
  var listBox = h("div", {style:"margin-top:12px"});

  function selectMember(m){
    state.profile.memberId = m.id;
    if(m.prenom) state.profile.prenom = m.prenom;
    if(m.nom) state.profile.nom = m.nom;
    if(m.college) state.profile.college = m.college;
    /* Même logique de pré-remplissage que pour prénom/nom/collège
       ci-dessus, étendue au téléphone : sans lui, un profil resterait
       incomplet (voir isProfileComplete) au sortir même d'un parcours
       d'accueil par ailleurs entièrement terminé — bug identifié en
       construisant les étapes obligatoires activité salariée + signature
       (voir échange avec l'utilisateur). */
    if(m.tel) state.profile.tel = m.tel;
    /* La fonction en section (président/vice-président/aucune) se
       reconnaît désormais entièrement depuis l'étiquette posée sur cette
       fiche par l'administrateur — plus jamais déclarée soi-même (voir
       module ADMINISTRATION GÉNÉRALE). "none" plutôt que null : le profil est ainsi considéré complet
       (voir isProfileComplete) dès qu'une fiche est choisie, sans exiger
       un passage superflu par Réglages. */
    state.profile.sectionRole = m.sectionRole || "none";
    saveState();
    closeSheet();
    toast("Profil lié à « "+memberDisplayName(m)+" ».");
    render(navStack[navStack.length-1]);
    if(onDone) onDone(m);
  }

  /* Si cette fiche est protégée par un code personnel (voir le module CODE
     PERSONNEL PAR CONSEILLER), on le demande avant de lier le profil —
     empêche de choisir la fiche de quelqu'un d'autre par erreur ou
     volontairement. Une fiche sans code (jamais généré par le président)
     reste choisissable directement, en repli. */
  function requestPinThenSelect(m){
    if(!m.pinHash){ selectMember(m); return; }
    var pinInput = h("input", {type:"tel", inputmode:"numeric", maxlength:"4", placeholder:"Code à 4 chiffres", style:"font-family:monospace; letter-spacing:6px; text-align:center; font-size:1.15rem;"});
    var errBox = h("div", {class:"footnote", style:"min-height:1.2em; margin-top:6px"});
    openSheet("Code personnel de "+(memberDisplayName(m) || "cette fiche"), h("div", null,
      h("p", {class:"lede"}, "Cette fiche est protégée par un code à 4 chiffres, transmis en privé par le président. Saisissez-le pour confirmer qu'il s'agit bien de vous."),
      pinInput,
      errBox,
      h("button", {class:"sheet-btn accent", style:"margin-top:12px", onclick:function(){
        var entered = pinInput.value.trim();
        if(!/^\d{4}$/.test(entered)){ errBox.textContent = "Entrez les 4 chiffres du code."; return; }
        hashMemberPin(entered, m.id).then(function(hash){
          if(hash===m.pinHash){ selectMember(m); }
          else { errBox.textContent = "Code incorrect — demandez-le au président si besoin."; }
        });
      }}, "Confirmer"),
      h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:function(){ openPickMyMemberSheet(onDone); }}, "Retour à la liste")
    ));
  }

  function renderList(){
    clear(listBox);
    var q = normName(searchVal);
    var filtered = state.sectionMembers.filter(function(m){
      return !q || normName(memberDisplayName(m)).indexOf(q)!==-1;
    }).sort(memberSortCompare);
    if(filtered.length===0){
      listBox.appendChild(h("p", {class:"footnote"}, "Aucun conseiller ne correspond."));
      return;
    }
    var panel = h("div", {class:"panel"});
    filtered.forEach(function(m){
      var sub = [m.college, m.syndicat].filter(Boolean).join(" · ")+(m.pinHash ? "" : " · non protégée");
      panel.appendChild(h("div", {class:"row-click", onclick:function(){ requestPinThenSelect(m); }},
        h("div", {class:"rc-main"},
          h("div", {class:"rc-title"}, memberDisplayName(m) || "(Sans nom)"),
          h("div", {class:"rc-sub"}, sub || "—")
        ),
        icon("ic-chev", "chev")
      ));
    });
    listBox.appendChild(panel);
  }

  var searchInput = h("input", {type:"text", placeholder:"Rechercher un nom…", style:"margin-top:8px"});
  searchInput.addEventListener("input", function(e){ searchVal = e.target.value; renderList(); });

  renderList();
  openSheet("Qui êtes-vous ?", h("div", null,
    h("p", {class:"lede"}, "Choisissez votre fiche dans la liste : prénom, nom et collège seront pré-remplis, et vos statistiques et votre planning personnel se calculeront automatiquement à partir de vos audiences."),
    searchInput,
    listBox,
    h("button", {class:"sheet-btn ghost", style:"margin-top:12px", onclick:function(){
      closeSheet();
      toast("Vous pourrez saisir votre nom manuellement dans Réglages > Votre profil.");
      render(navStack[navStack.length-1]);
      if(onDone) onDone(null);
    }}, "Je ne trouve pas mon nom")
  ));
}

/* =================================================================
   CAPACITÉS (downloads)
   ================================================================= */
var downloadsCap = null;
var downloadsReady = (function(){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      return window.claude.use("downloads").then(function(cap){ downloadsCap = cap; return cap; }).catch(function(){ return null; });
    }
  }catch(e){}
  return Promise.resolve(null);
})();

/* Dernier repli lorsque même le téléchargement automatique déclenché par
   script (triggerFileDownload) échoue — cas rare (blob/URL indisponibles).
   Quand un nom de fichier est fourni, on propose quand même un vrai lien
   <a download> à activer soi-même (un geste utilisateur direct sur ce
   lien passe parfois là où la tentative automatique, asynchrone, a été
   bloquée) ; le contenu reste aussi copiable en un clic dans tous les cas,
   utile pour le coller directement dans un email par exemple. */
function showDownloadFallback(text, filename){
  var downloadLink = null;
  if(filename){
    try{
      var mime = /\.json$/i.test(filename) ? "application/json" : "text/plain";
      var blob = new Blob([text], {type:mime});
      var url = URL.createObjectURL(blob);
      downloadLink = h("a", {href:url, download:filename, class:"sheet-btn primary", style:"display:block; text-align:center; text-decoration:none; box-sizing:border-box; margin-bottom:12px;"}, "Télécharger « "+filename+" »");
    }catch(e){ downloadLink = null; }
  }
  var ta = h("textarea", {readonly:"readonly", style:"min-height:240px; font-family:var(--font-mono); font-size:.76rem; white-space:pre;"}, text);
  openSheet("Téléchargement indisponible ici", h("div", null,
    h("p", {class:"lede"}, downloadLink
      ? "Le téléchargement automatique n’a pas fonctionné sur cet appareil. Essayez le bouton ci-dessous ; s’il ne fait toujours rien, faites un appui long (ou un clic droit) dessus puis « Enregistrer le lien sous ». Vous pouvez aussi copier le contenu ci-dessous et le coller dans un email ou un document."
      : "Le téléchargement direct n’est pas possible sur cet appareil. Copiez ce contenu ci-dessous et collez-le dans votre tableur ou votre traitement de texte. Vous pouvez aussi essayer Ctrl+P / Cmd+P sur cet écran pour l’imprimer directement."),
    downloadLink,
    ta,
    h("button", {class:"sheet-btn "+(downloadLink?"ghost":"primary"), style:"margin-top:12px", onclick:function(){ copyText(text); }}, "Copier le contenu"),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Fermer")
  ));
}

function saveFile(baseName, extPreferred, extFallback, contents, fallbackText){
  /* La capacité "downloads" se résout de façon asynchrone après le
     chargement de la page (voir downloadsReady ci-dessus) : on l’attend
     avant de conclure qu’elle est indisponible, sinon un clic un peu
     rapide après l’ouverture de l’application déclenche à tort le
     message "Téléchargement indisponible", alors que la capacité
     aurait fini par être prête l’instant d’après. */
  toast("Préparation du fichier…");
  downloadsReady.then(function(){
    if(!downloadsCap){
      /* Version hébergée hors Artifact (cas normal de l'app installée
         depuis GitHub Pages) : pas de capacité "downloads" — on tente un
         vrai téléchargement de fichier déclenché par script avant de se
         rabattre sur le contenu copiable. */
      var text1 = fallbackText || contents;
      var name1 = baseName+"."+extPreferred;
      if(triggerFileDownload(name1, text1)) toast("Fichier « "+name1+" » téléchargé.");
      else showDownloadFallback(text1, name1);
      return;
    }
    downloadsCap.save({ filename: baseName+"."+extPreferred, data: contents }).then(function(){
      toast("Fichier « "+baseName+"."+extPreferred+" » enregistré.");
    }).catch(function(err){
      if(err && err.code==="extension_not_enabled" && extFallback){
        /* Format préféré indisponible sur cet appareil : on retente avec un
           format de repli — en utilisant le contenu de repli (fallbackText)
           s’il existe, plutôt que de renvoyer tel quel le contenu du format
           préféré (par ex. du HTML brut dans un fichier .md). */
        downloadsCap.save({ filename: baseName+"."+extFallback, data: (fallbackText!=null ? fallbackText : contents) }).then(function(){
          toast("Fichier « "+baseName+"."+extFallback+" » enregistré (format imprimable indisponible ici).");
        }).catch(function(){
          var text2 = fallbackText!=null ? fallbackText : contents;
          var name2 = baseName+"."+extFallback;
          if(triggerFileDownload(name2, text2)) toast("Fichier « "+name2+" » téléchargé.");
          else showDownloadFallback(text2, name2);
        });
      } else if(err && err.code==="declined"){
        toast("Téléchargement annulé.");
      } else {
        var text3 = fallbackText || contents;
        var name3 = baseName+"."+extPreferred;
        if(triggerFileDownload(name3, text3)) toast("Fichier « "+name3+" » téléchargé.");
        else showDownloadFallback(text3, name3);
      }
    });
  });
}

/* =================================================================
   SAUVEGARDE AUTOMATIQUE (toutes les données, format JSON)
   Une sauvegarde est proposée au téléchargement automatiquement à
   l'ouverture de l'application, dès que 7 jours se sont écoulés depuis
   la précédente (ou dès la première ouverture avec un profil complet).
   Une sauvegarde manuelle reste aussi disponible à tout moment dans
   Réglages. Le fichier contient l'intégralité des données de
   l'application (profil, vacations, envois RITA...) au format JSON —
   à conserver précieusement, notamment avant un changement d'appareil.

   Limite à connaître : un navigateur peut, selon ses réglages, bloquer
   ou demander une confirmation pour un téléchargement déclenché sans
   clic direct de l'utilisateur (protection anti-abus standard). Si
   cela arrive, le bouton "Sauvegarder maintenant" dans Réglages permet
   de le faire manuellement à tout moment. */
var BACKUP_INTERVAL_MS = 7*24*60*60*1000;
var backupAttemptedThisLoad = false;
function backupFileName(){
  var d = new Date();
  var iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  var nom = sanitizeFilenamePart(state.profile.nom);
  return (nom ? "cph-sauvegarde-"+nom+"-"+iso : "cph-sauvegarde-"+iso) + ".json";
}
/* Repli lorsque la capacité "downloads" est absente (version hébergée
   hors Artifact, cas normal pour l'application installée depuis GitHub
   Pages) : un vrai lien <a download> déclenché par script, qui fonctionne
   dans un onglet de navigateur normal (inerte uniquement dans le bac à
   sable de l'Artifact, où la capacité est de toute façon disponible). */
function triggerFileDownload(filename, text, mime){
  try{
    var blob = new Blob([text], {type: mime || "application/octet-stream"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  }catch(e){ return false; }
}
function triggerJsonDownload(filename, jsonText){
  return triggerFileDownload(filename, jsonText, "application/json");
}
function runBackup(isAuto){
  var filename = backupFileName();
  var json = JSON.stringify(state, null, 2);
  downloadsReady.then(function(){
    if(downloadsCap){
      downloadsCap.save({ filename:filename, data:json }).then(function(){
        state.lastBackupAt = new Date().toISOString(); saveState();
        toast((isAuto ? "Sauvegarde automatique enregistrée : « " : "Sauvegarde enregistrée : « ")+filename+" ».");
      }).catch(function(err){
        if(err && err.code==="declined"){ toast("Sauvegarde annulée."); return; }
        var ok = triggerJsonDownload(filename, json);
        if(ok){ state.lastBackupAt = new Date().toISOString(); saveState(); }
        toast(ok ? "Sauvegarde enregistrée : « "+filename+" »." : "Impossible d’enregistrer la sauvegarde sur cet appareil.");
      });
    } else {
      var ok = triggerJsonDownload(filename, json);
      if(ok){ state.lastBackupAt = new Date().toISOString(); saveState(); }
      toast(ok ? (isAuto ? "Sauvegarde automatique enregistrée : « " : "Sauvegarde enregistrée : « ")+filename+" »." : "Impossible d’enregistrer la sauvegarde sur cet appareil.");
    }
  });
}
function maybeRunAutoBackup(){
  if(backupAttemptedThisLoad) return;
  if(!isProfileComplete(state.profile)) return;
  var last = state.lastBackupAt ? new Date(state.lastBackupAt).getTime() : 0;
  if(Date.now() - last < BACKUP_INTERVAL_MS) return;
  backupAttemptedThisLoad = true;
  runBackup(true);
}

/* =================================================================
   INSTALLATION SUR L'ÉCRAN D'ACCUEIL (PWA)
   N'a d'effet que sur la version hébergée en ligne (ex. GitHub Pages),
   qui embarque un manifest.json et une icône — absents de la version
   publiée en tant qu'Artifact, où l'installation n'a pas de sens. La
   présence du <link rel="manifest"> sert donc de signal fiable pour
   savoir sur laquelle des deux versions l'application tourne.
   ================================================================= */
var INSTALL_DISMISS_KEY = "cph-toolbox.installDismissed";
var deferredInstallPrompt = null;
function hasManifest(){
  try{ return !!document.querySelector('link[rel="manifest"]'); }catch(e){ return false; }
}
function isStandaloneDisplay(){
  try{
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }catch(e){ return false; }
}
function isIOSDevice(){
  try{ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }catch(e){ return false; }
}
function installDismissed(){
  try{ return localStorage.getItem(INSTALL_DISMISS_KEY) === "1"; }catch(e){ return false; }
}
function dismissInstallBanner(){
  try{ localStorage.setItem(INSTALL_DISMISS_KEY, "1"); }catch(e){}
  if(navStack[navStack.length-1]==="home") render("home");
}
function shouldShowInstallBanner(){
  if(!hasManifest() || isStandaloneDisplay() || installDismissed()) return false;
  return !!deferredInstallPrompt || isIOSDevice();
}
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  if(navStack[navStack.length-1]==="home") render("home");
});
window.addEventListener("appinstalled", function(){
  deferredInstallPrompt = null;
  try{ localStorage.setItem(INSTALL_DISMISS_KEY, "1"); }catch(e){}
});
function triggerInstallPrompt(){
  if(deferredInstallPrompt){
    var promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null;
    promptEvent.prompt();
    promptEvent.userChoice.then(function(){
      if(navStack[navStack.length-1]==="home") render("home");
    }).catch(function(){});
  } else if(isIOSDevice()){
    openSheet("Installer l’application", h("div", null,
      h("p", {class:"lede"}, "Sur iPhone/iPad, l’installation se fait depuis Safari : touchez l’icône Partager en bas de l’écran, puis « Sur l’écran d’accueil »."),
      h("button", {class:"sheet-btn primary", onclick:function(){ closeSheet(); dismissInstallBanner(); }}, "J’ai compris")
    ));
  } else {
    toast("Ouvrez ce lien avec le navigateur de votre appareil pour installer l’application.");
  }
}
if("serviceWorker" in navigator && hasManifest()){
  window.addEventListener("load", function(){
    /* updateViaCache:"none" empêche le navigateur de réutiliser une copie
       de sw.js issue de son cache HTTP pour la vérification de mise à
       jour : sans cela, une nouvelle version publiée peut mettre jusqu'à
       24h (ou la durée du cache HTTP) à être détectée. */
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(reg){
      if(reg && reg.update){ reg.update().catch(function(){}); }
    }).catch(function(){});
  });
}

function escapeHtml(str){
  return String(str==null?"":str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* =================================================================
   HELPERS DOM
   ================================================================= */
function h(tag, attrs){
  var e = document.createElement(tag);
  var children = Array.prototype.slice.call(arguments, 2);
  if(attrs){
    for(var k in attrs){
      if(attrs[k]===undefined || attrs[k]===null || attrs[k]===false) continue;
      if(k==="class") e.className = attrs[k];
      else if(k==="html") e.innerHTML = attrs[k];
      else if(k.indexOf("on")===0 && typeof attrs[k]==="function") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
  }
  function append(c){
    if(c===undefined || c===null || c===false) return;
    if(Array.isArray(c)){ c.forEach(append); return; }
    e.appendChild(typeof c==="string" || typeof c==="number" ? document.createTextNode(c) : c);
  }
  children.forEach(append);
  return e;
}
function icon(id, cls){
  var span = document.createElement("span");
  span.className = "icn" + (cls ? " "+cls : "");
  span.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%"><use href="#'+id+'"></use></svg>';
  return span;
}
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }

var toastTimer=null;
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

function openSheet(title, contentEl){
  var wrap = document.getElementById("sheet-content");
  clear(wrap);
  if(title) wrap.appendChild(h("h2", null, title));
  wrap.appendChild(contentEl);
  document.getElementById("sheet-overlay").classList.add("open");
}
function closeSheet(){ document.getElementById("sheet-overlay").classList.remove("open"); }
document.getElementById("sheet-overlay").addEventListener("click", function(e){
  if(e.target.id==="sheet-overlay") closeSheet();
});

function copyText(str){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(function(){ toast("Copié dans le presse-papiers."); }).catch(function(){ toast("Impossible de copier."); });
  }
}

}

/* Écran de démarrage : "onboarding" (Qui êtes-vous ?) pour un premier
   lancement réel, "home" pour toute installation déjà initialisée — voir
   DEFAULT_STATE.onboarding et migrate(). */
var navStack = (state.onboarding && !state.onboarding.done) ? ["onboarding"] : ["home"];
var SCREEN_TITLES = {
  home:"Mon Assistant CPH", onboarding:"Bienvenue", vacations:"Feuille de vacation", bj:"Présider un BJ",
  bco:"Présider un BCO", refs:"Textes de référence", phrases:"Phrases rituelles", settings:"Réglages",
  "admin-section":"Administrer ma section", "admin-cph":"Administrer le CPH", stats:"Statistiques",
  "liens-utiles":"Liens utiles", "section-membres":"Acteurs de ma section",
  "planification":"Outil de planification", "mon-planning":"Mon planning",
  "prise-fonction":"Prise de fonction",
  "sysadmin-panel":"Espace administrateur", "sysadmin-section":"Section administrée",
  "sysadmin-section-members":"Liste de la section", "sysadmin-section-planning":"Planning de la section",
  "sysadmin-section-settings":"Paramètres de la section",
  "onboarding-activite":"Bienvenue", "onboarding-signature":"Bienvenue"
};
/* Écrans du parcours d'accueil : ni bouton retour ni icône Réglages tant
   qu'on y est (voir render() plus bas) — un conseiller ne doit pas
   pouvoir contourner l'activité salariée ou la signature obligatoires en
   sautant directement sur un autre écran (même logique déjà appliquée à
   "onboarding" lui-même). */
var ONBOARDING_SCREENS = ["onboarding", "onboarding-activite", "onboarding-signature"];
var renderers = {};

function go(screenId, replace){
  if(!replace) navStack.push(screenId);
  else navStack[navStack.length-1]=screenId;
  render(screenId);
}
function goBack(){
  if(navStack.length>1){ navStack.pop(); render(navStack[navStack.length-1]); }
}
function render(screenId){
  document.getElementById("tb-title").textContent = SCREEN_TITLES[screenId] || "";
  document.getElementById("btn-back").style.display = (screenId==="home"||ONBOARDING_SCREENS.indexOf(screenId)!==-1) ? "none" : "flex";
  /* Pendant tout le parcours d'accueil (y compris l'activité salariée et la
     signature, obligatoires — voir ONBOARDING_SCREENS), l'icône Réglages
     reste masquée : on évite qu'un conseiller la contourne en tapant
     directement dessus avant d'avoir terminé. */
  document.getElementById("btn-settings").style.display = ONBOARDING_SCREENS.indexOf(screenId)!==-1 ? "none" : "flex";
  var main = document.getElementById("main");
  clear(main);
  var screen = h("div", {class:"screen active", id:"screen-"+screenId});
  main.appendChild(screen);
  try{
    if(renderers[screenId]) renderers[screenId](screen);
  }catch(err){
    clear(screen);
    screen.appendChild(h("div", {class:"init-empty"}, [
      h("p", {}, "Une erreur est survenue pendant l'affichage de cet écran. Réessayez, ou revenez à l'accueil via le bouton retour."),
      h("button", {class:"btn", style:"margin-top:14px;", onclick:function(){ render("home"); }}, "Retour à l'accueil")
    ]));
    if(window.console && console.error) console.error("Erreur de rendu pour l'écran '"+screenId+"':", err);
  }
  main.scrollTop = 0;
  updateSettingsAttention();
}
function updateSettingsAttention(){
  var btn = document.getElementById("btn-settings");
  btn.classList.toggle("attn", !isProfileComplete(state.profile));
}

document.getElementById("btn-back").addEventListener("click", goBack);
document.getElementById("btn-settings").addEventListener("click", function(){ go("settings"); });

/* =================================================================
   ÉCRAN — PARCOURS D'ACCUEIL ("Qui êtes-vous ?")
   ------------------------------------------------------------------
   Premier écran d'un tout premier lancement (voir navStack et
   DEFAULT_STATE.onboarding). Conseiller(e), président(e) et
   vice-président(e) de section entrent tous les trois par le même
   parcours "rejoindre avec un code" (voir le bloc de commentaire
   ci-dessous) ; la fonction en section se lit ensuite sur l'annuaire.
   Pour "Président(e) de CPH", on se contente pour l'instant de
   préremplir le champ correspondant dans Réglages, puis d'y renvoyer
   directement. */
/* nextScreens accepte soit un seul id d'écran, soit un tableau (empilé
   dans l'ordre donné) — utile pour atterrir sur un écran autre que
   l'accueil tout en gardant un retour fonctionnel (voir plus bas,
   qui termine sur ["home","section-membres"] pour un président ou
   vice-président de section). */
function completeOnboarding(role, nextScreens){
  state.onboarding.role = role;
  state.onboarding.done = true;
  saveState();
  navStack = Array.isArray(nextScreens) ? nextScreens.slice() : [nextScreens || "home"];
  render(navStack[navStack.length-1]);
  /* Un tout premier lancement ne connaît son sync.sectionCode qu'à
     l'instant précis où ce parcours se termine (voir openJoinSectionSyncSheet
     plus haut dans le parcours) — trop tard pour l'événement fb-sync-ready,
     qui a très probablement déjà été ignoré une première fois faute de
     code de section à ce moment-là (voir maybeAutoPullSection). On
     retente donc ici, une fois que ce code existe réellement. */
  maybeAutoPullSection();
}
/* Rôle + écran d'atterrissage déduits de state.profile.sectionRole, tel
   que posé par l'administrateur sur la fiche choisie (voir
   openPickMyMemberSheet -> selectMember). Factorisé ici pour être appelé
   une fois le sous-parcours « activité salariée + signature » terminé
   (voir renderers["onboarding-signature"]), sans dupliquer cette logique
   déjà utilisée juste après le choix de la fiche. */
function landingForSectionRole(){
  if(state.profile.sectionRole==="president") return {role:"president-section", screens:["home","section-membres"]};
  if(state.profile.sectionRole==="vice-president") return {role:"vice-president-section", screens:["home","section-membres"]};
  return {role:"conseiller", screens:["home"]};
}
/* =================================================================
   PARCOURS D'ACCUEIL — REJOINDRE UNE SECTION
   ------------------------------------------------------------------
   Un seul et même parcours pour conseiller(e), président(e) ET
   vice-président(e) de section (voir échange avec l'utilisateur : « le
   président ne doit pas pouvoir l'initialiser lui-même, il se connecte
   la première fois avec un code comme n'importe quel conseiller »).
   La distinction ne se fait plus du tout au moment de l'accueil : elle
   se lit entièrement sur l'étiquette posée par l'administrateur sur la
   fiche de l'annuaire (sectionMembers[].sectionRole — voir
   openAdminMemberForm), une fois cette fiche choisie dans la liste
   (openPickMyMemberSheet -> selectMember). Un président ne crée donc
   plus jamais rien localement avant de rejoindre : impossible de perdre
   par erreur un annuaire local en rejoignant ensuite un espace créé par
   l'administrateur (piège identifié et corrigé — voir échange). */
renderers.onboarding = function(root){
  var wrap = h("div", {class:"home-wrap"});
  wrap.appendChild(h("div", {class:"hero"},
    h("div", {class:"eyebrow"}, "Bienvenue"),
    h("h1", null, "Qui êtes-vous ?"),
    h("p", null, "Cette réponse détermine comment préparer l'application pour vous.")
  ));

  function roleCard(icon_id, title, desc, onClick){
    return h("div", {class:"tool-card wide", tabindex:"0", onclick:onClick,
        onkeydown:function(e){ if(e.key==="Enter") onClick(); }},
      h("div", {class:"ic"}, icon(icon_id)),
      h("div", null, h("div", {class:"t"}, title), h("div", {class:"d"}, desc))
    );
  }

  var grid = h("div", {class:"card-grid"},
    roleCard("ic-users", "Acteur(rice) de section", "Conseiller(e), président(e) ou vice-président(e) — avec le code reçu de votre section", function(){
      /* Un seul parcours pour les trois rôles : la fonction en section ne
         se déclare plus ici, elle se lit sur l'étiquette posée par
         l'administrateur sur la fiche choisie (voir le commentaire
         ci-dessus et openPickMyMemberSheet -> selectMember, qui vient
         d'écrire state.profile.sectionRole avant cet appel). */
      openJoinSectionSyncSheet(function(m){
        /* Une fois identifié(e) (fiche choisie, ou explicitement passée via
           « Je ne trouve pas mon nom » — m peut alors être null), demande
           encore l'activité salariée puis la signature avant de considérer
           l'accueil terminé (voir échange avec l'utilisateur) — la fonction
           en section elle-même, déjà connue à ce stade, n'est appliquée
           qu'à la toute fin (voir renderers["onboarding-signature"]). */
        go("onboarding-activite");
      });
    }),
    roleCard("ic-building", "Président(e) de CPH", "Configuration classique pour l'instant, depuis Réglages", function(){
      state.profile.presidentCph = true;
      completeOnboarding("president-cph", "settings");
    }),
    roleCard("ic-gear", "Administrateur", "Accès réservé — code à 8 chiffres requis", function(){
      openAdminCodeGateSheet(function(){
        completeOnboarding("admin", "sysadmin-panel");
      });
    })
  );
  wrap.appendChild(grid);
  root.appendChild(wrap);
};

/* =================================================================
   PARCOURS D'ACCUEIL — ACTIVITÉ SALARIÉE PUIS SIGNATURE
   ------------------------------------------------------------------
   Une fois identifié(e) (fiche choisie dans l'annuaire, ou explicitement
   passée), l'accueil demande encore deux choses avant de se terminer,
   toutes deux nécessaires à la feuille de vacations (voir échange avec
   l'utilisateur) : l'activité salariée (obligatoire, avec le détail
   posté/horaires) puis la signature (obligatoire). Uniquement sur le
   parcours « Acteur(rice) de section » — voir renderers.onboarding — pas
   sur « Président(e) de CPH », qui reste pour l'instant une redirection
   simple vers Réglages (parcours dédié remis à plus tard). Ce
   sous-parcours n'est traversé qu'au tout premier accueil : il ne
   revient jamais s'imposer à une installation déjà en service. */
renderers["onboarding-activite"] = function(root){
  var p = state.profile;
  var wrap = h("div", {class:"home-wrap"});
  wrap.appendChild(h("div", {class:"hero"},
    h("div", {class:"eyebrow"}, "Encore une étape"),
    h("h1", null, "Votre activité salariée"),
    h("p", null, "Ces informations servent à préparer votre feuille de vacations.")
  ));
  root.appendChild(wrap);

  var panel = h("div", {class:"panel"});
  panel.appendChild(boolField("Exercez-vous une activité salariée ?", p.remunere, function(v){ p.remunere=v; if(!v){ p.poste=null; } saveState(); render("onboarding-activite"); }));
  if(p.remunere===true){
    panel.appendChild(h("div", {style:"margin-top:14px"}, boolField("Êtes-vous posté(e) ?", p.poste, function(v){ p.poste=v; saveState(); render("onboarding-activite"); })));
    panel.appendChild(h("label", {class:"field-label"}, "Horaires de travail habituels (optionnel)"));
    var timeRow = h("div", {class:"btn-row"},
      h("div", null,
        h("label", {class:"field-label"}, "Début"),
        h("select", {onchange:function(e){ p.horaireDebut=e.target.value; saveState(); }},
          h("option", {value:"", selected: p.horaireDebut?null:"selected"}, "—"),
          TIME_OPTIONS.map(function(t){ return h("option", {value:t[0], selected: t[0]===p.horaireDebut?"selected":null}, t[1]); }))
      ),
      h("div", null,
        h("label", {class:"field-label"}, "Fin"),
        h("select", {onchange:function(e){ p.horaireFin=e.target.value; saveState(); }},
          h("option", {value:"", selected: p.horaireFin?null:"selected"}, "—"),
          TIME_OPTIONS.map(function(t){ return h("option", {value:t[0], selected: t[0]===p.horaireFin?"selected":null}, t[1]); }))
      )
    );
    panel.appendChild(timeRow);
    panel.appendChild(h("div", {class:"footnote", style:"margin-top:8px"}, "Champ facultatif. Utile pour les calculs liés aux vacations postées."));
  }
  root.appendChild(panel);

  var canContinue = p.remunere!==null && (p.remunere===false || p.poste!==null);
  root.appendChild(h("button", {class:"sheet-btn accent", style:"margin-top:18px", disabled: !canContinue, onclick:function(){
    go("onboarding-signature");
  }}, "Continuer"));
  if(!canContinue){
    root.appendChild(h("div", {class:"footnote", style:"margin-top:8px; text-align:center"},
      p.remunere===null ? "Répondez à la question ci-dessus pour continuer." : "Précisez si vous êtes posté(e) pour continuer."));
  }
};

renderers["onboarding-signature"] = function(root){
  var p = state.profile;
  var wrap = h("div", {class:"home-wrap"});
  wrap.appendChild(h("div", {class:"hero"},
    h("div", {class:"eyebrow"}, "Dernière étape"),
    h("h1", null, "Votre signature"),
    h("p", null, "Elle apparaîtra sur votre relevé de vacations, à la place d'un document à imprimer et signer à la main.")
  ));
  root.appendChild(wrap);

  var continueBtn, hintFootnote;
  function refreshContinueState(){
    continueBtn.disabled = !p.signature;
    hintFootnote.style.display = p.signature ? "none" : "";
  }
  root.appendChild(buildSignaturePanel(p, refreshContinueState));

  root.appendChild(continueBtn = h("button", {class:"sheet-btn accent", style:"margin-top:18px", disabled: !p.signature, onclick:function(){
    if(!p.signature) return;
    if(p.presidentCph===null) p.presidentCph = false;
    if(p.referiste===null) p.referiste = false;
    saveState();
    var landing = landingForSectionRole();
    completeOnboarding(landing.role, landing.screens);
  }}, "Terminer"));
  root.appendChild(hintFootnote = h("div", {class:"footnote", style:"margin-top:8px; text-align:center; display:"+(p.signature?"none":"")}, "Enregistrez votre signature ci-dessus pour continuer."));
};

renderers["sysadmin-panel"] = function(root){
  if(!adminSessionCode){
    root.appendChild(h("div", {class:"init-empty"},
      h("p", null, "Session administrateur expirée."),
      h("button", {class:"btn", style:"margin-top:14px", onclick:function(){

/* Garde commune aux quatre écrans de la section administrée (landing +
   les trois sous-écrans) : session expirée ou aucune section choisie —
   ramène vers l'espace administrateur plutôt que d'afficher un écran
   cassé. Retourne `false` (et a déjà rempli `root`) si l'appelant doit
   s'arrêter là. */
function requireAdminBuffer(root){
  if(!adminSessionCode || !adminBuffer){
    root.appendChild(h("div", {class:"init-empty"},
      h("p", null, "Aucune section sélectionnée."),
      h("button", {class:"btn", style:"margin-top:14px", onclick:function(){ go("sysadmin-panel", true); }}, "Retour")
    ));
    return false;
  }
  return true;
}
/* Rappel affiché en bas des trois sous-écrans (liste / planning /
   paramètres) : contrairement à state (appareil de l'utilisateur),
   adminBuffer n'est jamais envoyé automatiquement — un aller-retour vers
   l'écran précédent est nécessaire pour retrouver « Enregistrer et
   synchroniser ». */
function adminSectionSaveReminder(){
  return h("div", {class:"footnote", style:"margin-top:16px"}, "Vos modifications restent en attente ici tant qu'elles ne sont pas envoyées — revenez à l'écran précédent puis touchez « Enregistrer et synchroniser ».");
}

/* Écran d'atterrissage d'une section administrée : trois cartes (demande
   explicite de l'utilisateur, plutôt que la longue page unique
   précédente qui empilait annuaire, planning puis paramètres) — voir
   échange avec l'utilisateur : « Je voudrai repenser un peu la vue
   administrateur pour avoir trois écrans au choix ». Les actions globales

/* Écran séparé « Planning de la section » (ex-bloc « Planning » de

renderers["sysadmin-section-planning"] = function(root){
  if(!requireAdminBuffer(root)) return;

    return;

    planPanel.appendChild(h("div", {class:"footnote"}, "Aucune date enregistrée."));
  } else {
    /* L'espace administrateur n'est jamais restreint à un collège : une
       seule ligne par audience (les deux collèges réunis), et un clic
       ouvre DIRECTEMENT le formulaire de modification avec les champs des
       deux collèges déjà affichés (gain de temps demandé par
       l'utilisateur) — contrairement à « Outil de planification », où
       chaque président/vice-président de section passe d'abord par une
       vue de détail (openAudienceDetail) avant de choisir son propre
       collège. Les audiences incomplètes sont signalées en rouge, comme
       pour président/vice-président (mergedEntryCompleteness — les deux

            planningDateLabel(g.date)+" — "+planningTypeLabel(g.type)

        )
      ));
    });

  root.appendChild(planPanel);
  root.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:8px", onclick:function(){
    openAdminAudienceForm({ date:"", type:"bj", presidence: COLLEGES[0]||"", byCollege:{} });

  /* Import JSON du planning, pendant administrateur de celui de l'annuaire
     ci-dessus — voir handleAdminPlanningImportFile. */
  var adminPlanningImportInput = h("input", {type:"file", accept:"application/json", style:"display:none", onchange:function(e){
    var file = e.target.files[0]; if(!file) return;
    handleAdminPlanningImportFile(file);
    e.target.value = "";
  }});
  root.appendChild(adminPlanningImportInput);
  root.appendChild(h("button", {
    class:"discreet-icon-btn", type:"button", style:"margin-top:4px",
    title:"Importer un planning (JSON)", "aria-label":"Importer un planning (JSON)",
    onclick:function(){ adminPlanningImportInput.click(); }
  }, icon("ic-upload")));
  root.appendChild(h("div", {class:"footnote", style:"margin-top:10px"}, "Ajout, modification et suppression d'une date, à la main ou par import JSON — le classement des rôles proposés reprend le même principe (nombre d'audiences déjà tenues) que sur les appareils de la section elle-même."));

  root.appendChild(adminSectionSaveReminder());
};

/* Formulaire d'une fiche de contact de « Paramètres de la section »
   (greffier, président du CPH, président du TJ, président de la Cour
   d'appel, bâtonnier, directeur de greffe) — même formulaire simple que
   openSectionRoleForm (Réglages, resté local et hors de portée de cet
   écran), mais opérant sur adminBuffer.sectionSettings.contacts. Pour
   « Président(e) du CPH » uniquement (pickable), un bouton supplémentaire
   permet de pré-remplir la fiche en choisissant un conseiller déjà
   inscrit — n'importe quelle section de ce CPH, comme demandé — plutôt
   que de ressaisir son identité à la main (voir
   openCrossSectionMemberPicker). */
function openAdminSectionContactForm(key, label, pickable, prefill){
  var draft = prefill || Object.assign({}, adminBuffer.sectionSettings.contacts[key]);

  var form = h("div", null);
  var prenomIn, nomIn, emailIn, telIn;

  if(pickable){
    form.appendChild(h("button", {class:"sheet-btn ghost", type:"button", style:"margin-bottom:14px", onclick:function(){
      openCrossSectionMemberPicker(adminBuffer.cph, function(m){
        openAdminSectionContactForm(key, label, pickable, {
          prenom: m.prenom || "", nom: m.nom || "", email: m.email || "", tel: m.tel || ""
        });
      });
    }}, "Choisir un conseiller déjà inscrit…"));
  }

  form.appendChild(h("label", {class:"field-label"}, "Prénom"));
  form.appendChild(prenomIn = h("input", {type:"text", value:draft.prenom, autocapitalize:"words"}));
  bindPrenomCasing(prenomIn);

  form.appendChild(h("label", {class:"field-label"}, "Nom"));
  form.appendChild(nomIn = h("input", {type:"text", value:draft.nom, autocapitalize:"words"}));
  bindNomCasing(nomIn);

  form.appendChild(h("label", {class:"field-label"}, "Email"));
  form.appendChild(emailIn = h("input", {type:"email", value:draft.email, autocapitalize:"none", autocomplete:"email"}));

  form.appendChild(h("label", {class:"field-label"}, "Téléphone"));
  form.appendChild(telIn = h("input", {type:"tel", value:draft.tel, autocomplete:"tel"}));
  bindTelFormatting(telIn);

  var actions = h("div", {style:"margin-top:18px"});
  actions.appendChild(h("button", {class:"sheet-btn primary", onclick:function(){
    adminBuffer.sectionSettings.contacts[key] = {
      prenom: prenomIn.value.trim(), nom: nomIn.value.trim(),
      email: emailIn.value.trim(), tel: telIn.value.trim()
    };
    closeSheet(); render("sysadmin-section-settings");
    toast("Informations enregistrées ici — n'oubliez pas « Enregistrer et synchroniser ».");
  }}, "Enregistrer"));
  actions.appendChild(h("button", {class:"sheet-btn danger", onclick:function(){
    adminBuffer.sectionSettings.contacts[key] = {prenom:"", nom:"", email:"", tel:""};
    closeSheet(); render("sysadmin-section-settings");
    toast("Informations effacées ici — n'oubliez pas « Enregistrer et synchroniser ».");
  }}, "Effacer ces informations"));
  actions.appendChild(h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler"));
  form.appendChild(actions);

  openSheet(label, form);
}

/* Choix d'un conseiller « toutes sections confondues » (même CPH) pour
   préremplir la fiche « Président(e) du CPH » — cette personne n'a pas de
   section qui lui soit propre, contrairement aux autres fiches de
   contact. Il n'existe aucune vraie liste globale des sections côté
   Firestore (voir plus haut : « list » toujours bloqué, seul un « get »
   par identifiant exact est autorisé) — on s'appuie donc sur SECTIONS,
   la liste fixe et déjà connue des cinq sections possibles d'un CPH, en
   interrogeant le registre puis l'annuaire de chacune l'une après
   l'autre. Quelques secondes selon la connexion : forcément plus lent
   qu'un accès direct, mais reste un geste ponctuel (au moment de
   désigner cette personne), jamais un chargement systématique. */
function openCrossSectionMemberPicker(cph, onPick){
  var body = h("div", null);
  var status = h("p", {class:"lede"}, "Recherche des conseillers de "+cph+"…");
  body.appendChild(status);
  var listBox = h("div", {style:"margin-top:8px"});
  body.appendChild(listBox);
  openSheet("Choisir un conseiller", body);

  var found = [];
  var pending = SECTIONS.length;
  function done(){
    pending--;
    if(pending>0) return;
    if(!found.length){
      status.textContent = "Aucun conseiller trouvé pour "+cph+" (sections pas encore indexées, ou hors connexion).";
      return;
    }
    status.textContent = found.length+(found.length>1 ? " conseillers trouvés — touchez un nom pour préremplir la fiche." : " conseiller trouvé — touchez le nom pour préremplir la fiche.");
    found.sort(function(a,b){ return memberSortCompare(a.member, b.member); }).forEach(function(entry){
      listBox.appendChild(h("div", {class:"row-click", tabindex:"0", onclick:function(){
          closeSheet();
          onPick(entry.member);
        }, onkeydown:function(e){ if(e.key==="Enter"){ closeSheet(); onPick(entry.member); } }},
        h("div", {class:"rc-main"},
          h("div", {class:"rc-title"}, memberDisplayName(entry.member) || "(Sans nom)"),
          h("div", {class:"rc-sub"}, entry.section+(entry.member.sectionRole ? " — "+sectionRoleLabel(entry.member.sectionRole) : ""))
        )
      ));
    });
  }
  SECTIONS.forEach(function(sectionName){
    lookupAdminRegistry(adminSessionCode, cph, sectionName).then(function(sectionCode){
      if(!sectionCode){ done(); return; }
      pullSectionSync(sectionCode).then(function(result){
        var members = (result && result.payload && result.payload.sectionMembers) || [];
        members.forEach(function(m){ found.push({member:m, section:sectionName}); });
        done();
      }).catch(done);
    }).catch(done);
  });
}
