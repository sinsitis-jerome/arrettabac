/* =================================================================
   ÉCRAN — STATISTIQUES (récapitulatif personnel des vacations saisies)
   ================================================================= */
/* Petit clin d'œil visuel par nature de vacation — purement décoratif, aucun
   impact sur les données ni les documents officiels. */
var NATURE_EMOJI = {
  "preparation-bj":"📋", "preparation-bco-refere":"📋",
  "audience-bj":"🧑‍⚖️", "audience-bco":"⚖️", "audience-refere":"⏱️",
  "delibere":"🗣️", "etude-dossier":"📂",
  "redaction-jugement":"✍️", "redaction-ordonnance":"✍️", "redaction-pv":"📝",
  "relecture":"🔍", "reunion":"🗓️", "ag":"🏛️", "as":"🏛️",
  "formation":"🎓", "administration":"🗂️", "deontologie":"🎗️",
  "conseiller-rapporteur":"📣"
};
function natureEmoji(id){ return NATURE_EMOJI[id] || "•"; }

/* Période affichée sur l'écran Statistiques : mois en cours, année en cours,
   ou cumul depuis toujours. Simple préférence d'affichage, non persistée. */
var statsViewPeriod = "month";
function statsPeriodEmptyLabel(period){
  if(period==="month") return "Aucune vacation enregistrée ce mois-ci.";
  if(period==="year") return "Aucune vacation enregistrée cette année.";
  return "Aucune vacation enregistrée pour l’instant — les statistiques apparaîtront ici au fil de vos saisies.";
}

/* =================================================================
   MODULE « MON ACTIVITÉ » (en tête de l'écran Statistiques)
   Toujours sur l'année en cours. Les audiences « réalisées » viennent des
   déclarations de vacations (seule source fiable de ce qui a vraiment eu
   lieu) ; les audiences « à venir » et les présidences viennent du
   planning — celui de l'Outil de planification pour un(e) président(e) de
   section (ses propres audiences, reconnues via "__self__"), ou de « Mon
   planning » pour un(e) conseiller(e) sans droits de présidence. Les deux
   sources sont combinées : chacune est vide pour l'un des deux profils,
   ce qui évite d'avoir à distinguer explicitement les deux cas ici.
   ================================================================= */
function currentYearStr(){ return todayISO().slice(0,4); }

/* Une même personne peut se retrouver représentée de deux façons dans une
   audience : via l'option dédiée « Moi-même » (id "__self__"), ou via sa
   propre fiche dans « Acteurs de ma section » si le président ou le
   vice-président figure aussi dans l'annuaire des conseillers (cas
   fréquent, par ex. après un import qui inclut son propre nom) — les deux
   représentations doivent compter comme « soi-même » pour Mes statistiques,
   sans quoi des audiences bien enregistrées n'y apparaissent jamais. */
function isSelfMemberId(id){
  if(!id) return false;
  /* Lien explicite et fiable, posé une fois pour toutes en choisissant sa
     propre fiche dans une liste (voir openPickMyMemberSheet) plutôt que de
     deviner par rapprochement de nom — élimine tout risque de faux négatif
     lié à une faute de frappe, un accent oublié ou un ordre nom/prénom
     différent entre le profil et l'annuaire. */
  if(state.profile.memberId && id===state.profile.memberId) return true;
  if(id==="__self__") return true;
  var m = state.sectionMembers.filter(function(x){ return x.id===id; })[0];
  if(!m) return false;
  return normName(m.nom)===normName(state.profile.nom) && normName(m.prenom)===normName(state.profile.prenom);
}

function myInvolvedPlanningEntries(){
  var out = [];
  (state.planning||[]).forEach(function(p){
    var isPresident = isSelfMemberId(p.president);
    var isAssesseur = (p.assesseurs||[]).some(isSelfMemberId);
    if(isPresident || isAssesseur){
      out.push({ type:p.type, date:p.date, role: isPresident ? "president" : "assesseur" });
    }
  });
  ((state.myPlanning && state.myPlanning.entries) || []).forEach(function(e){
    out.push({ type:e.type, date:e.date, role:e.role });
  });
  return out;
}

var REDACTION_NATURE_IDS = NATURES.filter(function(n){ return n.isRedaction; }).map(function(n){ return n.id; });

/* Conseillers « ordinaires » de la section pour le calcul de la moyenne
   ci-dessous : président(e) et vice-président(e) de section en sont
   exclus, sur demande explicite de l'utilisateur — leur charge d'audiences
   n'est pas comparable à celle d'un(e) simple conseiller(e) (bien plus
   d'audiences côté présidence, notamment), et les inclure fausserait la
   moyenne dans les deux sens (numérateur ET dénominateur) si on les
   comptait. */
function eligibleConseillersForSectionAverage(){
  return (state.sectionMembers||[]).filter(function(m){
    return m.sectionRole!=="president" && m.sectionRole!=="vice-president";
  });
}

/* Moyenne d'audiences (BJ + BCO/BCO MEE, année en cours) par conseiller
   « ordinaire » de la section — président(e) et vice-président(e) exclus
   à la fois du numérateur (leurs propres audiences ne sont pas comptées)
   et du dénominateur (ils ne sont pas comptés comme un « conseiller » de
   plus). Réutilise memberTotalAllTypesIn (déjà utilisé pour le classement
   des candidats) sur le planning restreint à l'année en cours. Renvoie
   null si la section n'a aucun conseiller ordinaire (moyenne non
   calculable), plutôt que de diviser par zéro. */
function sectionAverageAudiencesPerConseiller(){
  var year = currentYearStr();
  var eligible = eligibleConseillersForSectionAverage();
  if(!eligible.length) return null;
  var planningYear = (state.planning||[]).filter(function(p){ return p.date && p.date.slice(0,4)===year; });
  var total = eligible.reduce(function(sum, m){ return sum + memberTotalAllTypesIn(planningYear, m.id); }, 0);
  return total/eligible.length;
}

function computeMyActivityStats(){
  var year = currentYearStr();
  var today = todayISO();
  var vacYear = state.vacations.filter(function(v){ return v.date && v.date.slice(0,4)===year; });
  var planYear = myInvolvedPlanningEntries().filter(function(e){ return e.date && e.date.slice(0,4)===year; });
  var planFuture = planYear.filter(function(e){ return e.date>=today; });
  var planPast = planYear.filter(function(e){ return e.date<today; });

  function vacCount(natureIds){ return vacYear.filter(function(v){ return natureIds.indexOf(v.nature)!==-1; }).length; }
  function planCount(list, types){ return list.filter(function(e){ return types.indexOf(e.type)!==-1; }).length; }
  function avgMinutes(list){
    if(!list.length) return null;
    return Math.round(list.reduce(function(s,v){ return s+(v.minutes||0); }, 0) / list.length);
  }

  var bjDone = vacCount(["audience-bj"]);
  var bjUpcoming = planCount(planFuture, ["bj"]);
  var bcoDone = vacCount(["audience-bco"]);
  var bcoUpcoming = planCount(planFuture, ["bco","bco-mee"]);

  var audiencesDone = bjDone + bcoDone;
  var audiencesUpcoming = bjUpcoming + bcoUpcoming;

  var audienceVacYear = vacYear.filter(function(v){ return v.nature==="audience-bj" || v.nature==="audience-bco"; });

  var presidencesDone = planPast.filter(function(e){ return e.role==="president"; }).length;
  var presidencesUpcoming = planFuture.filter(function(e){ return e.role==="president"; }).length;

  var redactionVac = vacYear.filter(function(v){ return REDACTION_NATURE_IDS.indexOf(v.nature)!==-1; });

  var inWorkTotal = 0, outWorkTotal = 0;
  vacYear.forEach(function(v){
    var sp = vacationSplit(v);
    if(sp.inWork!=null) inWorkTotal += sp.inWork;
    if(sp.outWork!=null) outWorkTotal += sp.outWork;
  });

  return {
    year: year,
    bjDone: bjDone, bjUpcoming: bjUpcoming, bjTotal: bjDone+bjUpcoming,
    bcoDone: bcoDone, bcoUpcoming: bcoUpcoming, bcoTotal: bcoDone+bcoUpcoming,
    audiencesDone: audiencesDone, audiencesUpcoming: audiencesUpcoming, audiencesTotal: audiencesDone+audiencesUpcoming,
    avgPerConseiller: sectionAverageAudiencesPerConseiller(),
    avgAudienceMin: avgMinutes(audienceVacYear),
    presidencesDone: presidencesDone, presidencesUpcoming: presidencesUpcoming, presidencesTotal: presidencesDone+presidencesUpcoming,
    redactionsDone: redactionVac.length,
    avgRedactionMin: avgMinutes(redactionVac),
    inWorkTotal: inWorkTotal, outWorkTotal: outWorkTotal, workTotal: inWorkTotal+outWorkTotal
  };
}

function renderMyActivity(root){
  var s = computeMyActivityStats();

  function panel(title, rows){
    root.appendChild(h("div", {class:"section-title", style:"font-size:.92rem; margin:18px 0 8px;"}, title));
    var info = h("div", {class:"info-list panel"});
    rows.forEach(function(r){
      info.appendChild(h("div", {class:"info-row"},
        h("div", {class:"info-label"}, r[0]),
        h("div", {class:"info-value"}, r[1])
      ));
    });
    root.appendChild(info);
  }

  panel("BJ", [
    ["Réalisés", String(s.bjDone)],
    ["À venir", String(s.bjUpcoming)],
    ["Total", String(s.bjTotal)]
  ]);
  panel("BCO (BCO MEE inclus)", [
    ["Réalisés", String(s.bcoDone)],
    ["À venir", String(s.bcoUpcoming)],
    ["Total", String(s.bcoTotal)]
  ]);
  panel("Toutes audiences", [
    ["Réalisées", String(s.audiencesDone)],
    ["À venir", String(s.audiencesUpcoming)],
    ["Total", String(s.audiencesTotal)],
    ["Moyenne par conseiller de la section", s.avgPerConseiller!=null ? s.avgPerConseiller.toFixed(1).replace(".", ",")+" audience"+(s.avgPerConseiller>=2?"s":"") : "—"],
    ["Durée moyenne d’une audience", s.avgAudienceMin!=null ? minutesLabel(s.avgAudienceMin) : "—"]
  ]);
  panel("Présidences", [
    ["Réalisées", String(s.presidencesDone)],
    ["À venir", String(s.presidencesUpcoming)],
    ["Total", String(s.presidencesTotal)]
  ]);
  panel("Rédactions", [
    ["Réalisées", String(s.redactionsDone)],
    ["Durée moyenne", s.avgRedactionMin!=null ? minutesLabel(s.avgRedactionMin) : "—"]
  ]);
  panel("Temps de travail déclaré", [
    ["En temps de travail", minutesLabel(s.inWorkTotal)],
    ["Hors temps de travail", minutesLabel(s.outWorkTotal)],
    ["Total", minutesLabel(s.workTotal)]
  ]);
}

renderers.stats = function(root){
  root.appendChild(h("div", {class:"section-title"}, "Mon activité"));
  root.appendChild(h("p", {class:"lede"}, "Chiffres calculés sur l’année en cours ("+currentYearStr()+") à partir de vos déclarations de vacations et de votre planning (Outil de planification, ou Mon planning si vous n’avez pas de droits de présidence)."));
  renderMyActivity(root);

  root.appendChild(h("div", {class:"section-title", style:"margin-top:8px;"}, "Vacations déclarées"));
  var vacations = state.vacations;
  if(vacations.length===0){
    root.appendChild(h("div", {class:"init-empty"},
      h("p", null, "Aucune vacation enregistrée pour l’instant — les statistiques apparaîtront ici au fil de vos saisies.")
    ));
    return;
  }

  var period = statsViewPeriod;
  var curMonthKey = monthKey(todayISO());
  var curYear = todayISO().slice(0,4);
  var entries = vacations.filter(function(v){
    if(period==="month") return monthKey(v.date)===curMonthKey;
    if(period==="year") return v.date.slice(0,4)===curYear;
    return true;
  });

  var chipRow = h("div", {class:"chip-row", style:"margin-bottom:16px"});
  [["month","Mois en cours"],["year","Année en cours"],["all","Cumul total"]].forEach(function(pair){
    chipRow.appendChild(h("span", {
      class:"chip"+(period===pair[0]?" active":""),
      onclick:function(){ statsViewPeriod = pair[0]; render("stats"); }
    }, pair[1]));
  });
  root.appendChild(chipRow);

  if(entries.length===0){
    root.appendChild(h("div", {class:"init-empty"}, h("p", null, statsPeriodEmptyLabel(period))));
    return;
  }

  var totalMinutes = entries.reduce(function(s,v){ return s+(v.minutes||0); }, 0);
  root.appendChild(h("div", {class:"stat-row", style:"margin-bottom:16px"},
    h("div", {class:"stat-box"}, h("div", {class:"n"}, String(entries.length)), h("div", {class:"l"}, entries.length>1 ? "Vacations" : "Vacation")),
    h("div", {class:"stat-box"}, h("div", {class:"n"}, minutesLabel(totalMinutes)), h("div", {class:"l"}, "Temps cumulé"))
  ));

  var byNature = {}, countNature = {};
  entries.forEach(function(v){
    byNature[v.nature] = (byNature[v.nature]||0) + (v.minutes||0);
    countNature[v.nature] = (countNature[v.nature]||0) + 1;
  });
  var natures = Object.keys(byNature).sort(function(a,b){ return byNature[b]-byNature[a]; });
  var maxMinutes = byNature[natures[0]] || 1;
  var medals = ["🥇","🥈","🥉"];

  root.appendChild(h("div", {class:"section-title"}, "Par type de vacation"));
  var panel = h("div", {class:"panel"});
  natures.forEach(function(nid, i){
    var pct = Math.max(8, Math.round((byNature[nid]/maxMinutes)*100));
    var n = countNature[nid];
    panel.appendChild(h("div", {class:"stats-row"},
      h("div", {class:"stats-row-bar", style:"width:"+pct+"%"}),
      h("div", {class:"stats-row-content"},
        h("div", {class:"stats-row-rank"}, medals[i] || ""),
        h("div", {class:"stats-row-emoji"}, natureEmoji(nid)),
        h("div", {class:"stats-row-main"},
          h("div", {class:"stats-row-title"}, natureLabel(nid)),
          h("div", {class:"stats-row-sub"}, n+(n>1 ? " vacations" : " vacation"))
        ),
        h("div", {class:"stats-row-val"}, minutesLabel(byNature[nid]))
      )
    ));
  });
  root.appendChild(panel);

  root.appendChild(h("div", {class:"footnote"}, "Répartition de vos vacations personnelles sur la période sélectionnée."));
};

/* =================================================================
   ÉCRAN — FEUILLE DE VACATION
   ================================================================= */
function minutesLabel(m){
  var hh=Math.floor(m/60), mm=m%60;
  if(hh<=0) return mm+" min";
  if(mm===0) return hh+"h";
  return hh+"h"+String(mm).padStart(2,"0");
}
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(key){
  var parts=key.split("-"); var d=new Date(Number(parts[0]), Number(parts[1])-1, 1);
  var s=d.toLocaleDateString("fr-FR", {month:"long", year:"numeric"});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function shiftMonthKey(key, delta){
  var parts=key.split("-"); var y=parseInt(parts[0],10); var m=parseInt(parts[1],10)-1;
  m += delta; y += Math.floor(m/12); m = ((m%12)+12)%12;
  return y+"-"+String(m+1).padStart(2,"0");
}
function parseISODate(str){ var p=str.split("-"); return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); }
var vacViewMonth = monthKey(todayISO());
var planningViewType = "all";
var planningLastRealType = "bj";
var planningViewMonth = monthKey(todayISO());
/* Tri du tableau des conseillers dans « Acteurs de ma section » (côté
   président uniquement) : "college" (regroupement par collège, comme
   auparavant) ou "syndicat" (regroupement par organisation syndicale). */
var memberSortMode = "college";

function natureLabel(id){ var n=NATURES.filter(function(x){return x.id===id;})[0]; return n ? n.label : id; }
function depLabel(v){ var o=DEP_OPTIONS.filter(function(x){return x.value===v;})[0]; return o ? o.label : ""; }
function depCode(v){ return v==="domicile" ? "D" : v==="entreprise" ? "E" : v==="sans_objet" ? "S/O" : "—"; }

/* Nom de fichier des documents du mois : ANNEE-MOIS-NOM (ex. 2026-08-PIQUER),
   pour retrouver facilement le relevé d’un conseiller donné dans un dossier
   partagé. Repli sur ANNEE-MOIS seul si le nom n’est pas renseigné. */
function sanitizeFilenamePart(s){
  return String(s==null?"":s).trim().toUpperCase().replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g,"-");
}
function monthDocBaseName(mKey){
  var nom = sanitizeFilenamePart(state.profile.nom);
  return nom ? (mKey+"-"+nom) : mKey;
}

/* Objet de l'email d'envoi du RITA : "RITA NOM MOIS ANNEE" (ex. RITA PIQUER
   AOUT 2026) — mois en majuscules sans accent, comme saisi habituellement
   dans un objet d'email. */
var ACCENT_MAP_UPPER = {"À":"A","Â":"A","Ä":"A","Á":"A","É":"E","È":"E","Ê":"E","Ë":"E","Î":"I","Ï":"I","Ì":"I","Ô":"O","Ö":"O","Ò":"O","Ù":"U","Û":"U","Ü":"U","Ú":"U","Ç":"C","Ÿ":"Y","Œ":"OE"};
function stripAccentsUpper(s){
  var out = "";
  for(var i=0;i<s.length;i++){
    var c = s.charAt(i);
    out += ACCENT_MAP_UPPER[c] || c;
  }
  return out;
}
function monthNameNoAccentUpper(mKey){
  var parts = mKey.split("-");
  var d = new Date(Number(parts[0]), Number(parts[1])-1, 1);
  var s = d.toLocaleDateString("fr-FR", {month:"long"});
  return stripAccentsUpper(s.toUpperCase());
}
function vacationsEmailSubject(mKey){
  var year = mKey.split("-")[0];
  var nom = (state.profile.nom||"").trim().toUpperCase();
  var bits = ["RITA"];
  if(nom) bits.push(nom);
  bits.push(monthNameNoAccentUpper(mKey));
  bits.push(year);
  return bits.join(" ");
}

/* Envoi du relevé par email : on tente d'abord un vrai partage avec pièce
   jointe via l'API Web Share (disponible sur la plupart des mobiles, où
   l'app Mail/Gmail apparaît directement dans la feuille de partage avec le
   fichier déjà attaché). Si ce n'est pas possible (desktop, API absente,
   ou refus), on ouvre à la place un brouillon d'email pré-rempli — dans ce
   cas la pièce jointe doit être ajoutée manuellement, une pièce jointe ne
   pouvant pas être injectée dans un lien mailto. */
function shareOrMailtoRita(mKey, blob, filename){
  var to = (state.profile.vacationsEmail||"").trim();
  if(!to){
    toast("Aucune adresse email d’envoi des vacations n’est configurée pour votre CPH pour l’instant.");
    return;
  }
  var subject = vacationsEmailSubject(mKey);
  var canShareFile = false;
  var file = null;
  try{
    if(navigator.share && navigator.canShare && typeof File !== "undefined"){
      file = new File([blob], filename, {type:"image/jpeg"});
      canShareFile = navigator.canShare({files:[file]});
    }
  }catch(e){ canShareFile = false; }
  if(canShareFile){
    navigator.share({files:[file], title:subject, text:subject}).catch(function(){
      openRitaMailtoFallback(to, subject, mKey);
    });
  } else {
    openRitaMailtoFallback(to, subject, mKey);
  }
}
function openRitaMailtoFallback(to, subject, mKey){
  var body = "Bonjour,\n\nVeuillez trouver ci-joint mon relevé RITA de "+monthLabel(mKey).toLowerCase()+".\n\n"
    + "(pensez à joindre manuellement le fichier téléchargé à cet email avant l’envoi)\n\nCordialement.";
  var link = "mailto:"+to+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  try{ window.location.href = link; }catch(e){}
}

/* Le bouton "Envoyer" du relevé RITA n'est actif qu'à compter du 20 du mois
   concerné (pour éviter un envoi prématuré, avant que le mois soit
   quasiment complet). */
function isRitaSendEnabled(mKey){
  var parts = mKey.split("-");
  var year = Number(parts[0]), month = Number(parts[1]);
  var threshold = new Date(year, month-1, 20, 0, 0, 0, 0);
  return new Date() >= threshold;
}
function ritaSendDisabledExplanation(mKey){
  return "Disponible à partir du 20 "+monthLabel(mKey).toLowerCase()+".";
}
/* Avant l'envoi effectif, on demande une confirmation explicite : l'envoi
   est présenté comme définitif pour le mois concerné. */
function openRitaSendConfirm(mKey, blob, filename){
  var alreadySent = state.ritaSent && state.ritaSent[mKey];
  var alreadySentBanner = null;
  if(alreadySent){
    var sentDate = new Date(alreadySent);
    alreadySentBanner = h("div", {class:"banner red"},
      h("b", null, "⚠ "),
      "Attention, un envoi du relevé RITA de "+monthLabel(mKey).toLowerCase()+" a déjà été effectué le "+sentDate.toLocaleDateString("fr-FR")+" à "+sentDate.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"})+". Un nouvel envoi enverra à nouveau ce relevé."
    );
  }
  openSheet("Confirmer l’envoi", h("div", null,
    alreadySentBanner,
    h("p", {class:"lede"}, "Cet envoi est définitif pour "+monthLabel(mKey).toLowerCase()+". Avez-vous bien vérifié toutes vos vacations avant de l’envoyer ?"),
    h("button", {class:"sheet-btn blink-red", onclick:function(){
      closeSheet();
      shareOrMailtoRita(mKey, blob, filename);
      state.ritaSent[mKey] = new Date().toISOString();
      saveState();
      render("vacations");
    }}, "OUI, ENVOYER"),
    h("button", {class:"sheet-btn ghost", onclick:function(){
      closeSheet();
      render("vacations");
    }}, "NON, ANNULER")
  ));
}

/* Rappel d'envoi du RITA : à partir du 25 du mois en cours, si le relevé de
   ce mois n'a pas encore été marqué comme envoyé, on doit prévenir le
   conseiller. Retourne la clé du mois concerné (YYYY-MM), ou null si aucun
   rappel n'est dû aujourd'hui. */
function ritaReminderMonthKey(){
  var now = new Date();
  if(now.getDate() < 25) return null;
  var mKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  if(state.ritaSent && state.ritaSent[mKey]) return null;
  return mKey;
}
/* Notification système (facultative, avec autorisation explicite) : ne peut
   se déclencher que si l'application est ouverte (ou revient en avant-plan)
   au moment du contrôle — aucune notification "hors ligne" n'est possible
   sans serveur. Ne se déclenche qu'une fois par chargement de la page pour
   ne pas répéter la même alerte à chaque écran affiché. */
var ritaReminderNotifiedThisLoad = false;
function maybeNotifyRitaReminder(){
  if(ritaReminderNotifiedThisLoad) return;
  var mKey = ritaReminderMonthKey();
  if(!mKey) return;
  if(!state.profile.ritaReminders) return;
  if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
  ritaReminderNotifiedThisLoad = true;
  try{
    var n = new Notification("Relevé RITA à envoyer", {
      body: "Il ne reste que quelques heures pour envoyer votre relevé de "+monthLabel(mKey).toLowerCase()+" si ce n’est pas déjà fait.",
      tag: "rita-reminder-"+mKey
    });
    n.onclick = function(){
      try{ window.focus(); }catch(e){}
      vacViewMonth = mKey;
      render("vacations");
      n.close();
    };
  }catch(e){}
}

/* Repartition d'une vacation entre temps de travail (recouvrement avec
   l'horaire de travail salarié saisi sur l'entrée) et hors temps de
   travail — même règle que l'aperçu en direct du formulaire de saisie
   (voir updateComputed ci-dessous). Retourne null/null quand l'info n'est
   pas disponible pour cette vacation (pas d'activité salariée renseignée
   à l'époque de la saisie). */
function hmToMin(s){
  if(!s || typeof s!=="string") return null;
  var m = s.match(/^([01]\d|2[0-3]):([0-5]\d)$/);
  return m ? (Number(m[1])*60+Number(m[2])) : null;
}
function vacationSplit(v){
  var s = hmToMin(v.actStart), e = hmToMin(v.actEnd);
  if(s===null || e===null || e<=s) return { inWork:null, outWork:null };
  var total = e-s;
  if(v.noWorkDay) return { inWork:0, outWork:total };
  var ws = hmToMin(v.workStart), we = hmToMin(v.workEnd);
  if(ws===null || we===null || we<=ws) return { inWork:null, outWork:null };
  var overlap = Math.max(0, Math.min(e,we)-Math.max(s,ws));
  return { inWork:overlap, outWork: total-overlap };
}
/* Lignes d'info profil affichées en en-tête du relevé (collège, statut
   salarié/posté, horaires habituels) — la section, elle, reste dans le
   sous-titre existant plutôt que dans une colonne du tableau. */
function profileHeaderLines(p){
  var lines = [];
  if(p.college) lines.push("Collège "+p.college);
  if(p.remunere===true){
    lines.push("Salarié(e) rémunéré(e)"+(p.poste===true ? ", posté(e)" : p.poste===false ? ", non posté(e)" : ""));
    if(p.horaireDebut && p.horaireFin){
      lines.push("Horaires habituels : "+p.horaireDebut.replace(":","h")+"–"+p.horaireFin.replace(":","h"));
    }
  } else if(p.remunere===false){
    lines.push("Non salarié(e)");
  }
  return lines;
}
/* Contenu affiché dans la colonne "Notes" du relevé : les précisions
   saisies par le conseiller, complétées automatiquement par :
   - la mention "ne travaillait pas ce jour-là" si la case a été cochée ;
   - l'horaire de travail du jour s'il diffère de l'horaire habituel ;
   - un rappel d'autorisation lorsque la nature de la vacation l'exige
     (dépassement de temps de rédaction, ou étude de dossier avant délibéré). */
function vacationNotesDisplay(v){
  var parts = [];
  var p = state.profile;
  if(p.remunere===true && v.noWorkDay){
    parts.push("Ne travaillait pas ce jour-là");
  }
  if(p.remunere===true && !v.noWorkDay && v.workStart && v.workEnd && p.horaireDebut && p.horaireFin
     && (v.workStart!==p.horaireDebut || v.workEnd!==p.horaireFin)){
    parts.push("Horaire de travail : "+v.workStart.replace(":","h")+"–"+v.workEnd.replace(":","h"));
  }
  if(v.notes) parts.push(v.notes);
  var n = NATURES.filter(function(x){ return x.id===v.nature; })[0];
  if(n && (n.requiresAuthorizationNote || (n.redactionCapMinutes!=null && v.minutes>n.redactionCapMinutes))){
    parts.push("Conseiller(e) informé(e) de la nécessité de produire une autorisation");
  }
  return parts.join(" · ");
}

/* Champ heure à deux cases (HH / MM), saisie chiffres uniquement,
   validation de plage en temps réel avec alerte visuelle bloquante. */
function makeTimeField(labelText, initialHHMM, onChange){
  var hh = h("input", {type:"text", inputmode:"numeric", pattern:"[0-9]*", maxlength:"2", class:"time-box", placeholder:"HH",
    value: initialHHMM ? initialHHMM.split(":")[0] : ""});
  var mm = h("input", {type:"text", inputmode:"numeric", pattern:"[0-9]*", maxlength:"2", class:"time-box", placeholder:"MM",
    value: initialHHMM ? initialHHMM.split(":")[1] : ""});
  var err = h("div", {class:"time-error"}, "");
  var wrap = h("div", {class:"time-group"},
    h("label", {class:"field-label"}, labelText),
    h("div", {class:"time-pair"}, hh, h("span", {class:"time-sep"}, "h"), mm),
    err
  );

  function sanitize(inp){ inp.value = inp.value.replace(/\D/g,"").slice(0,2); }
  function check(showEmpty){
    var hv=hh.value.trim(), mv=mm.value.trim();
    var hNum = hv===""?null:parseInt(hv,10);
    var mNum = mv===""?null:parseInt(mv,10);
    var hOk = hNum!==null && hNum>=0 && hNum<=23;
    var mOk = mNum!==null && mNum>=0 && mNum<=59;
    hh.classList.toggle("invalid", hv!=="" ? !hOk : !!showEmpty);
    mm.classList.toggle("invalid", mv!=="" ? !mOk : !!showEmpty);
    if(hv!=="" && !hOk) err.textContent = "Heure invalide (00 à 23).";
    else if(mv!=="" && !mOk) err.textContent = "Minutes invalides (00 à 59).";
    else if(showEmpty && (hv===""||mv==="")) err.textContent = "Champ obligatoire.";
    else err.textContent = "";
    return hOk && mOk;
  }
  [hh,mm].forEach(function(inp){
    inp.addEventListener("input", function(){ sanitize(inp); check(false); if(onChange) onChange(); });
    inp.addEventListener("blur", function(){ check(false); if(onChange) onChange(); });
  });
  check(false);

  return {
    wrap: wrap,
    validate: function(showEmpty){ return check(showEmpty); },
    getMinutes: function(){ if(!check(false)) return null; return parseInt(hh.value,10)*60+parseInt(mm.value,10); },
    getHHMM: function(){ if(!check(false)) return null; return String(parseInt(hh.value,10)).padStart(2,"0")+":"+String(parseInt(mm.value,10)).padStart(2,"0"); },
    focus: function(){ hh.focus(); }
  };
}

function openVacationForm(existing){
  var isEdit = !!existing;
  var draft = existing ? Object.assign({}, existing) : { id:uid(), date:todayISO(), nature:"audience-bj", actStart:"", actEnd:"", workStart:"", workEnd:"", noWorkDay:false, section:state.profile.section||"", rg:"", notes:"", depFrom:"domicile", depTo:"domicile" };
  if(!draft.depFrom) draft.depFrom = "domicile";
  if(!draft.depTo) draft.depTo = "domicile";

  var form = h("div", null);
  form.appendChild(h("label", {class:"field-label"}, "Date"));
  var dateInput = h("input", {type:"date", value:draft.date});
  form.appendChild(dateInput);

  form.appendChild(h("label", {class:"field-label"}, "Nature de la vacation"));
  var natureSel = h("select", null, NATURES.map(function(n){
    return h("option", {value:n.id, selected: n.id===draft.nature ? "selected" : null}, n.label);
  }));
  form.appendChild(natureSel);
  var hint = h("div", {class:"footnote", style:"margin-top:6px"}, "");
  form.appendChild(hint);

  /* Bandeau(x) d’alerte très visible(s) selon la nature choisie et/ou la
     durée totale saisie (dérogation à demander à la présidence, validation
     du président de formation, plafond bloquant…) — recalculé à chaque
     changement de nature ou d’heures. */
  var natureAlertBox = h("div", null);
  form.appendChild(natureAlertBox);
  function updateNatureAlert(){
    clear(natureAlertBox);
    var n = NATURES.filter(function(x){ return x.id===natureSel.value; })[0];
    if(!n) return;
    var s = actStartF.getMinutes(), e = actEndF.getMinutes();
    var total = (s!==null && e!==null && e>s) ? (e-s) : null;
    if(n.alwaysAlert){
      natureAlertBox.appendChild(h("div", {class:"banner red"}, h("b", null, "⚠ "), n.alwaysAlert));
    }
    if(n.redactionCapMinutes!=null && total!=null && total>n.redactionCapMinutes){
      natureAlertBox.appendChild(h("div", {class:"banner red"}, h("b", null, "⚠ "), n.redactionCapAlert));
    }
    if(n.hardCapMinutes!=null && total!=null && total>n.hardCapMinutes){
      natureAlertBox.appendChild(h("div", {class:"banner red"}, h("b", null, "⛔ "), n.hardCapAlert));
    }
  }

  var totalN = h("div", {class:"n"}, "—");
  var inWorkN = h("div", {class:"n"}, "—");
  var outWorkN = h("div", {class:"n"}, "—");

  function updateComputed(){
    var s = actStartF.getMinutes(), e = actEndF.getMinutes();
    if(s===null || e===null || e<=s){
      totalN.textContent = "—"; inWorkN.textContent = "—"; outWorkN.textContent = "—";
      updateNatureAlert();
      return;
    }
    var total = e-s;
    totalN.textContent = minutesLabel(total);
    updateNatureAlert();
    if(state.profile.remunere===true && workStartF && workEndF){
      if(noWorkDayIn && noWorkDayIn.checked){
        inWorkN.textContent = minutesLabel(0);
        outWorkN.textContent = minutesLabel(total);
        return;
      }
      var ws = workStartF.getMinutes(), we = workEndF.getMinutes();
      if(ws===null || we===null || we<=ws){ inWorkN.textContent = "—"; outWorkN.textContent = "—"; return; }
      var overlap = Math.max(0, Math.min(e,we)-Math.max(s,ws));
      inWorkN.textContent = minutesLabel(overlap);
      outWorkN.textContent = minutesLabel(total-overlap);
    }
  }

  var actStartF = makeTimeField("Heure de début de l’activité / audience", draft.actStart, updateComputed);
  var actEndF = makeTimeField("Heure de fin de l’activité / audience", draft.actEnd, updateComputed);
  form.appendChild(h("div", {class:"btn-row"}, actStartF.wrap, actEndF.wrap));

  var workStartF = null, workEndF = null, noWorkDayIn = null;
  if(state.profile.remunere===true){
    var defStart = draft.workStart || state.profile.horaireDebut || "";
    var defEnd = draft.workEnd || state.profile.horaireFin || "";
    workStartF = makeTimeField("Heure de début de votre journée de travail", defStart, updateComputed);
    workEndF = makeTimeField("Heure de fin de votre journée de travail", defEnd, updateComputed);
    var workRow = h("div", {class:"btn-row", style:"margin-top:14px"}, workStartF.wrap, workEndF.wrap);
    form.appendChild(workRow);

    noWorkDayIn = h("input", {type:"checkbox", checked: draft.noWorkDay===true ? "checked" : null});
    form.appendChild(h("label", {class:"checkbox-row", style:"margin-top:10px"}, noWorkDayIn, "Je ne devais pas travailler aujourd’hui"));

    function toggleWorkRow(){
      workRow.style.display = noWorkDayIn.checked ? "none" : "flex";
      updateComputed();
    }
    noWorkDayIn.addEventListener("change", toggleWorkRow);
    toggleWorkRow();
  }

  form.appendChild(h("div", {class:"stat-row", style:"margin-top:16px"},
    h("div", {class:"stat-box"}, totalN, h("div", {class:"l"}, "Durée totale de la vacation"))
  ));
  if(state.profile.remunere===true){
    form.appendChild(h("div", {class:"stat-row", style:"margin-top:10px"},
      h("div", {class:"stat-box"}, inWorkN, h("div", {class:"l"}, "Durant le temps de travail")),
      h("div", {class:"stat-box"}, outWorkN, h("div", {class:"l"}, "Hors temps de travail"))
    ));
  }
  updateComputed();

  form.appendChild(h("div", {class:"section-title", style:"font-size:.92rem; margin:20px 0 4px;"}, "Déplacement"));
  var depFromSel = h("select", null, DEP_OPTIONS.map(function(o){
    return h("option", {value:o.value, selected: o.value===draft.depFrom ? "selected" : null}, o.label);
  }));
  var depToSel = h("select", null, DEP_OPTIONS.map(function(o){
    return h("option", {value:o.value, selected: o.value===draft.depTo ? "selected" : null}, o.label);
  }));
  form.appendChild(h("div", {class:"btn-row"},
    h("div", {class:"time-group"}, h("label", {class:"field-label"}, "Vous arrivez de :"), depFromSel),
    h("div", {class:"time-group"}, h("label", {class:"field-label"}, "Vous repartez vers :"), depToSel)
  ));
  /* Pour une rédaction, le déplacement passe par défaut sur « Sans objet »
     — mais reste modifiable : dès que l’utilisateur touche l’un des deux
     menus, on cesse de l’écraser automatiquement. */
  var depTouched = false;
  depFromSel.addEventListener("change", function(){ depTouched = true; });
  depToSel.addEventListener("change", function(){ depTouched = true; });

  form.appendChild(h("label", {class:"field-label", style:"margin-top:14px"}, "Section"));
  var sectionSel = h("select", null,
    h("option", {value:""}, "— Non précisée —"),
    SECTIONS.map(function(s){ return h("option", {value:s, selected: s===draft.section?"selected":null}, s); })
  );
  form.appendChild(sectionSel);

  var rgIn = h("input", {type:"text", placeholder:"Ex. 23/00456", value:draft.rg||""});
  var rgWrap = h("div", {style:"display:none"},
    h("label", {class:"field-label"}, "Numéro de RG"),
    rgIn
  );
  form.appendChild(rgWrap);

  var notesLabel = h("label", {class:"field-label"}, "Notes (nom de l’affaire, précisions…)");
  form.appendChild(notesLabel);
  var notesIn = h("textarea", null, draft.notes || "");
  form.appendChild(notesIn);

  function updateConditionalFields(){
    var n = NATURES.filter(function(x){ return x.id===natureSel.value; })[0];
    hint.textContent = n && n.hint ? n.hint : "";
    rgWrap.style.display = n && n.requiresRg ? "block" : "none";
    notesLabel.textContent = n && n.requiresNote ? "Précisions (obligatoire)" : "Notes (nom de l’affaire, précisions…)";
    if(n && n.isRedaction && !depTouched){
      depFromSel.value = "sans_objet";
      depToSel.value = "sans_objet";
    }
    updateNatureAlert();
  }
  natureSel.addEventListener("change", updateConditionalFields);
  updateConditionalFields();

  var actions = h("div", {style:"margin-top:16px"});
  actions.appendChild(h("button", {class:"sheet-btn primary", onclick:function(){
    var n = NATURES.filter(function(x){ return x.id===natureSel.value; })[0];

    var s = actStartF.getMinutes(), e = actEndF.getMinutes();
    var actValid = actStartF.validate(true) && actEndF.validate(true);
    if(!actValid || s===null || e===null){
      toast("Merci de renseigner des heures de début et de fin valides pour l’activité.");
      actStartF.focus();
      return;
    }
    if(e<=s){
      toast("L’heure de fin de l’activité doit être postérieure à l’heure de début.");
      actEndF.focus();
      return;
    }

    if(n && n.hardCapMinutes!=null && (e-s)>n.hardCapMinutes){
      toast(n.hardCapAlert);
      actEndF.focus();
      return;
    }

    var noWorkDay = state.profile.remunere===true && noWorkDayIn && noWorkDayIn.checked;
    if(state.profile.remunere===true && !noWorkDay){
      var ws = workStartF.getMinutes(), we = workEndF.getMinutes();
      var workValid = workStartF.validate(true) && workEndF.validate(true);
      if(!workValid || ws===null || we===null){
        toast("Merci de renseigner vos horaires de travail (début et fin), ou cochez « Je ne devais pas travailler aujourd’hui ».");
        workStartF.focus();
        return;
      }
      if(we<=ws){
        toast("L’heure de fin de votre journée de travail doit être postérieure à l’heure de début.");
        workEndF.focus();
        return;
      }
    }

    if(n && n.requiresRg && !rgIn.value.trim()){
      toast("Merci d’indiquer le numéro de RG.");
      rgIn.focus();
      return;
    }
    if(n && n.requiresNote && !notesIn.value.trim()){
      toast("Merci de préciser en quelques mots.");
      notesIn.focus();
      return;
    }
    var entry = {
      id:draft.id, date:dateInput.value||todayISO(), nature:natureSel.value,
      actStart:actStartF.getHHMM(), actEnd:actEndF.getHHMM(),
      workStart: (state.profile.remunere===true && !noWorkDay) ? workStartF.getHHMM() : "",
      workEnd: (state.profile.remunere===true && !noWorkDay) ? workEndF.getHHMM() : "",
      noWorkDay: noWorkDay,
      minutes:e-s, section:sectionSel.value, rg:rgIn.value.trim(), notes:notesIn.value.trim(),
      depFrom: depFromSel.value, depTo: depToSel.value
    };
    if(isEdit){
      state.vacations = state.vacations.map(function(v){ return v.id===entry.id ? entry : v; });
    } else {
      state.vacations.push(entry);
    }
    vacViewMonth = monthKey(entry.date);
    saveState(); closeSheet(); render("vacations");
    toast(isEdit ? "Vacation modifiée." : "Vacation ajoutée.");
  }}, isEdit ? "Enregistrer les modifications" : "Ajouter la vacation"));
  if(isEdit){
    actions.appendChild(h("button", {class:"sheet-btn danger", onclick:function(){
      state.vacations = state.vacations.filter(function(v){ return v.id!==draft.id; });
      saveState(); closeSheet(); render("vacations"); toast("Vacation supprimée.");
    }}, "Supprimer cette vacation"));
  }
  actions.appendChild(h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler"));
  form.appendChild(actions);

  openSheet(isEdit ? "Modifier la vacation" : "Nouvelle vacation", form);
}

/* Repli en image (JPEG, A4 paysage) : contrairement à .html, .csv ou .pdf,
   les extensions .jpg/.png font partie du socle TOUJOURS autorisé par la
   capacité de téléchargement (indépendant du réglage « formats étendus »
   qui bloque html/pdf/csv sur certains appareils) — ce visuel reste donc
   téléchargeable presque partout, et s’imprime directement une fois
   enregistré, sans dépendre du bouton « Imprimer » (bloqué dans le bac à
   sable où s’exécute l’application). */
var A4_IMG_W = 1754, A4_IMG_H = 1240; // A4 paysage à ~150dpi

function wrapCanvasText(ctx, text, maxWidth, maxLines){
  text = String(text==null ? "" : text).trim();
  if(!text) return ["—"];
  var words = text.split(/\s+/);
  var lines = [], cur = "";
  for(var i=0;i<words.length;i++){
    var test = cur ? cur+" "+words[i] : words[i];
    if(cur && ctx.measureText(test).width > maxWidth){
      lines.push(cur);
      cur = words[i];
      if(lines.length >= maxLines) break;
    } else {
      cur = test;
    }
  }
  var wordsUsed = lines.join(" ").split(/\s+/).filter(Boolean).length + (cur ? cur.split(/\s+/).length : 0);
  if(lines.length < maxLines && cur){ lines.push(cur); cur = ""; }
  if(lines.length > maxLines) lines = lines.slice(0, maxLines);
  if(wordsUsed < words.length || cur){
    var last = lines[lines.length-1] || "";
    while(last.length>1 && ctx.measureText(last+"…").width > maxWidth) last = last.slice(0,-1);
    lines[lines.length-1] = last+"…";
  }
  return lines.length ? lines : ["—"];
}

/* Charge (et met en cache) l'image de la signature enregistrée, sous forme
   d'un HTMLImageElement prêt à être dessiné dans un <canvas> — nécessaire
   car canvas.drawImage exige une image déjà décodée, contrairement à une
   simple balise <img src="data:..."> dans un document HTML classique
   (voir printVacations, qui n'a pas besoin de ce détour). Résout null si
   aucune signature n'est enregistrée ou si le décodage échoue. */
var signatureImgCache = null, signatureImgCacheSrc = null;
function getSignatureImage(){
  var src = state.profile.signature;
  if(!src) return Promise.resolve(null);
  if(signatureImgCache && signatureImgCacheSrc === src) return Promise.resolve(signatureImgCache);
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){ signatureImgCache = img; signatureImgCacheSrc = src; resolve(img); };
    img.onerror = function(){ resolve(null); };
    img.src = src;
  });
}

function buildVacationsCanvases(mKey, entries, total, signatureImg){
  var titleTxt = "Relevé de vacations — "+monthLabel(mKey);
  var cphDisp = cphLabel(state.profile);
  var subTxt = (fullName(state.profile)||"Conseiller(ère) prud’homal(e)") + (cphDisp ? " · CPH de "+cphDisp : "") + (state.profile.section ? " · Section "+state.profile.section : "");
  var infoTxt = profileHeaderLines(state.profile).join(" · ");
  var sans = "-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
  var validationNow = new Date();
  var validationTxt = "RITA validée le "+validationNow.toLocaleDateString("fr-FR")+" à "+validationNow.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"})+" par le Conseiller. Toute fausse déclaration peut donner lieu à saisine des instances disciplinaires.";

  var margin = 70;
  var contentW = A4_IMG_W - margin*2;
  var cols = [
    {key:"date", label:"Date", w:110},
    {key:"nature", label:"Nature", w:180},
    {key:"debut", label:"Début", w:75},
    {key:"fin", label:"Fin", w:75},
    {key:"duree", label:"Durée", w:85},
    {key:"inwork", label:"Temps de travail", w:140},
    {key:"outwork", label:"Hors temps de travail", w:160},
    {key:"aller", label:"Aller", w:70},
    {key:"retour", label:"Retour", w:70},
    {key:"rg", label:"RG", w:130}
  ];
  var fixedW = cols.reduce(function(s,c){ return s+c.w; }, 0);
  cols.push({key:"notes", label:"Notes", w: Math.max(180, contentW-fixedW)});

  var measureCtx = document.createElement("canvas").getContext("2d");
  measureCtx.font = "400 15px "+sans;
  var infoLines = infoTxt ? wrapCanvasText(measureCtx, infoTxt, contentW, 2) : [];

  var sigMaxW = 200, sigMaxH = 64, sigReserve = signatureImg ? sigMaxH+24 : 0;
  var headerBlockH = 68 + (infoLines.length ? 22+infoLines.length*20 : 0), footerBlockH = 150+sigReserve, tableHeaderRowH = 46;
  var availH = A4_IMG_H - margin*2 - headerBlockH - footerBlockH;

  var rowH = 34, maxLines = 2;
  if(Math.floor((availH-tableHeaderRowH)/rowH) < Math.max(entries.length,1)){
    rowH = 24; maxLines = 1;
  }
  var perPage = Math.max(1, Math.floor((availH-tableHeaderRowH)/rowH));
  var pageCount = Math.max(1, Math.ceil((entries.length||1)/perPage));

  var canvases = [];
  for(var p=0; p<pageCount; p++){
    var pageEntries = entries.slice(p*perPage, (p+1)*perPage);
    var canvas = document.createElement("canvas");
    canvas.width = A4_IMG_W; canvas.height = A4_IMG_H;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,A4_IMG_W,A4_IMG_H);

    var x = margin, y = margin;
    ctx.fillStyle = "#141414";
    ctx.font = "700 30px "+sans;
    ctx.fillText(titleTxt, x, y+30);
    ctx.fillStyle = "#555";
    ctx.font = "400 17px "+sans;
    ctx.fillText(subTxt, x, y+58);
    if(infoLines.length){
      ctx.fillStyle = "#777";
      ctx.font = "400 15px "+sans;
      infoLines.forEach(function(ln, li){ ctx.fillText(ln, x, y+80+li*20); });
    }
    if(pageCount>1){
      ctx.textAlign = "right";
      ctx.fillStyle = "#777";
      ctx.font = "400 15px "+sans;
      ctx.fillText("Page "+(p+1)+" / "+pageCount, margin+contentW, y+30);
      ctx.textAlign = "left";
    }

    var tx = margin, ty = margin + headerBlockH;
    ctx.fillStyle = "#EFEDE7";
    ctx.fillRect(tx, ty, contentW, tableHeaderRowH);
    ctx.strokeStyle = "#999"; ctx.lineWidth = 1;
    ctx.strokeRect(tx, ty, contentW, tableHeaderRowH);
    ctx.fillStyle = "#1C2024";
    ctx.font = "700 14px "+sans;
    var cx = tx;
    cols.forEach(function(c){
      var hLines = wrapCanvasText(ctx, c.label, c.w-16, 2);
      var lh = tableHeaderRowH/(hLines.length+0.8);
      hLines.forEach(function(ln, li){ ctx.fillText(ln, cx+8, ty + lh*(li+1) - 4); });
      cx += c.w;
    });

    var ry = ty + tableHeaderRowH;
    ctx.font = (maxLines===2 ? "400 14px " : "400 13px ")+sans;
    pageEntries.forEach(function(v, idx){
      if(idx % 2 === 1){ ctx.fillStyle = "#FAF9F6"; ctx.fillRect(tx, ry, contentW, rowH); }
      ctx.fillStyle = "#26292D";
      var split = vacationSplit(v);
      var cvals = {
        date: parseISODate(v.date).toLocaleDateString("fr-FR"),
        nature: natureLabel(v.nature),
        debut: v.actStart||"—", fin: v.actEnd||"—",
        duree: minutesLabel(v.minutes),
        inwork: split.inWork==null?"—":minutesLabel(split.inWork),
        outwork: split.outWork==null?"—":minutesLabel(split.outWork),
        aller: depCode(v.depFrom), retour: depCode(v.depTo),
        rg: v.rg||"—", notes: vacationNotesDisplay(v)||"—"
      };
      var ccx = tx;
      cols.forEach(function(c){
        var cellW = c.w - 16;
        if(c.key === "notes"){
          var lines = wrapCanvasText(ctx, cvals[c.key], cellW, maxLines);
          var lh = rowH/(lines.length+0.6);
          lines.forEach(function(ln, li){ ctx.fillText(ln, ccx+8, ry + lh*(li+1) - 3); });
        } else {
          var txt = String(cvals[c.key]);
          while(txt.length>1 && ctx.measureText(txt).width > cellW){ txt = txt.slice(0,-1); }
          if(txt !== String(cvals[c.key])) txt = txt.replace(/.$/, "…");
          ctx.fillText(txt, ccx+8, ry+rowH/2+5);
        }
        ccx += c.w;
      });
      ry += rowH;
    });

    ctx.strokeStyle = "#CFCBC2";
    var gy = ty+tableHeaderRowH;
    for(var i=0;i<=pageEntries.length;i++){ ctx.beginPath(); ctx.moveTo(tx, gy); ctx.lineTo(tx+contentW, gy); ctx.stroke(); gy += rowH; }
    var gx = tx;
    ctx.beginPath();
    cols.forEach(function(c){ ctx.moveTo(gx, ty); ctx.lineTo(gx, ty+tableHeaderRowH+pageEntries.length*rowH); gx+=c.w; });
    ctx.moveTo(tx+contentW, ty); ctx.lineTo(tx+contentW, ty+tableHeaderRowH+pageEntries.length*rowH);
    ctx.stroke();
    ctx.strokeRect(tx, ty, contentW, tableHeaderRowH+pageEntries.length*rowH);

    var fy = A4_IMG_H - margin - footerBlockH + 24;
    if(p === pageCount-1){
      ctx.fillStyle = "#141414";
      ctx.font = "700 16px "+sans;
      ctx.fillText("Total du mois : "+minutesLabel(total)+" — "+entries.length+" vacation(s).", margin, fy);
      fy += 22;
    }
    ctx.fillStyle = "#777";
    ctx.font = "400 11px "+sans;
    ctx.fillText("Aller / Retour : D = Domicile, E = Entreprise.", margin, fy);
    fy += 16;
    ctx.font = "400 12px "+sans;
    ctx.fillText("Document généré le "+new Date().toLocaleDateString("fr-FR")+" — à vérifier avant transmission au greffe. Les durées indemnisables sont fixées par le Code du travail.", margin, fy);

    /* Mention de validation, en gras, en bas à droite, sous le tableau. */
    var valW = 420;
    var valX = margin+contentW-valW;
    ctx.fillStyle = "#141414";
    ctx.font = "700 13px "+sans;
    ctx.textAlign = "right";
    var valLines = wrapCanvasText(ctx, validationTxt, valW, 5);
    var valLineH = 18;
    var valY = A4_IMG_H - margin - (valLines.length-1)*valLineH;
    valLines.forEach(function(ln, li){ ctx.fillText(ln, valX+valW, valY + li*valLineH); });
    ctx.textAlign = "left";

    /* Signature manuscrite, en plus de la mention de validation ci-dessus
       (jamais à sa place) : image apposée juste au-dessus, alignée à
       droite sur la même largeur. */
    if(signatureImg){
      var sigRatio = Math.min(sigMaxW/signatureImg.width, sigMaxH/signatureImg.height, 1);
      var sigW = signatureImg.width*sigRatio, sigH = signatureImg.height*sigRatio;
      var sigX = valX+valW-sigW;
      /* valY est la ligne de base de la PREMIÈRE (donc la plus haute) ligne
         du texte de validation ; on remonte d'un ascendant approximatif
         (~13px pour cette police) plus une marge avant de poser la
         signature au-dessus. */
      var sigBottom = valY - 21;
      var sigY = sigBottom - sigH;
      ctx.drawImage(signatureImg, sigX, sigY, sigW, sigH);
      ctx.strokeStyle = "#CFCBC2"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sigX, sigBottom+2); ctx.lineTo(valX+valW, sigBottom+2); ctx.stroke();
      ctx.fillStyle = "#999";
      ctx.font = "400 10px "+sans;
      ctx.textAlign = "right";
      ctx.fillText("Signature du conseiller", valX+valW, sigY-6);
      ctx.textAlign = "left";
    }

    canvases.push(canvas);
  }
  return canvases;
}

function canvasToJpegBlob(canvas, quality){
  return new Promise(function(resolve){ canvas.toBlob(function(blob){ resolve(blob); }, "image/jpeg", quality||0.92); });
}

function showImageFallback(blobs, mKey){
  var urls = blobs.map(function(b){ return URL.createObjectURL(b); });
  var imgs = urls.map(function(u, i){
    var filename = monthDocBaseName(mKey)+(blobs.length>1 ? "-page"+(i+1) : "")+".jpg";
    return h("div", {style:"margin-bottom:20px;"},
      blobs.length>1 ? h("p", {class:"lede"}, "Page "+(i+1)+" / "+blobs.length) : null,
      h("img", {src:u, style:"width:100%; border-radius:8px; border:1px solid var(--divider); display:block; margin-bottom:8px;"}),
      /* Vrai lien <a download> : inerte dans le bac à sable de l’Artifact,
         mais fonctionnel dès que cette page tourne dans un onglet de
         navigateur normal (fichier ouvert directement, hors bac à sable) —
         ça ne coûte rien de le proposer en plus du clic droit. */
      h("a", {href:u, download:filename, class:"sheet-btn primary", style:"display:block; text-align:center; text-decoration:none; box-sizing:border-box;"}, "Télécharger"),
      isRitaSendEnabled(mKey)
        ? h("button", {class:"sheet-btn orange", style:"margin-top:8px; width:100%; box-sizing:border-box;", onclick:function(){
            openRitaSendConfirm(mKey, blobs[i], filename);
          }}, "Envoyer")
        : h("button", {class:"sheet-btn ghost", disabled:"disabled", style:"margin-top:8px; width:100%; box-sizing:border-box;"}, ritaSendDisabledExplanation(mKey))
    );
  });
  openSheet("Relevé — image à enregistrer", h("div", null,
    h("p", {class:"lede"}, "Le bouton « Télécharger » sous chaque page tente un enregistrement direct. S’il ne fait rien sur cet appareil, faites un appui long (ou un clic droit) sur l’image, puis « Enregistrer l’image » — vous pourrez ensuite l’imprimer normalement. Le bouton « Envoyer » propose le fichier au partage (avec pièce jointe sur la plupart des mobiles) ou, à défaut, ouvre un email pré-rempli à joindre manuellement — il n’est disponible qu’à partir du 20 du mois."),
    h("div", null, imgs),
    h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Fermer")
  ));
}

function exportVacationsImage(mKey, entries, total){
  toast("Préparation de l’image…");
  getSignatureImage().then(function(signatureImg){
  var canvases = buildVacationsCanvases(mKey, entries, total, signatureImg);
  Promise.all(canvases.map(function(c){ return canvasToJpegBlob(c, 0.92); })).then(function(blobs){
    downloadsReady.then(function(){
      if(!downloadsCap){ showImageFallback(blobs, mKey); return; }
      var i = 0;
      function next(){
        if(i >= blobs.length){
          toast(blobs.length>1 ? "Images enregistrées ("+blobs.length+" pages)." : "Image enregistrée.");
          return;
        }
        var suffix = blobs.length>1 ? "-page"+(i+1) : "";
        downloadsCap.save({ filename:monthDocBaseName(mKey)+suffix+".jpg", data:blobs[i] }).then(function(){
          i++; next();
        }).catch(function(err){
          if(err && err.code==="declined"){ toast("Téléchargement annulé."); return; }
          showImageFallback(blobs, mKey);
        });
      }
      next();
    });
  });
  });
}

/* Génère d’abord un document HTML autonome et imprimable (bouton
   d’impression natif du navigateur, une fois le fichier ouvert en dehors
   du bac à sable où s’exécute l’application — window.print() y est
   bloqué silencieusement, d’où le passage par un fichier téléchargé). Si
   ce format n’est pas accepté ici (option « formats étendus » désactivée
   pour cet appareil) ou si le téléchargement échoue, on bascule
   automatiquement sur l’image JPEG ci-dessus, qui reste téléchargeable
   presque partout et s’imprime tout aussi bien. */
function printVacations(mKey, entries, total){
  var cphDisp = cphLabel(state.profile);
  var titleTxt = "Relevé de vacations — "+monthLabel(mKey);
  var subTxt = (fullName(state.profile)||"Conseiller(ère) prud’homal(e)") + (cphDisp ? " · CPH de "+cphDisp : "") + (state.profile.section ? " · Section "+state.profile.section : "");
  var infoTxt = profileHeaderLines(state.profile).join(" · ");
  var rowsHtml = entries.map(function(v){
    var split = vacationSplit(v);
    return "<tr>"
      + "<td>"+escapeHtml(parseISODate(v.date).toLocaleDateString("fr-FR"))+"</td>"
      + "<td>"+escapeHtml(natureLabel(v.nature))+"</td>"
      + "<td>"+escapeHtml(v.actStart||"—")+"</td>"
      + "<td>"+escapeHtml(v.actEnd||"—")+"</td>"
      + "<td>"+escapeHtml(minutesLabel(v.minutes))+"</td>"
      + "<td>"+escapeHtml(split.inWork==null?"—":minutesLabel(split.inWork))+"</td>"
      + "<td>"+escapeHtml(split.outWork==null?"—":minutesLabel(split.outWork))+"</td>"
      + "<td>"+escapeHtml(depCode(v.depFrom))+"</td>"
      + "<td>"+escapeHtml(depCode(v.depTo))+"</td>"
      + "<td>"+escapeHtml(v.rg||"—")+"</td>"
      + "<td>"+escapeHtml(vacationNotesDisplay(v)||"—")+"</td>"
      + "</tr>";
  }).join("");

  var html = "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\">"
    + "<title>"+escapeHtml(titleTxt)+"</title>"
    + "<style>"
    + "body{font-family:Georgia,'Iowan Old Style',serif;color:#111;margin:32px;}"
    + "h1{font-size:20px;margin:0 0 4px;}"
    + "h2{font-size:13px;color:#444;font-weight:400;margin:0 0 4px;}"
    + "p.meta{font-size:12px;color:#666;font-weight:400;margin:0 0 18px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;}"
    + "table{width:100%;border-collapse:collapse;font-size:12px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;}"
    + "th,td{border:1px solid #999;padding:6px 8px;text-align:left;}"
    + "th{background:#f2f2f2;}"
    + "p.total{margin-top:12px;font-size:13px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;}"
    + "p.disclaimer{margin-top:24px;font-size:10px;color:#666;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;}"
    + ".signature-block{margin-top:20px;text-align:right;}"
    + ".signature-block img{display:inline-block;max-width:220px;max-height:90px;border-bottom:1px solid #999;padding-bottom:4px;}"
    + ".signature-block p{margin:0 0 4px;font-size:10px;color:#666;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;}"
    + ".no-print{margin-top:24px;}"
    + ".no-print button{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;padding:10px 18px;border-radius:8px;border:1px solid #222;background:#111;color:#fff;cursor:pointer;}"
    + "@media print{ .no-print{ display:none; } }"
    + "</style></head><body>"
    + "<h1>"+escapeHtml(titleTxt)+"</h1>"
    + "<h2>"+escapeHtml(subTxt)+"</h2>"
    + (infoTxt ? "<p class=\"meta\">"+escapeHtml(infoTxt)+"</p>" : "")
    + "<table><thead><tr><th>Date</th><th>Nature</th><th>Début</th><th>Fin</th><th>Durée</th><th>Temps de travail</th><th>Hors temps de travail</th><th>Aller</th><th>Retour</th><th>RG</th><th>Notes</th></tr></thead>"
    + "<tbody>"+rowsHtml+"</tbody></table>"
    + "<p class=\"total\">Total du mois : "+escapeHtml(minutesLabel(total))+" — "+entries.length+" vacation(s).</p>"
    + "<p class=\"disclaimer\">Aller / Retour : D = Domicile, E = Entreprise.</p>"
    + "<p class=\"disclaimer\">Document généré le "+escapeHtml(new Date().toLocaleDateString("fr-FR"))+" — à vérifier avant transmission au greffe. Les durées indemnisables sont fixées par le Code du travail ; consultez le texte en vigueur pour toute question de plafond.</p>"
    + (state.profile.signature ? "<div class=\"signature-block\"><p>Signature du conseiller :</p><img src=\""+state.profile.signature+"\" alt=\"Signature\"></div>" : "")
    + "<div class=\"no-print\"><button onclick=\"window.print()\">Imprimer / Enregistrer en PDF</button></div>"
    + "</body></html>";

  toast("Préparation du document…");
  downloadsReady.then(function(){
    if(downloadsCap){
      downloadsCap.save({ filename:monthDocBaseName(mKey)+".html", data:html }).then(function(){
        toast("Fichier « "+monthDocBaseName(mKey)+".html » enregistré.");
      }).catch(function(err){
        if(err && err.code==="declined"){ toast("Téléchargement annulé."); return; }
        /* html refusé ici (formats étendus désactivés) ou autre échec :
           on bascule sur l’image, toujours téléchargeable. */
        exportVacationsImage(mKey, entries, total);
      });
    } else {
      exportVacationsImage(mKey, entries, total);
    }
  });
}

function exportVacationsCSV(mKey, entries){
  var lines = ["Date;Nature;Debut;Fin;Duree (min);Section;RG;Notes"];
  entries.forEach(function(v){
    var notes = vacationNotesDisplay(v).replace(/;/g,",").replace(/[\r\n]+/g," ");
    var row = [v.date, natureLabel(v.nature), v.actStart||"", v.actEnd||"", String(v.minutes), v.section||"", v.rg||"", notes];
    lines.push(row.join(";"));
  });
  var csv = "\uFEFF"+lines.join("\r\n");
  saveFile(monthDocBaseName(mKey), "csv", "txt", csv);
}

    h("input", {type:"checkbox", checked: checked?"checked":null, onchange:function(e){

function stepItemKeys(step){
  var keys=[];
  step.blocks.forEach(function(b){
    if(b.t==="checklist") b.v.forEach(function(item){ keys.push(step.id+"::"+item); });
    if(b.t==="subcase") b.v.forEach(function(item){ keys.push(step.id+"::"+item); });
  });
  return keys;
}
function updateGuideProgress(){
  var steps = getGuideSteps(); var gs = getGuideState();
  var totalKeys=0, doneKeys=0;
  steps.forEach(function(step){
    var keys = stepItemKeys(step);
    totalKeys += keys.length;
    var done = keys.filter(function(k){ return gs.checked.indexOf(k)!==-1; }).length;
    doneKeys += done;
    var card = document.getElementById("stepcard-"+step.id);
    if(card) card.classList.toggle("done", keys.length>0 && done===keys.length);
  });
  var fill = document.getElementById("guide-progress-fill");
  var label = document.getElementById("guide-progress-label");
  if(fill) fill.style.width = (totalKeys ? Math.round(doneKeys/totalKeys*100) : 0)+"%";
  if(label) label.textContent = doneKeys+" / "+totalKeys+" points vérifiés";
}

/* =================================================================
   CODE PERSONNEL PAR CONSEILLER
   ---------------------------------------------------------------
   Le code de section (voir module SYNCHRONISATION) donne accès aux
   données, mais ne prouve pas qu'un conseiller qui choisit une fiche
   dans « Qui êtes-vous ? » est bien la personne qu'il prétend être — rien
   n'empêcherait, par erreur ou volontairement, de choisir la fiche de
   quelqu'un d'autre. Le code personnel à 4 chiffres, généré par fiche et
   transmis individuellement par le président (en plus du code de section
   commun), ajoute une vérification : il faut connaître les DEUX pour lier
   son profil à une fiche précise.

   Seul le hachage (sectionMembers[].pinHash) circule entre appareils via
   la synchronisation — jamais le code en clair, qui reste uniquement dans
   state.localMemberPins, SUR L'APPAREIL qui l'a généré (ce champ n'est
   jamais inclus dans syncPayloadFromState). Limite assumée et à annoncer
   clairement : un code à 4 chiffres (10 000 combinaisons) ne résiste pas à
   quelqu'un qui aurait accès au hachage ET au temps/outils pour le casser
   localement — l'objectif est d'empêcher un mauvais clic ou une
   usurpation « au clic », pas de résister à un attaquant déterminé et
   technique. */
function generateMemberPin(){
  return String(Math.floor(Math.random()*10000)).padStart(4,"0");
}
function hashMemberPin(pin, memberId){
  var data = new TextEncoder().encode(pin+"|"+memberId);
  return crypto.subtle.digest("SHA-256", data).then(function(buf){
    var bytes = new Uint8Array(buf);
    var hex = "";
    for(var i=0;i<bytes.length;i++) hex += bytes[i].toString(16).padStart(2,"0");
    return hex;
  });
}

/* Construit le couple <select> de syndicat + champ de précision "AUTRE",
   réutilisé à la fois dans la fiche d'un conseiller (voir
   openSectionMemberForm) et dans la création d'une section depuis
   l'espace administrateur (voir openAdminCreateSectionSheet et
   openAdminMemberForm). getCollege() doit
   retourner le collège actuellement choisi par le formulaire appelant
   (pour calculer la bonne liste — voir syndicatOptionsForCollege) ;
   initialValue est la valeur déjà enregistrée le cas échéant. Une valeur
   qui ne figure dans aucune liste (donnée antérieure à ces listes, ou
   correspondant à l'autre collège) est rattachée à "AUTRE" avec la valeur
   d'origine reprise dans le champ de précision, plutôt que d'être perdue
   silencieusement au premier enregistrement. Appeler rebuild() chaque fois
   que le collège change. */
function createSyndicatField(getCollege, initialValue){
  var sel = h("select", null);
  var autreIn = h("input", {type:"text", style:"margin-top:8px", placeholder:"Précisez le syndicat / l'organisation"});
  function currentSelection(){
    if(!sel.options.length) return initialValue || "";
    return sel.value==="AUTRE" ? (autreIn.value.trim() || "AUTRE") : sel.value;
  }
  function updateAutreVisibility(){ autreIn.style.display = sel.value==="AUTRE" ? "" : "none"; }
  function rebuild(){
    var priorValue = currentSelection();
    var list = syndicatOptionsForCollege(getCollege());
    var known = priorValue && priorValue!=="AUTRE" && list.indexOf(priorValue)!==-1;
    var showAutre = !!priorValue && !known;
    clear(sel);
    sel.appendChild(h("option", {value:""}, "— Non précisé —"));
    list.forEach(function(s){
      sel.appendChild(h("option", {value:s, selected: (known ? s===priorValue : (showAutre && s==="AUTRE")) ? "selected" : null}, s));
    });
    autreIn.value = (showAutre && priorValue!=="AUTRE") ? priorValue : "";
    updateAutreVisibility();
  }
  sel.addEventListener("change", updateAutreVisibility);
  rebuild();
  return {
    select: sel, autreInput: autreIn, rebuild: rebuild,
    getValue: function(){ return sel.value==="AUTRE" ? autreIn.value.trim() : sel.value; }
  };
}

/* =================================================================
   IMPORT JSON DE LA LISTE DES CONSEILLERS (bouton discret, réservé au
   président de section, en bas de « Acteurs de ma section »).
   Deux formes de fichier acceptées, pour rester compatible aussi bien
   avec un fichier préparé à la main qu'avec un export déjà produit par
   l'application (sectionBroadcastPayload, qui porte un tableau
   "members") :
     - un tableau brut  [{nom, prenom, college, syndicat, email, tel}, …]
     - un objet portant un tableau "members" de cette même forme.
   ================================================================= */
function normalizeMembersImportPayload(parsed){
  var list = Array.isArray(parsed) ? parsed
    : (parsed && Array.isArray(parsed.members)) ? parsed.members
    : null;
  if(!list) return null;
  return list
    .filter(function(m){ return m && typeof m==="object" && ((m.nom||"").toString().trim() || (m.prenom||"").toString().trim()); })
    .map(function(m){
      var college = (m.college||"").toString().trim();
      return {
        nom: (m.nom||"").toString().trim(),
        prenom: (m.prenom||"").toString().trim(),
        college: COLLEGES.indexOf(college)!==-1 ? college : "",
        syndicat: (m.syndicat||"").toString().trim(),
        email: (m.email||"").toString().trim(),
        tel: (m.tel||"").toString().trim()
      };
    });
}
/* Fusionne la liste importée dans state.sectionMembers : un conseiller
   existant (même nom+prénom+collège, comparaison insensible à la casse)
   est mis à jour (seuls les champs non vides du fichier écrasent les
   champs existants — un champ vide dans le fichier ne supprime jamais
   une information déjà enregistrée) ; sinon une nouvelle fiche est
   créée. Jamais destructeur : aucune fiche existante n'est supprimée. */
/* Renvoie désormais une promesse (plutôt que les stats directement) : un
   code personnel doit être généré et haché — voir le module CODE PERSONNEL
   PAR CONSEILLER — pour chaque fiche NOUVELLEMENT créée par l'import ; les
   fiches déjà existantes conservent leur code personnel actuel sans jamais
   le régénérer via un import. */
function mergeMembersImport(list){
  var stats = { added:0, updated:0 };
  var newEntries = [];
  function norm(s){ return (s||"").trim().toLocaleLowerCase("fr-FR"); }
  list.forEach(function(m){
    var existing = state.sectionMembers.filter(function(x){
      return norm(x.nom)===norm(m.nom) && norm(x.prenom)===norm(m.prenom) && (x.college||"")===m.college;
    })[0];
    if(existing){
      if(m.syndicat) existing.syndicat = m.syndicat;
      if(m.email) existing.email = m.email;
      if(m.tel) existing.tel = m.tel;
      stats.updated++;
    } else {
      var entry = { id:uid(), nom:m.nom, prenom:m.prenom, college:m.college, syndicat:m.syndicat, email:m.email, tel:m.tel, pinHash:null, sectionRole:null };
      state.sectionMembers.push(entry);
      newEntries.push(entry);
      stats.added++;
    }
  });
  return Promise.all(newEntries.map(function(entry){
    var pin = generateMemberPin();
    return hashMemberPin(pin, entry.id).then(function(hash){
      entry.pinHash = hash;
      state.localMemberPins[entry.id] = pin;
    });
  })).then(function(){ return stats; });
}

/* Pendant équivalent, côté espace administrateur, de mergeMembersImport :

    if(existing){

      stats.updated++;
    } else {

      adminBuffer.sectionMembers.push(entry);

  });
  var newPins = [];
  return Promise.all(newEntries.map(function(entry){
    var pin = generateMemberPin();

}

/* --- Import JSON du planning, côté espace administrateur uniquement ---
   Pendant de normalizeMembersImportPayload/mergeMembersImportAdmin pour le
   planning (voir échange avec l'utilisateur : « vérifier que l'admin peut
   bien gérer le planning... en fichier json »). Format attendu : soit un
   tableau d'entrées, soit un export contenant un tableau "planning" (même
   souplesse que l'import d'annuaire). Chaque entrée réfère les personnes
   par nom+prénom plutôt que par identifiant interne — les identifiants
   sont propres à chaque appareil et ne correspondraient jamais d'un
   import à l'autre :
     {
       "type": "bj" | "bco" | "bco-mee",
       "date": "AAAA-MM-JJ",
       "college": "Salarié" | "Employeur",
       "presidence": "Salarié" | "Employeur",
       "president": {"nom": "...", "prenom": "..."} | null,
       "assesseurs": [{"nom": "...", "prenom": "..."}, ...]
     }
   Chaque nom est résolu parmi adminBuffer.sectionMembers, dans le collège
   de l'entrée (voir openAdminAudienceForm : les rôles d'une date se
   choisissent toujours parmi les conseillers du collège de la date, quelle
   que soit la présidence) — un nom non trouvé n'empêche pas l'import du
   reste de l'entrée, il est seulement signalé après coup (voir
   mergeAdminPlanningImport) pour être corrigé à la main, puis récupéré en
   réimportant le même fichier une fois l'annuaire complété. Une date déjà
   présente (même date+type+collège) est mise à jour plutôt que dupliquée,
   ce qui rend l'import rejouable sans risque. */
function normalizePlanningImportPayload(parsed){
  var list = Array.isArray(parsed) ? parsed
    : (parsed && Array.isArray(parsed.planning)) ? parsed.planning
    : null;
  if(!list) return null;
  var typeIds = PLANNING_TYPES.map(function(t){ return t.id; });
  function normPerson(p){
    if(!p || typeof p!=="object") return null;
    var nom = (p.nom||"").toString().trim(), prenom = (p.prenom||"").toString().trim();
    if(!nom && !prenom) return null;
    return {nom:nom, prenom:prenom};
  }
  return list
    .filter(function(e){
      return e && typeof e==="object" && typeIds.indexOf(e.type)!==-1
        && /^\d{4}-\d{2}-\d{2}$/.test(e.date||"")
        && COLLEGES.indexOf(e.college)!==-1 && COLLEGES.indexOf(e.presidence)!==-1;
    })
    .map(function(e){
      return {
        type: e.type, date: e.date, college: e.college, presidence: e.presidence,
        president: normPerson(e.president),
        assesseurs: (Array.isArray(e.assesseurs) ? e.assesseurs : []).map(normPerson).filter(Boolean)
      };
    });
}
function mergeAdminPlanningImport(list){
  var stats = {added:0, updated:0};
  var unresolvedSet = {};
  function norm(s){ return (s||"").trim().toLocaleLowerCase("fr-FR"); }
  function resolve(person, college){
    if(!person) return null;
    var m = adminBuffer.sectionMembers.filter(function(x){
      return (x.college||"")===college && norm(x.nom)===norm(person.nom) && norm(x.prenom)===norm(person.prenom);
    })[0];
    if(!m){
      var label = [person.nom ? person.nom.toUpperCase() : "", person.prenom||""].filter(Boolean).join(" ")+" ("+college+")";
      unresolvedSet[label] = true;
      return null;
    }
    return m.id;
  }
  list.forEach(function(e){
    var president = resolve(e.president, e.college);
    var assesseurs = e.assesseurs.map(function(p){ return resolve(p, e.college); }).filter(Boolean);
    var existing = adminBuffer.planning.filter(function(p){
      return p.date===e.date && p.type===e.type && p.college===e.college;
    })[0];
    if(existing){
      existing.presidence = e.presidence;
      existing.president = president;
      existing.assesseurs = assesseurs;
      stats.updated++;
    } else {
      adminBuffer.planning.push({
        id: uid(), type:e.type, date:e.date, college:e.college, presidence:e.presidence,
        president: president, assesseurs: assesseurs, importSourceId: null
      });
      stats.added++;
    }
  });
  stats.unresolved = Object.keys(unresolvedSet).sort();
  return stats;
}

function memberSortCompare(a, b){
  var an = (a.nom||"").toLocaleLowerCase("fr-FR"), bn = (b.nom||"").toLocaleLowerCase("fr-FR");
  if(an !== bn) return an < bn ? -1 : 1;
  var ap = (a.prenom||"").toLocaleLowerCase("fr-FR"), bp = (b.prenom||"").toLocaleLowerCase("fr-FR");
  return ap < bp ? -1 : ap > bp ? 1 : 0;
}
function memberDisplayName(m){
  return (m.nom ? m.nom.toUpperCase() : "") + (m.prenom ? (m.nom ? " " : "")+m.prenom : "");
}
/* Libellé de l'étiquette sectionRole (voir module ADMINISTRATION GÉNÉRALE)
   — null/"none" pour un simple conseiller, sans fonction particulière. */
function sectionRoleLabel(role){
  return role==="president" ? "Président(e) de section"
    : role==="vice-president" ? "Vice-président(e) de section"
    : null;
}
/* Compteurs automatiques BJ/BCO d'un conseiller, calculés à partir des
   dates enregistrées dans l'Outil de planification (BJ d'une part, BCO et
   BCO MEE combinés d'autre part — la fiche n'affiche qu'un seul compteur
   BCO). Un conseiller compte dans une date s'il en est le président ou
   l'un des assesseurs. */
function memberAudienceStats(member){
  var today = todayISO();
  var stats = { bjPast:0, bjUpcoming:0, bcoPast:0, bcoUpcoming:0 };
  state.planning.forEach(function(pl){
    var involved = pl.president===member.id || pl.assesseurs.indexOf(member.id)!==-1;
    if(!involved) return;
    var past = pl.date < today;
    if(pl.type==="bj"){
      if(past) stats.bjPast++; else stats.bjUpcoming++;
    } else {
      if(past) stats.bcoPast++; else stats.bcoUpcoming++;
    }
  });
  return stats;
}
/* Sheet dédiée aux statistiques d'audiences d'un conseiller (BJ/BCO,
   passés/à venir/totaux) — séparée de la fiche elle-même (voir
   openSectionMemberView) et accessible via son bouton « Voir ses
   stats », pour que la fiche reste courte et rapide à consulter. */

  var stats = memberAudienceStats(member);

  body.appendChild(h("div", {class:"stat-row"},
    h("div", {class:"stat-box"}, h("div", {class:"n"}, String(stats.bcoPast)), h("div", {class:"l"}, "BCO passés")),
    h("div", {class:"stat-box"}, h("div", {class:"n"}, String(stats.bcoUpcoming)), h("div", {class:"l"}, "BCO à venir")),
    h("div", {class:"stat-box"}, h("div", {class:"n"}, String(bcoTotal)), h("div", {class:"l"}, "BCO totaux"))
  ));

  body.appendChild(h("div", {class:"footnote", style:"margin-top:14px"}, "Ces compteurs sont calculés automatiquement à partir des dates enregistrées dans l’Outil de planification."));
  body.appendChild(h("button", {class:"sheet-btn ghost", style:"margin-top:18px", onclick:function(){
    closeSheet();
    openSectionMemberView(member);

  openSheet("Statistiques — "+(memberDisplayName(member) || "conseiller"), body);

function openSectionMemberView(member){

      h("button", {class:"sheet-btn danger", onclick:function(){
        state.sectionMembers = state.sectionMembers.filter(function(m){ return m.id!==member.id; });

      }}, "Supprimer définitivement"),
      h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Annuler")
    ));
  }}, "Supprimer cette fiche"));
  actions.appendChild(h("button", {class:"sheet-btn ghost", onclick:closeSheet}, "Fermer"));
